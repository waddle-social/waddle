# Dagger workspace configuration
# Install modules with: dagger module install <module>
# Example:
#   dagger module install github.com/dagger/dagger/modules/wolfi

[modules]

[modules.typescript-sdk]
source = "github.com/dagger/typescript-sdk"

[sdks.typescript]
module = "typescript-sdk"

[modules.waddle-server]
source = "server/dagger"

[sdks.typescript.scopes."server/dagger"]
is-module = true
name = "waddle-server"

[sdks.typescript.scopes."server/dagger".settings]
runtime = "bun"
