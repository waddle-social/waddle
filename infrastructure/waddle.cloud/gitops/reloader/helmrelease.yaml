apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 30m
  chart:
    spec:
      chart: reloader
      version: 2.2.x
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: reloader
      interval: 12h
  values:
    reloader:
      watchGlobally: true
