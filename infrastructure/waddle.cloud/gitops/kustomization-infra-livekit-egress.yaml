apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-livekit-egress
  namespace: flux-system
spec:
  # Egress connects to a running SFU and authenticates with secrets from
  # 1Password, so it orders after both the SFU and the secret stack.
  dependsOn:
    - name: infra-livekit-sfu
    - name: infra-onepassword-connect
    - name: infra-external-secrets
    - name: infra-cilium-gateway
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: livekit-egress
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: livekit-egress
      namespace: livekit
