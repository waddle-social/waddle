apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ${WADDLE_STORAGE_CLASS_NAME}
  annotations:
    storageclass.kubernetes.io/is-default-class: "${WADDLE_STORAGE_CLASS_DEFAULT}"
provisioner: io.openebs.csi-mayastor
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  protocol: nvmf
  repl: "${WADDLE_STORAGE_REPLICA_COUNT}"
  thin: "true"
  fsType: xfs
