apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-spicedb-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-spicedb-operator-source
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: spicedb-operator
    namespace: flux-system
  targetNamespace: spicedb-operator
