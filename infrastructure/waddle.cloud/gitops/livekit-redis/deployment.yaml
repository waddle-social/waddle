apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-redis
  namespace: livekit
  labels:
    app.kubernetes.io/name: livekit-redis
    app.kubernetes.io/instance: livekit-redis
    app.kubernetes.io/component: message-bus
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Stateless coordination bus only — egress jobs are transient; never
  # roll two Redis pods (a split bus would desync SFU↔egress dispatch).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit-redis
      app.kubernetes.io/instance: livekit-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit-redis
        app.kubernetes.io/instance: livekit-redis
        app.kubernetes.io/component: message-bus
    spec:
      serviceAccountName: livekit-redis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          # Pure message bus: disable both persistence engines so the pod
          # holds no state and restarts clean.
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
