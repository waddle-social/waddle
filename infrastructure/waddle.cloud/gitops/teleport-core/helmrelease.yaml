apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teleport
  namespace: teleport
spec:
  interval: 30m
  chart:
    spec:
      chart: teleport-cluster
      version: 18.7.3
      sourceRef:
        kind: HelmRepository
        name: teleport
        namespace: teleport
      interval: 12h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: teleport
    chartMode: standalone
    clusterName: teleport.waddle.social
    kubeClusterName: ${WADDLE_CLUSTER_ENVIRONMENT}
    proxyListenerMode: multiplex
    publicAddr:
      - teleport.waddle.social:443
    authentication:
      type: github
      connectorName: github
      localAuth: false
    service:
      type: ClusterIP
    ingress:
      enabled: true
      useExisting: true
      suppressAutomaticWildcards: true
    highAvailability:
      replicaCount: 1
    proxy:
      highAvailability:
        replicaCount: 1
    persistence:
      enabled: true
      volumeSize: 10Gi
      storageClassName: openebs-mayastor
    operator:
      enabled: true
    podSecurityPolicy:
      enabled: false
