apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: livekit-secrets
  namespace: livekit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: livekit-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        values.yaml: |
          livekit:
            keys:
              {{ .apiKey | quote }}: {{ .apiSecret | quote }}
            redis:
              password: {{ .redisPassword | quote }}
        redis-password: "{{ .redisPassword }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: waddle-livekit
        property: api-key
    - secretKey: apiSecret
      remoteRef:
        key: waddle-livekit
        property: api-secret
    - secretKey: redisPassword
      remoteRef:
        key: waddle-livekit
        property: redis-password
