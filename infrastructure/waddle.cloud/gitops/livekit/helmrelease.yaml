apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: livekit-server
  namespace: livekit
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: livekit-server
      sourceRef:
        kind: HelmRepository
        name: livekit
        namespace: livekit
      interval: 12h
  valuesFrom:
    - kind: Secret
      name: livekit-secrets
      valuesKey: values.yaml
  values:
    replicaCount: 1
    loadBalancer:
      type: disable
      servicePort: 80
    podHostNetwork: true
    livekit:
      port: 7880
      log_level: info
      rtc:
        tcp_port: 7881
        udp_port: 7882
        use_external_ip: true
      redis:
        address: livekit-redis.livekit.svc.cluster.local:6379
    resources:
      requests:
        cpu: 1000m
        memory: 1Gi
      limits:
        cpu: 4000m
        memory: 4Gi
