apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-onepassword-connect
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-external-secrets
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./onepassword-connect
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: bootstrap
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: onepassword-connect
      namespace: 1password
