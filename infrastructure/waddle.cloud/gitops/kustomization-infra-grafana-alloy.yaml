apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-grafana-alloy
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-onepassword-connect
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./grafana-alloy
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: bootstrap
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: grafana-alloy
      namespace: grafana-alloy
