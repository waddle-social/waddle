apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cloudnative-pg
  namespace: flux-system
spec:
  dependsOn:
    - name: openebs-postinstall
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./cloudnative-pg
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: bootstrap
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudnative-pg
      namespace: cnpg-system
