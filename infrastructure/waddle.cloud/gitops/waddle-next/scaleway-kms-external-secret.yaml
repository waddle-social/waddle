apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scaleway-kms-secret
  namespace: waddle-next
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: scaleway-kms-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          reconcile.fluxcd.io/watch: "Enabled"
  data:
    - secretKey: auth-token
      remoteRef:
        key: waddle-next-scaleway-kms
        property: auth-token
