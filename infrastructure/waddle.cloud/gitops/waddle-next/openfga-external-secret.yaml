apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openfga-auth
  namespace: waddle-next
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openfga-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          reconcile.fluxcd.io/watch: "Enabled"
  data:
    - secretKey: api-token
      remoteRef:
        key: waddle-next-openfga
        property: preshared-key
