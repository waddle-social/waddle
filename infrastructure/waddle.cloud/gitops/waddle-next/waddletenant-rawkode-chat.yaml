apiVersion: waddle.social/v1alpha1
kind: WaddleTenant
metadata:
  name: rawkode-chat
  namespace: waddle-next
  labels:
    app.kubernetes.io/part-of: waddle-next
spec:
  serverRef:
    name: waddle
  # XMPP domain: users are user@rawkode.chat; the server is reached at
  # waddle.rawkode.chat and the web client is served from rawkode.chat.
  tenantId: rawkode.chat
  placementMode: SharedPool
  owners:
    - rawkode
  auth:
    providers:
      - id: rawkode-academy
        displayName: Rawkode Academy
        kind: oidc
        clientId: waddle-rawkode-chat
        issuer: https://id.rawkode.academy
        scopes:
          - openid
          - profile
          - email
        usernameClaim: preferred_username
        emailClaim: email
  corsOrigins:
    - https://rawkode.chat
  ingress:
    mode: CustomDomain
    hostnames:
      - waddle.rawkode.chat
  quotas:
    maxConcurrentConnections: 2000
    maxRooms: 1000
    maxStorageBytes: 10737418240
    maxInferenceSpendMicrocents: 100000000
  extensions:
    enabledPlugins:
      - ai-chatbot
      - jev-judgments
    approvedProviders:
      - openrouter
    approvedModels:
      - anthropic/claude-sonnet-4
      - anthropic/claude-haiku-4.5
      - openai/gpt-4o-mini
    zdrRequired: true
