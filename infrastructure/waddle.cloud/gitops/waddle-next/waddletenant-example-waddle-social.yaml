apiVersion: waddle.social/v1alpha1
kind: WaddleTenant
metadata:
  name: example-waddle-social
  namespace: waddle-next
  labels:
    app.kubernetes.io/part-of: waddle-next
spec:
  serverRef:
    name: waddle
  tenantId: example.waddle.social
  placementMode: SharedPool
  owners:
    - rawkode
    - icepuma
    - randax
  authProvidersSecretRef:
    name: waddle-runtime-secrets
    key: WADDLE_AUTH_PROVIDERS_JSON
  ingress:
    mode: ManagedSubdomain
  quotas:
    maxConcurrentConnections: 2000
    maxRooms: 1000
    maxStorageBytes: 10737418240
    maxInferenceSpendMicrocents: 100000000
  extensions:
    enabledPlugins:
      - ai-chatbot
      - jev-judgments
    approvedProviders:
      - openrouter
    approvedModels:
      - anthropic/claude-sonnet-4
      - anthropic/claude-haiku-4.5
      - openai/gpt-4o-mini
    zdrRequired: true
