apiVersion: waddle.social/v1alpha1
kind: WaddleTenant
metadata:
  name: waddle-social
  namespace: waddle-next
  labels:
    app.kubernetes.io/part-of: waddle-next
spec:
  serverRef:
    name: waddle
  tenantId: waddle.social
  placementMode: SharedPool
  owners:
    - rawkode
    - icepuma
    - randax
  auth:
    providers:
      - id: colony
        displayName: Colony
        kind: oidc
        dynamicClientRegistration: true
        requireDpop: true
        issuer: https://colony.waddle.social
        scopes:
          - openid
          - profile
          - email
        usernameClaim: preferred_username
        emailClaim: email
  ingress:
    mode: Disabled
    hostnames:
      - waddle.social
      - next.apps.waddle.chat
  quotas:
    maxConcurrentConnections: 2000
    maxRooms: 1000
    maxStorageBytes: 10737418240
    maxInferenceSpendMicrocents: 100000000
  extensions:
    enabledPlugins:
      - ai-chatbot
      - jev-judgments
    approvedProviders:
      - openrouter
    approvedModels:
      - anthropic/claude-sonnet-4
      - anthropic/claude-haiku-4.5
      - openai/gpt-4o-mini
    zdrRequired: true
