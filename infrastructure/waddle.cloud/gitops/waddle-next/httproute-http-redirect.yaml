apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: waddle-next-http-redirect
  namespace: waddle-next
spec:
  parentRefs:
    - name: waddle-gateway
      namespace: default
      sectionName: http
  hostnames:
    - next.apps.waddle.chat
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
