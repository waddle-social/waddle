apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: waddle-livekit-config
  namespace: waddle-next
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: waddle-livekit-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels:
          reconcile.fluxcd.io/watch: "Enabled"
      data:
        LIVEKIT_WS_URL: "wss://sfu.waddle.social"
        LIVEKIT_TURN_HOST: "turn.waddle.social"
        LIVEKIT_TURN_TLS_PORT: "443"
        LIVEKIT_TURN_UDP_PORT: "30478"
  data:
    - secretKey: LIVEKIT_API_KEY
      remoteRef:
        key: livekit-sfu
        property: api-key
    - secretKey: LIVEKIT_API_SECRET
      remoteRef:
        key: livekit-sfu
        property: api-secret
    - secretKey: LIVEKIT_WEBHOOK_SECRET
      remoteRef:
        key: livekit-sfu
        property: webhook-secret
    - secretKey: LIVEKIT_TURN_SHARED_SECRET
      remoteRef:
        key: livekit-sfu
        property: turn-shared-secret
