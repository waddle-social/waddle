apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga
  namespace: waddle-next
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/component: authz
    app.kubernetes.io/part-of: waddle-next
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openfga
      app.kubernetes.io/component: authz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfga
        app.kubernetes.io/component: authz
        app.kubernetes.io/part-of: waddle-next
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openfga
          image: openfga/openfga:v1.11.1
          imagePullPolicy: IfNotPresent
          args:
            - run
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: sqlite
            - name: OPENFGA_DATASTORE_URI
              value: "file:/var/lib/openfga/openfga.db?_journal_mode=WAL&_busy_timeout=5000"
            - name: OPENFGA_AUTHN_METHOD
              value: preshared
            - name: OPENFGA_AUTHN_PRESHARED_KEYS
              valueFrom:
                secretKeyRef:
                  name: openfga-auth
                  key: api-token
            - name: OPENFGA_HTTP_ADDR
              value: "0.0.0.0:8080"
            - name: OPENFGA_GRPC_ADDR
              value: "0.0.0.0:8081"
            - name: OPENFGA_PLAYGROUND_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/openfga
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openfga-data
        - name: tmp
          emptyDir: {}
