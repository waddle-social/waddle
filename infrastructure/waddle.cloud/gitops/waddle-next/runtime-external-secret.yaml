apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: waddle-runtime-secrets
  namespace: waddle-next
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: waddle-runtime-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels:
          reconcile.fluxcd.io/watch: "Enabled"
      # No static OpenRouter API key is mounted here; inference provider
      # credentials are enrolled per-user/tenant through the broker via
      # client-sealed `urn:waddle:credential:1` XMPP IQs.
      data:
        # Sign-in providers are declared per tenant in each WaddleTenant's
        # `spec.auth.providers`; multi-tenant servers ignore
        # WADDLE_AUTH_PROVIDERS_JSON.
        WADDLE_RUNTIME_SECRETS_CHECKSUM: >-
          {{ printf "%s:%s:%s:%s:%s" .WADDLE_SESSION_KEY .WADDLE_OCCUPANT_ID_SECRET .WADDLE_S3_ACCESS_KEY_ID .WADDLE_S3_SECRET_ACCESS_KEY .WADDLE_PROVIDER_GITHUB_WEBHOOK_SECRET | sha256sum }}
  data:
    - secretKey: WADDLE_SESSION_KEY
      remoteRef:
        key: waddle-next-runtime
        property: session-key
    - secretKey: WADDLE_OCCUPANT_ID_SECRET
      remoteRef:
        key: waddle-next-runtime
        property: occupant-id-secret
    - secretKey: WADDLE_S3_ACCESS_KEY_ID
      remoteRef:
        key: server-runtime-production
        property: r2-access-key-id
    - secretKey: WADDLE_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: server-runtime-production
        property: r2-secret-access-key
    - secretKey: WADDLE_PROVIDER_GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: server-runtime-production
        property: github-app-webhook-secret
