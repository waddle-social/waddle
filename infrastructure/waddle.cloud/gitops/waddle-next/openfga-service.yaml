apiVersion: v1
kind: Service
metadata:
  name: openfga
  namespace: waddle-next
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/component: authz
    app.kubernetes.io/part-of: waddle-next
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/component: authz
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 8081
      targetPort: grpc
      protocol: TCP
