apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: waddle-next
  namespace: waddle-next
spec:
  parentRefs:
    - name: waddle-gateway
      namespace: default
      sectionName: https
  hostnames:
    - next.apps.waddle.chat
  rules:
    - backendRefs:
        - name: waddle
          port: 3000
