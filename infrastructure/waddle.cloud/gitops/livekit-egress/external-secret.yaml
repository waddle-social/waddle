apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: livekit-egress
  namespace: livekit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: livekit-egress
    creationPolicy: Owner
  data:
    # SFU authentication. A DEDICATED egress key/secret pair (distinct
    # from the room-JWT `api-key` and the `webhook-key`) so an egress
    # credential leak cannot forge room-join tokens or webhook
    # deliveries. `egress-secret` must also be present in the SFU
    # `keys.yaml` (added to the same livekit-sfu 1Password item) so the
    # SFU accepts the egress worker.
    - secretKey: apiKey
      remoteRef:
        key: livekit-sfu
        property: egress-key
    - secretKey: apiSecret
      remoteRef:
        key: livekit-sfu
        property: egress-secret
    # Cloudflare R2 upload credentials. Reuses the existing server
    # runtime R2 keys that already write to `waddle-social-files`; no new
    # R2 token is minted for egress.
    - secretKey: s3AccessKey
      remoteRef:
        key: server-runtime-production
        property: r2-access-key-id
    - secretKey: s3Secret
      remoteRef:
        key: server-runtime-production
        property: r2-secret-access-key
