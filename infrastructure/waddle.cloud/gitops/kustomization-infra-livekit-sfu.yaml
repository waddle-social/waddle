apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-livekit-sfu
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-onepassword-connect
    - name: infra-external-secrets
    - name: infra-cilium-gateway
    - name: infra-external-dns
  interval: 10m
  retryInterval: 1m
  # coturn preStop waits for active allocations, bounded at four hours.
  timeout: 4h15m
  path: ./
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: livekit-sfu
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: coturn
      namespace: livekit
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: livekit-sfu
      namespace: livekit
