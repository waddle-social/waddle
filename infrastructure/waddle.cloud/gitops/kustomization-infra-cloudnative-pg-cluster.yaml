apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cloudnative-pg-cluster
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-cloudnative-pg
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./cloudnative-pg-cluster
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: bootstrap
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: waddle
      namespace: waddle
