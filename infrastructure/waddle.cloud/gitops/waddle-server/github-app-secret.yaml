# Syncs GitHub App credentials from 1Password into a Kubernetes Secret.
# The Secret is mounted as a file volume (see HelmRelease extraVolumes) so that
# the github-enricher extension can read the private key via config_secret_files
# without ever exposing it as a plain-text env var.
#
# Operator note: ensure the 1Password vault item "waddle-github-app" exposes a
# value addressable as `private-key.pem` via the Connect provider. That can be a
# field label on a Password item or a file name on a Document item.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: waddle-github-app-credentials
  namespace: waddle
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: waddle-github-app-credentials
    creationPolicy: Owner
  data:
    # The key name here becomes the filename when the Secret is mounted as a volume.
    - secretKey: private-key
      remoteRef:
        key: waddle-github-app
        property: private-key.pem
