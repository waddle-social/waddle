apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: waddle-apns-production
  namespace: waddle
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: waddle-apns-production
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels:
          reconcile.fluxcd.io/watch: "Enabled"
      data:
        WADDLE_APNS_SECRETS_CHECKSUM: >-
          {{ printf "%s" .WADDLE_APNS_KEY_PEM | sha256sum }}
  data:
    - secretKey: WADDLE_APNS_KEY_PEM
      remoteRef:
        key: app-apple
        # `file/` explicitly selects the attachment for any supported item
        # category, rather than treating its name as a field label.
        property: file/notifications.p8
