apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: waddle-livekit-config
  namespace: waddle
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: waddle-livekit-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels:
          reconcile.fluxcd.io/watch: "Enabled"
      # Plain `envFrom: secretRef` mounts every key under this
      # Secret as a process env var. Names match the schema
      # `waddle-sfu::SfuConfig::from_env` consumes.
      data:
        LIVEKIT_WS_URL: "wss://livekit.waddle.social"
        LIVEKIT_TURN_HOST: "turn.waddle.social"
        LIVEKIT_TURN_TLS_PORT: "443"
        LIVEKIT_TURN_UDP_PORT: "3478"
  data:
    # API key + secret for the LiveKit room JWT signer. Stored on
    # the LiveKit SFU side under the `livekit-sfu-api-keys` Secret
    # (key `keys.yaml`); mirrored here as separate env-var keys so
    # the waddle-server pod can read them via `envFrom`.
    - secretKey: LIVEKIT_API_KEY
      remoteRef:
        key: livekit-sfu-production
        property: api-key
    - secretKey: LIVEKIT_API_SECRET
      remoteRef:
        key: livekit-sfu-production
        property: api-secret
    # HMAC-SHA1 shared secret for coturn's TURN REST credential
    # mechanism (XEP-0215 entries are minted from this).
    - secretKey: LIVEKIT_TURN_SHARED_SECRET
      remoteRef:
        key: livekit-sfu-production
        property: turn-shared-secret
