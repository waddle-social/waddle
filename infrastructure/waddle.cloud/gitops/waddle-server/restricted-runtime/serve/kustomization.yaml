# Restricted PostgreSQL runtime, serving half (#2116).
#
# Listed under `components:` in ../../kustomization.yaml, after
# restricted-runtime/prepare. The server connects as the runtime login and
# starts from the handoff the owner Job published. Until that handoff exists
# the chart keeps the Deployment at zero replicas (`handoff.awaitOwnerJob`),
# so a fresh install renders the owner CronJob in the same release
# (docs/runbooks/fresh-production-install.md).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - path: helmrelease-serve.yaml
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: waddle-server
  # The chart sets WADDLE_DATABASE_URL from the runtime credential and
  # refuses a second definition. The `test` makes this patch fail, rather
  # than remove another variable, if the list has been reordered.
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: waddle-server
    patch: |-
      - op: test
        path: /spec/values/containerExtraEnv/9/name
        value: WADDLE_DATABASE_URL
      - op: remove
        path: /spec/values/containerExtraEnv/9
