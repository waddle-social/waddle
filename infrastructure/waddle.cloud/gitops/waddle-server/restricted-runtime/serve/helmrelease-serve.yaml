apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: waddle-server
  namespace: waddle
spec:
  values:
    restrictedRuntime:
      enabled: true
      handoff:
        # Zero replicas instead of a failed render while no handoff has been
        # published; a serving Deployment is never scaled down for this.
        awaitOwnerJob: true
