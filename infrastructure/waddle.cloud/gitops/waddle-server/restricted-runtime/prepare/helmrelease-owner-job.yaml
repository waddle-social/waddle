apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: waddle-server
  namespace: waddle
spec:
  values:
    restrictedRuntime:
      schema: public
      database:
        host: postgresql-rw
        port: 5432
        name: waddle
        caSecret:
          name: postgresql-ca
          key: ca.crt
      roles:
        migratorLogin: waddle_migrator
        schemaOwner: waddle_owner
        runtimeLogin: waddle_runtime
        attestorInstallerLogin: waddle_attestor_installer
        attestorDefinerRole: waddle_attestor
        attestorSchema: waddle_attestation
      # kubernetes.io/basic-auth Secrets the operator supplies; the same
      # Secrets set the role passwords through the Cluster's managed roles.
      credentials:
        runtime:
          secretName: postgresql-waddle-runtime
        migrator:
          secretName: postgresql-waddle-migrator
        attestorInstaller:
          secretName: postgresql-waddle-attestor-installer
      ownerJob:
        enabled: true
        # Generated (`uuidgen`) for the fresh install of this database
        # (docs/runbooks/fresh-production-install.md). The keypool generation
        # and the installation operation ID stay the same on every later run
        # of the Job against this database. Generate new values when the
        # database is created again, so that records of different databases
        # never share an ID. The chart refuses the all-zero operation ID and
        # generation; `emit-handoff` refuses an all-zero or repeated record
        # ID.
        keypoolGeneration: 87993d52-f846-42f7-b1ee-e79d2b2ee10e
        installationOperationId: 83cb8320-75b1-473f-b189-3df0ef165700
        # A fresh database has no keypair-slot table of an older server, so
        # the owner phase takes no legacy retirement arguments.
        ownerPhaseExtraArgs: []
        cutover:
          transition_id: 9488eb46-0758-47c4-863f-e48b0d3d848d
          primary:
            provider: cloudnative-pg
            cluster_id: waddle/postgresql
            instance_id: postgresql-rw
            endpoint_host: postgresql-rw
            endpoint_port: 5432
            observation_record_id: 6a9484f5-368d-44c3-beae-18feafc9ab77
          # `waddle` is the login CloudNativePG creates as the database owner
          # at bootstrap; provisioning takes its ownership away and it never
          # serves. `role_oid` is its OID in the running cluster:
          #   SELECT oid FROM pg_roles WHERE rolname = 'waddle'
          # 0 is refused by `emit-handoff`; set it once the cluster exists.
          old_runtime:
            login: waddle
            role_oid: 16384
            credential_cutoff_record_id: 5bf02b86-f396-4177-98b3-ca83c4789b3b
          listener_cutoff_record_id: 490016fa-4f85-485b-83d2-fd78d6150c7c
          backend_cutoff_record_id: 3156be4d-256a-48de-9f0e-b42673100052
          prepared_transaction_cutoff_record_id: c28d4ec0-9f1e-4453-8da1-802d9e3d81d3
          mutator_policy:
            mode: quiesced_for_serving_interval
            record_id: f5c28c71-5f8d-4fd3-8532-63b2c309b2a3
