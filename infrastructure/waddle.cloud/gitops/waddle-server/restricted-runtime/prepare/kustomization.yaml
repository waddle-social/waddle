# Restricted PostgreSQL runtime, preparation half (#2116).
#
# Listed under `components:` in ../../kustomization.yaml. It declares the
# PostgreSQL roles and renders the suspended owner CronJob that an operator
# runs as docs/runbooks/fresh-production-install.md (a new database) or
# docs/runbooks/restricted-runtime-cutover.md (an existing one) directs.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - path: postgresql-cluster-roles.yaml
    target:
      group: postgresql.cnpg.io
      kind: Cluster
      name: postgresql
  - path: helmrelease-owner-job.yaml
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: waddle-server
