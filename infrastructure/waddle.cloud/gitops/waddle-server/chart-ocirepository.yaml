apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: waddle-server-chart
  namespace: waddle
spec:
  interval: 12h
  url: oci://ghcr.io/waddle-social/waddle/charts/waddle-server
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  # The checked-in publication template follows the chart's exact version.
  # Release automation replaces this tag with ref.digest before it publishes
  # the GitOps artifact consumed by the cluster.
  ref:
    tag: 0.5.0
