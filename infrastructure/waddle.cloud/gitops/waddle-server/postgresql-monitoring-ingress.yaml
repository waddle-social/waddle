apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-monitoring-ingress
  namespace: waddle
  labels:
    cnpg.io/reload: ""
# CloudNativePG runs these with `SET ROLE pg_monitor`; migration V1011 grants
# that role SELECT on the ingress tables; V1012 adds effect receipts
# (the catalog views need no grant).
data:
  queries: |
    waddle_ingress_table:
      target_databases: ["waddle"]
      query: |
        SELECT
          relname AS "table",
          pg_total_relation_size(relid) AS total_bytes,
          n_live_tup AS live_tuples,
          n_dead_tup AS dead_tuples
        FROM pg_stat_user_tables
        WHERE schemaname = 'public'
          AND relname IN (
          'ingress_messages',
          'ingress_origin_aliases',
          'ingress_sm_refs',
          'ingress_deliveries',
          'ingress_sm_streams',
          'ingress_effect_intents',
          'ingress_effect_receipts',
          'ingress_archive_dispatch',
          'ingress_effect_descendants',
          'ingress_owner_rejections'
        )
        ORDER BY relname
      primary: true
      metrics:
        - table:
            usage: LABEL
            description: Ingress table name.
        - total_bytes:
            usage: GAUGE
            description: Total on-disk bytes for the ingress table and its indexes.
        - live_tuples:
            usage: GAUGE
            description: Estimated live tuples in the ingress table.
        - dead_tuples:
            usage: GAUGE
            description: Estimated dead tuples in the ingress table.

    waddle_ingress_gc:
      target_databases: ["waddle"]
      query: |
        -- The eligible flag is the substrate candidate predicate, including
        -- pending delivery and the complete mapped rejection pair.
        WITH cutoff AS (SELECT now() - interval '8 days' AS value),
        expired AS (
          SELECT m.message_key, m.terminal_at, m.retention_eligible_at,
            (m.terminal_at IS NOT NULL
            AND (m.retention_eligible_at IS NULL OR m.retention_eligible_at <= cutoff.value)
            AND NOT EXISTS (
            SELECT 1 FROM ingress_effect_intents i WHERE i.message_key = m.message_key
            AND NOT EXISTS (
            SELECT 1 FROM ingress_effect_receipts r
            WHERE r.message_key = i.message_key AND r.kind = i.kind
            AND r.semantic_identity_hash = i.semantic_identity_hash
            )
            )
            AND NOT EXISTS (
            SELECT 1 FROM ingress_sm_refs r WHERE r.message_key = m.message_key
            UNION ALL SELECT 1 FROM ingress_mailbox_entries entry
            WHERE entry.message_key = m.message_key AND entry.disposition < 3
            UNION ALL SELECT 1 FROM ingress_archive_dispatch dispatch
            JOIN pending_delivery pending ON pending.row_id = dispatch.pending_row_id
            WHERE dispatch.message_key = m.message_key AND dispatch.pending_row_id <> ''
            )
            AND NOT EXISTS (
            SELECT 1 FROM ingress_owner_rejections parent WHERE parent.child_message_key = m.message_key
            )
            AND (m.owner_decision IS NULL OR m.owner_decision <> 2 OR EXISTS (
            SELECT 1 FROM ingress_owner_rejections owner_child WHERE owner_child.source_message_key = m.message_key
            ))
            AND NOT EXISTS (
            SELECT 1 FROM ingress_owner_rejections pair WHERE pair.source_message_key = m.message_key
            AND (m.owner_decision IS NULL OR m.owner_decision <> 2 OR NOT EXISTS (
            SELECT 1 FROM ingress_messages child WHERE child.message_key = pair.child_message_key
            AND child.terminal_at IS NOT NULL
            AND (child.retention_eligible_at IS NULL OR child.retention_eligible_at <= cutoff.value)
            AND NOT EXISTS (SELECT 1 FROM ingress_sm_refs r WHERE r.message_key = child.message_key
            UNION ALL SELECT 1 FROM ingress_mailbox_entries entry
            WHERE entry.message_key = child.message_key AND entry.disposition < 3
            UNION ALL SELECT 1 FROM ingress_archive_dispatch dispatch
            JOIN pending_delivery pending ON pending.row_id = dispatch.pending_row_id
            WHERE dispatch.message_key = child.message_key AND dispatch.pending_row_id <> '')
            AND NOT EXISTS (SELECT 1 FROM ingress_effect_descendants d WHERE d.message_key = child.message_key AND d.settled_at IS NULL)
            AND NOT EXISTS (SELECT 1 FROM ingress_owner_rejections nested WHERE nested.source_message_key = child.message_key)
            AND (child.owner_decision IS NULL OR child.owner_decision <> 2)
            AND NOT (child.source_binding_version IS NOT NULL AND (child.owner_decision IS NULL OR child.owner_decision = 0)
            AND EXISTS (SELECT 1 FROM ingress_effect_intents owner_intent WHERE owner_intent.message_key = child.message_key AND owner_intent.kind = 12))
            AND NOT EXISTS (SELECT 1 FROM ingress_effect_intents i WHERE i.message_key = child.message_key AND NOT EXISTS (
            SELECT 1 FROM ingress_effect_receipts r WHERE r.message_key = i.message_key AND r.kind = i.kind AND r.semantic_identity_hash = i.semantic_identity_hash))
            ))
            )
            AND NOT (m.source_binding_version IS NOT NULL AND (m.owner_decision IS NULL OR m.owner_decision = 0)
            AND EXISTS (SELECT 1 FROM ingress_effect_intents owner_intent WHERE owner_intent.message_key = m.message_key AND owner_intent.kind = 12))
            AND NOT EXISTS (
            SELECT 1 FROM ingress_effect_descendants d WHERE d.message_key = m.message_key AND d.settled_at IS NULL
            )) AS eligible
          FROM ingress_messages m CROSS JOIN cutoff
          WHERE m.terminal_at IS NOT NULL
            AND (m.retention_eligible_at IS NULL OR m.retention_eligible_at <= cutoff.value)
        )
        SELECT
          count(*) FILTER (WHERE eligible) AS eligible_messages,
          coalesce(extract(epoch FROM now() - min(coalesce(retention_eligible_at, terminal_at))
            FILTER (WHERE eligible)), 0) AS oldest_eligible_age_seconds,
          count(*) FILTER (WHERE NOT eligible) AS retained_referenced_messages
        FROM expired
      primary: true
      metrics:
        - eligible_messages:
            usage: GAUGE
            description: Terminal ingress candidates currently eligible for retention GC; each ready rejection pair counts once.
        - oldest_eligible_age_seconds:
            usage: GAUGE
            description: Age in seconds of the oldest ingress message eligible for retention GC.
        - retained_referenced_messages:
            usage: GAUGE
            description: Expired terminal ingress messages retained by SM custody, archived pending delivery, scheduled descendants, owner results, or pending effect intents.

    waddle_ingress_messages:
      target_databases: ["waddle"]
      query: |
        SELECT
          least(floor(extract(epoch FROM now() - message.created_at) / 86400), 14)::text AS age_days,
          CASE
            WHEN message.terminal_at IS NULL THEN 'live'
            WHEN message.message_key IN (SELECT ref.message_key FROM ingress_sm_refs ref)
              OR message.message_key IN (SELECT delivery.message_key FROM ingress_deliveries delivery)
              OR message.message_key IN (
                SELECT dispatch.message_key FROM ingress_archive_dispatch dispatch
                JOIN pending_delivery pending ON pending.row_id = dispatch.pending_row_id
                WHERE dispatch.pending_row_id <> ''
              )
              OR message.message_key IN (
                SELECT descendant.message_key FROM ingress_effect_descendants descendant
                WHERE descendant.settled_at IS NULL
              )
              OR message.message_key IN (
                SELECT owner_child.source_message_key FROM ingress_owner_rejections owner_child
                UNION
                SELECT owner_child.child_message_key FROM ingress_owner_rejections owner_child
              )
              OR (message.source_binding_version IS NOT NULL
                AND (message.owner_decision IS NULL OR message.owner_decision = 0)
                AND message.message_key IN (
                  SELECT owner_intent.message_key FROM ingress_effect_intents owner_intent
                  WHERE owner_intent.kind = 12
                ))
              THEN 'terminal_referenced'
            ELSE 'terminal_unreferenced'
          END AS state,
          count(*) AS count
        FROM ingress_messages message
        GROUP BY age_days, state
      primary: true
      metrics:
        - age_days:
            usage: LABEL
            description: Message age bucket in days, capped at 14.
        - state:
            usage: LABEL
            description: Ingress message lifecycle state.
        - count:
            usage: GAUGE
            description: Number of ingress messages in the age and lifecycle-state bucket.

    # Day 1 replaces these sentinel bounds with the controlled-message cohort;
    # CNPG hot-reloads this ConfigMap without restarting PostgreSQL.
    waddle_ingress_cohort:
      target_databases: ["waddle"]
      query: |
        -- Every state row is always emitted (explicit zeros), so the pass
        -- criterion `terminal_unreferenced == 0` is an observed value, never
        -- an absent series.
        WITH states(state) AS (
          VALUES ('live'), ('terminal_referenced'), ('terminal_unreferenced')
        ),
        cohort AS (
          SELECT
            CASE
              WHEN message.terminal_at IS NULL THEN 'live'
              WHEN message.message_key IN (SELECT ref.message_key FROM ingress_sm_refs ref)
                OR message.message_key IN (SELECT delivery.message_key FROM ingress_deliveries delivery)
                OR message.message_key IN (
                  SELECT dispatch.message_key FROM ingress_archive_dispatch dispatch
                  JOIN pending_delivery pending ON pending.row_id = dispatch.pending_row_id
                  WHERE dispatch.pending_row_id <> ''
                )
                OR message.message_key IN (
                  SELECT descendant.message_key FROM ingress_effect_descendants descendant
                  WHERE descendant.settled_at IS NULL
                )
                OR message.message_key IN (
                  SELECT owner_child.source_message_key FROM ingress_owner_rejections owner_child
                  UNION
                  SELECT owner_child.child_message_key FROM ingress_owner_rejections owner_child
                )
                OR (message.source_binding_version IS NOT NULL
                  AND (message.owner_decision IS NULL OR message.owner_decision = 0)
                  AND message.message_key IN (
                    SELECT owner_intent.message_key FROM ingress_effect_intents owner_intent
                    WHERE owner_intent.kind = 12
                  ))
                THEN 'terminal_referenced'
              ELSE 'terminal_unreferenced'
            END AS state
          FROM ingress_messages message
          WHERE message.created_at >= '1970-01-01T00:00:00Z'
            AND message.created_at < '1970-01-02T00:00:00Z'
        )
        SELECT states.state, count(cohort.state) AS count
        FROM states
        LEFT JOIN cohort ON cohort.state = states.state
        GROUP BY states.state
        ORDER BY states.state
      primary: true
      metrics:
        - state:
            usage: LABEL
            description: Ingress message lifecycle state.
        - count:
            usage: GAUGE
            description: Number of controlled-cohort ingress messages in the lifecycle state.

    waddle_ingress_streams:
      target_databases: ["waddle"]
      query: |
        SELECT count(*) AS open_streams
        FROM ingress_sm_streams
      primary: true
      metrics:
        - open_streams:
            usage: GAUGE
            description: Number of ingress stream records currently open.

    waddle_ingress_nonterminal:
      target_databases: ["waddle"]
      query: |
        -- The time predicate is served by ingress_messages_nonterminal_created_at_idx.
        -- Filter canonical rows first; the uncorrelated receipt anti-join lets
        -- PostgreSQL hash pending obligations instead of correlated subplans.
        WITH old_nonterminal AS (
          SELECT message_key
          FROM ingress_messages
          WHERE terminal_at IS NULL
            AND created_at <= now() - interval '10 minutes'
        ),
        pending AS (
          SELECT intent.message_key,
            CASE intent.kind
              WHEN 0 THEN 'archive'
              WHEN 1 THEN 'route_direct'
              WHEN 2 THEN 'route_muc'
              WHEN 3 THEN 'route_occupant_pm'
              WHEN 5 THEN 'carbons'
              WHEN 6 THEN 'inbox_project'
              WHEN 7 THEN 'notification_activity_preview'
              WHEN 8 THEN 'call_signal'
              WHEN 9 THEN 'pin'
              WHEN 10 THEN 'extension'
              WHEN 11 THEN 'error_reply'
              WHEN 12 THEN 'dispatch_to_room_remote'
              WHEN 13 THEN 'room_subject_mutation'
              WHEN 14 THEN 'retraction_tombstone'
              WHEN 15 THEN 'dm_pin_mutation'
              WHEN 16 THEN 'group_dm_membership_grant'
              WHEN 17 THEN 'group_dm_invite_ledger'
              WHEN 18 THEN 'link_preview_media_ref'
              WHEN 19 THEN 'muc_invite_membership_grant'
              WHEN 20 THEN 'muc_invite_ledger'
              WHEN 21 THEN 'groupchat_notification_recovery'
              WHEN 22 THEN 'pending_delivery'
              WHEN 23 THEN 'tombstone_replay_deletion'
              WHEN 24 THEN 'relay_carbons'
              WHEN 28 THEN 'room_observer'
              WHEN 26 THEN 'dm_call_thread_state'
              ELSE 'kind_' || intent.kind::text
            END AS kind
          FROM ingress_effect_intents intent
          JOIN old_nonterminal message ON message.message_key = intent.message_key
          LEFT JOIN ingress_effect_receipts receipt
            ON receipt.message_key = intent.message_key
            AND receipt.kind = intent.kind
            AND receipt.semantic_identity_hash = intent.semantic_identity_hash
          WHERE receipt.message_key IS NULL
        ),
        obligations AS (
          SELECT message_key, kind FROM pending
          UNION ALL
          SELECT message.message_key, 'terminalization' AS kind
          FROM old_nonterminal message
          LEFT JOIN pending ON pending.message_key = message.message_key
          WHERE pending.message_key IS NULL
        )
        SELECT kind, count(DISTINCT message_key) AS messages
        FROM obligations
        GROUP BY kind
        UNION ALL
        -- Always-present sentinel: an empty backlog emits no family rows, so
        -- `absent(cnpg_waddle_ingress_nonterminal_messages{kind="none"})`
        -- proves this query stopped running rather than that nothing is stuck.
        SELECT 'none' AS kind, 0 AS messages
      primary: true
      metrics:
        - kind:
            usage: LABEL
            description: Pending intent kind family, terminalization when all receipts are complete, or the always-present none sentinel.
        - messages:
            usage: GAUGE
            description: Distinct canonical messages non-terminal for at least ten minutes per pending kind family.

    waddle_ingress_nonterminal_age:
      target_databases: ["waddle"]
      query: |
        -- The time predicate is served by ingress_messages_nonterminal_created_at_idx.
        -- Always emit one row, including zero when no old non-terminal row exists.
        SELECT coalesce(extract(epoch FROM now() - min(created_at)), 0) AS oldest_seconds
        FROM ingress_messages
        WHERE terminal_at IS NULL
          AND created_at <= now() - interval '10 minutes'
      primary: true
      metrics:
        - oldest_seconds:
            usage: GAUGE
            description: Age in seconds of the oldest canonical message non-terminal for at least ten minutes, or zero.

    waddle_ingress_room_requests:
      target_databases: ["waddle"]
      query: |
        -- A request is collected once its mailbox entry is consumed and its
        -- origin settled it at least one hour ago; this is the collector's
        -- predicate. Always emits one row.
        SELECT
          count(*) FILTER (WHERE eligible) AS eligible_requests,
          count(*) FILTER (WHERE owner_decision = 0) AS undecided_requests,
          count(*) FILTER (WHERE owner_decision <> 0 AND settled_at IS NULL) AS unsettled_decisions,
          coalesce(extract(epoch FROM now() - min(created_at)
            FILTER (WHERE settled_at IS NULL)), 0) AS oldest_unsettled_age_seconds
        FROM (
          SELECT r.owner_decision, r.settled_at, r.created_at,
            (r.settled_at IS NOT NULL
            AND r.settled_at <= now() - (3600000::bigint * interval '1 millisecond')
            AND EXISTS (SELECT 1 FROM ingress_mailbox_entries e
            WHERE e.request_key = r.request_key AND e.disposition >= 3)) AS eligible
          FROM ingress_room_requests r
        ) requests
      primary: true
      metrics:
        - eligible_requests:
            usage: GAUGE
            description: Settled room requests currently eligible for collection.
        - undecided_requests:
            usage: GAUGE
            description: Room requests the room owner has not decided.
        - unsettled_decisions:
            usage: GAUGE
            description: Decided room requests whose origin has not handed the response to the requester.
        - oldest_unsettled_age_seconds:
            usage: GAUGE
            description: Age in seconds of the oldest room request that is not settled, or zero.

    waddle_ingress_direct_requests:
      target_databases: ["waddle"]
      query: |
        -- Always emits one row.
        SELECT
          count(*) FILTER (WHERE owner_decision = 0) AS undecided_requests,
          count(*) FILTER (WHERE owner_decision <> 0 AND settled_at IS NULL) AS unsettled_decisions,
          coalesce(extract(epoch FROM now() - min(created_at)
            FILTER (WHERE settled_at IS NULL)), 0) AS oldest_unsettled_age_seconds
        FROM ingress_direct_requests
      primary: true
      metrics:
        - undecided_requests:
            usage: GAUGE
            description: Direct requests the recipient's account owner has not decided.
        - unsettled_decisions:
            usage: GAUGE
            description: Decided direct requests whose origin has not consumed the decision.
        - oldest_unsettled_age_seconds:
            usage: GAUGE
            description: Age in seconds of the oldest direct request that is not settled, or zero.
