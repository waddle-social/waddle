apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: waddle-server
  namespace: waddle
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: waddle-server
      version: 0.1.x
      sourceRef:
        kind: HelmRepository
        name: waddle-server
        namespace: waddle
      interval: 12h
  values:
    image:
      repository: ghcr.io/waddle-social/waddle
      tag: main
    config:
      baseUrl: https://xmpp.waddle.social
      corsOrigins: https://waddle.chat,http://localhost:4321
    xmpp:
      domain: waddle.social
      mamDbPath: /data/mam.db
      tls:
        secretName: waddle-xmpp-tls
    persistence:
      storageClassName: openebs-mayastor
    service:
      type: ClusterIP
    secret:
      create: true
