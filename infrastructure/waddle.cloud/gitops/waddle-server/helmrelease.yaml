apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: waddle-server
  namespace: waddle
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: waddle-server
      version: 0.1.x
      sourceRef:
        kind: HelmRepository
        name: waddle-server
        namespace: waddle
      interval: 12h
  values:
    image:
      repository: ghcr.io/waddle-social/waddle
      tag: main
    config:
      baseUrl: https://xmpp.waddle.social
      corsOrigins: https://waddle.chat,http://localhost:4321
      s3Endpoint: "https://f90cc3950ab5b356ec869fe64c867ea7.r2.cloudflarestorage.com"
      s3Bucket: "waddle-social-files"
    extraSecretRefs:
      - waddle-r2-credentials
    xmpp:
      domain: waddle.social
      mamDbPath: /data/mam.db
      tls:
        secretName: waddle-xmpp-tls
    persistence:
      storageClassName: openebs-mayastor
    service:
      type: ClusterIP
    # Extension modules: non-sensitive fields only.
    # Sensitive credentials (e.g. GitHub App private key) are delivered as
    # file mounts and referenced below via config_secret_files.
    extensions:
      enabled: true
      cache_dir: /var/lib/waddle/extensions
      modules:
        - name: github-enricher
          registry: ghcr.io/waddle-social/waddle/extensions/github-enricher
          tag: latest
          namespace: urn:waddle:github:0
          config: {}
          # Maps extension config key -> absolute path of the mounted secret file.
          # The server reads each file at startup and injects its content into the
          # module config under the corresponding key (see ExtensionModuleConfig).
          config_secret_files:
            github_token: /etc/waddle/secrets/github-app/private-key

    # CSI-style secret file mount: the ExternalSecret "waddle-github-app-credentials"
    # syncs the GitHub App private key from 1Password into a Kubernetes Secret.
    # Mounting it as a read-only file avoids injecting the key as a plain env var.
    extraVolumes:
      - name: github-app-credentials
        secret:
          secretName: waddle-github-app-credentials
          # Group-readable for fsGroup 1000; still read-only and least-privilege.
          defaultMode: 0440

    extraVolumeMounts:
      - name: github-app-credentials
        mountPath: /etc/waddle/secrets/github-app
        readOnly: true

    secret:
      create: true
      authProvidersJson: >-
        [{"id":"colony","display_name":"Colony","kind":"oidc","dynamic_client_registration":true,"client_id":"","client_secret":"","token_endpoint_auth_method":"client_secret_post","require_dpop":true,"issuer":"https://colony.waddle.social","scopes":["openid","profile","email"],"subject_claim":"sub","username_claim":"preferred_username","email_claim":"email"}]
