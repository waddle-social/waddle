apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: waddle-server
  namespace: waddle
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: waddle-server
      version: 0.1.x
      sourceRef:
        kind: HelmRepository
        name: waddle-server
        namespace: waddle
      interval: 12h
  values:
    image:
      repository: ghcr.io/waddle-social/waddle
      tag: main
    config:
      baseUrl: https://xmpp.waddle.social
      corsOrigins: https://waddle.chat,http://localhost:4321
      s3Endpoint: "https://f90cc3950ab5b356ec869fe64c867ea7.r2.cloudflarestorage.com"
      s3Bucket: "waddle-social-files"
    extraSecretRefs:
      - waddle-r2-credentials
    # Ship traces + OTel-native metrics to Grafana Cloud via the
    # in-cluster Alloy collector. `telemetry.rs` reads these env vars
    # (default endpoint was `localhost:4317`, which silently dropped
    # everything before this was wired up).
    containerExtraEnv:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://grafana-alloy.grafana-alloy.svc.cluster.local:4317"
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: "grpc"
      - name: OTEL_SERVICE_NAME
        value: "waddle-server"
    xmpp:
      domain: waddle.social
      mamDbPath: /data/mam.db
      tls:
        secretName: waddle-xmpp-tls
    persistence:
      storageClassName: openebs-mayastor
    service:
      type: ClusterIP
    secret:
      create: true
      authProvidersJson: >-
        [{"id":"colony","display_name":"Colony","kind":"oidc","dynamic_client_registration":true,"client_id":"","client_secret":"","token_endpoint_auth_method":"client_secret_post","require_dpop":true,"issuer":"https://colony.waddle.social","scopes":["openid","profile","email"],"subject_claim":"sub","username_claim":"preferred_username","email_claim":"email"}]
