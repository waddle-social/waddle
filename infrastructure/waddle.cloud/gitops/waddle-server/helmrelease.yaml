apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: waddle-server
  namespace: waddle
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: waddle-server
      version: 0.4.x
      sourceRef:
        kind: HelmRepository
        name: waddle-server
        namespace: waddle
      interval: 12h
  valuesFrom:
    - kind: Secret
      name: waddle-runtime-secrets
      valuesKey: WADDLE_RUNTIME_SECRETS_CHECKSUM
      targetPath: extraSecretChecksum
      optional: false
  values:
    replicaCount: 2
    clustering:
      enabled: true
      enrolledKeyCount: 4
    # Database lineage attestation (#1672, docs/operations/db-lineage.md).
    # The uuid is the stable deployment identity bound into `_lineage`;
    # it must never change across upgrades or rollbacks.
    deployment:
      uuid: b90424f8-22ca-40bb-a24e-551d171c7b84
    # Zero-downtime rollouts (ADR-0017 Phase 4) are the steady state, safe under
    # mixed versions because the ordered-relay envelope message id is versioned
    # (deliver_ordered.vN, #1597/#1600): an old replica rejects a newer envelope
    # pre-handler and the sender rolls back the sequence instead of poisoning the
    # shared channel. Any envelope or reply-type change MUST bump the version (see
    # server/CLAUDE.md) — that invariant is what keeps that strategy sound.
    #
    # The #1778 `remote_resource_route.v7` cutover (PR #1788, re-applied by PR #1792)
    # and the #1789 `remote_resource_frame.v2` bump (PR #1794) shared the sixth
    # one-shot Recreate, after the #1657 V1012, #1739-#1743 V1014, #1756
    # V1015/V1016 and #1770 archive_seq cutovers; this restores the steady state.
    # Neither endpoint has an `UnsupportedEnvelope` fallback, unlike
    # `deliver_ordered`: a mixed window would have dropped live IQ, presence,
    # MUC-proxy operations, roster pushes, blocklist pushes and MUC destroy
    # notifications outright rather than delaying them, because none of those are
    # ingress obligations that maintenance recovery re-executes. With every replica
    # on v7 and v2 that window is closed.
    #
    # Lesson recorded from #1791: a flip-back must merge only AFTER the image that
    # carries the bump has actually rolled. Merging it earlier cancels that image's
    # build, and the first image carrying the bump then rolls out under
    # RollingUpdate — the exact mixed window the cutover exists to prevent.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    image:
      repository: ghcr.io/waddle-social/waddle
      tag: main
      digest: ""
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 4Gi
    config:
      baseUrl: https://xmpp.waddle.social
      corsOrigins: https://waddle.chat,http://localhost:4321
      serverOwnerLocalparts:
        - rawkode
        - icepuma
        - randax
      s3Endpoint: "https://f90cc3950ab5b356ec869fe64c867ea7.r2.cloudflarestorage.com"
      s3Bucket: "waddle-social-files"
    database:
      driver: postgres
    spicedb:
      enabled: true
      endpoint: http://spicedb:50051
      insecure: true
    extraSecretRefs:
      - waddle-runtime-secrets
      - waddle-clustering-keypool
      # LiveKit signing key + TURN shared secret + LiveKit/TURN URLs.
      # Mounted as env vars; consumed by `waddle-sfu::SfuConfig::from_env`
      # at server boot. If this Secret is absent or unpopulated the
      # server boots without A/V calling (Jingle / extdisco handlers
      # are not registered and `call_features()` stays out of disco).
      - waddle-livekit-config
    extraVolumes:
      - name: openrouter-api-key
        secret:
          secretName: waddle-openrouter
          items:
            - key: api_key
              path: api_key
    extraVolumeMounts:
      - name: openrouter-api-key
        mountPath: /var/run/secrets/waddle-ai
        readOnly: true
    # Ship traces + OTel-native metrics to Grafana Cloud via the
    # in-cluster Alloy collector. `telemetry.rs` reads these env vars
    # (default endpoint was `localhost:4317`, which silently dropped
    # everything before this was wired up). Chart-modelled keys go in
    # `telemetry`; `containerExtraEnv` is reserved for settings the
    # chart doesn't model (currently just the OTLP protocol).
    telemetry:
      otlpEndpoint: "http://grafana-alloy.grafana-alloy.svc.cluster.local:4317"
      serviceName: "waddle-server"
      deploymentEnvironment: "production"
      # Explicit spec defaults so trace volume has a visible dial
      # here; lower the ratio to shed trace volume without a rebuild.
      tracesSampler: "parentbased_traceidratio"
      tracesSamplerArg: "1.0"
    containerExtraEnv:
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: "grpc"
      - name: WADDLE_PROVIDER_GITHUB_WEBHOOK_EVENT_HEADER
        value: x-github-event
      - name: WADDLE_PROVIDER_GITHUB_WEBHOOK_DELIVERY_HEADER
        value: x-github-delivery
      - name: WADDLE_PROVIDER_GITHUB_WEBHOOK_SIGNATURE_HEADER
        value: x-hub-signature-256
      - name: WADDLE_PROVIDER_GITHUB_WEBHOOK_SIGNATURE_PREFIX
        value: sha256=
      - name: WADDLE_DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: postgresql-app
            key: uri
      - name: WADDLE_XMPP_MAM_DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: postgresql-app
            key: uri
      - name: WADDLE_XMPP_INBOX_DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: postgresql-app
            key: uri
      - name: WADDLE_XMPP_PUBSUB_DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: postgresql-app
            key: uri
    xmpp:
      domain: waddle.social
      publicWebsocketUrl: wss://xmpp.waddle.social/ws
      tls:
        secretName: waddle-xmpp-tls
    persistence:
      enabled: false
      storageClassName: openebs-mayastor
    service:
      type: ClusterIP
    # Extension modules are enabled by release automation only after their OCI
    # WASM artifacts have been pushed and digest-pinned. The AI chatbot is
    # wired to OpenRouter through the waddle-openrouter ExternalSecret above.
    # GitHub App webhook verification reads WADDLE_PROVIDER_GITHUB_WEBHOOK_SECRET
    # from the 1Password-backed waddle-runtime-secrets ExternalSecret.
    extensions:
      enabled: false
      cacheDir: /var/lib/waddle/extensions
      modules: []

    secret:
      create: true
      # WADDLE_SESSION_KEY and WADDLE_OCCUPANT_ID_SECRET are owned by the
      # 1Password-backed waddle-runtime-secrets ExternalSecret referenced
      # above.
      runtimeSecretName: waddle-runtime-secrets
      databaseUrl: "postgresql://postgresql-rw:5432/waddle"
      xmppMamDatabaseUrl: "postgresql://postgresql-rw:5432/waddle"
      xmppInboxDatabaseUrl: "postgresql://postgresql-rw:5432/waddle"
      xmppPubsubDatabaseUrl: "postgresql://postgresql-rw:5432/waddle"
      authProvidersJson: >-
        [{"id":"colony","display_name":"Colony","kind":"oidc","dynamic_client_registration":true,"client_id":"","token_endpoint_auth_method":"none","require_dpop":true,"issuer":"https://colony.waddle.social","scopes":["openid","profile","email"],"subject_claim":"sub","username_claim":"preferred_username","email_claim":"email"}]
