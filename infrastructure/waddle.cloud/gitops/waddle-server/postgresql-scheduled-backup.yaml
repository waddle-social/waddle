apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgresql-daily-backup
  namespace: waddle
spec:
  # CNPG cron format has six fields (seconds first): daily at 02:00:00 UTC.
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  immediate: true
  cluster:
    name: postgresql
