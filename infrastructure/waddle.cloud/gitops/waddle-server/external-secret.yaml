apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: waddle-r2-credentials
  namespace: waddle
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: waddle-r2-credentials
    creationPolicy: Owner
  data:
    - secretKey: WADDLE_S3_ACCESS_KEY_ID
      remoteRef:
        key: waddle-server-files
        property: access-key-id
    - secretKey: WADDLE_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: waddle-server-files
        property: secret-access-key
    - secretKey: WADDLE_MEDIA_LIVEKIT_API_KEY
      remoteRef:
        key: waddle-livekit
        property: api-key
    - secretKey: WADDLE_MEDIA_LIVEKIT_API_SECRET
      remoteRef:
        key: waddle-livekit
        property: api-secret
