apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: waddle-runtime-secrets
  namespace: waddle
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: waddle-runtime-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels:
          reconcile.fluxcd.io/watch: "Enabled"
      data:
        WADDLE_RUNTIME_SECRETS_CHECKSUM: >-
          {{ printf "%s:%s:%s" .WADDLE_OCCUPANT_ID_SECRET .OPENROUTER_API_KEY .OPENAI_API_KEY | sha256sum }}
  data:
    - secretKey: WADDLE_OCCUPANT_ID_SECRET
      remoteRef:
        key: Waddle Server Runtime
        property: password
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: OpenRouter
        property: password
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: OpenRouter
        property: password
