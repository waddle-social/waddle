apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: waddle-runtime-secrets
  namespace: waddle
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: waddle-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: WADDLE_OCCUPANT_ID_SECRET
      remoteRef:
        key: Waddle Server Runtime
        property: password
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: OpenRouter
        property: password
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: OpenRouter
        property: password
