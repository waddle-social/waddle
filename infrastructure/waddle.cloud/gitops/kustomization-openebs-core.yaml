apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openebs-core
  namespace: flux-system
spec:
  force: true
  interval: 5m
  retryInterval: 1m
  timeout: 20m
  path: ./core
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: bootstrap
  postBuild:
    substitute:
      WADDLE_STORAGE_CLASS_NAME: ${WADDLE_STORAGE_CLASS_NAME}
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openebs
      namespace: openebs
