apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse
  namespace: clickhouse
spec:
  dependsOn:
    - name: clickhouse-operator
      namespace: clickhouse-system
  interval: 30m
  chart:
    spec:
      chart: clickhouse
      version: 0.3.10
      sourceRef:
        kind: HelmRepository
        name: altinity
        namespace: clickhouse-system
      interval: 12h
  values:
    operator:
      enabled: false
    keeper:
      enabled: false
    clickhouse:
      defaultUser:
        password_secret_name: clickhouse-default-user
        allowExternalAccess: true
      replicasCount: 1
      shardsCount: 1
      persistence:
        enabled: true
        size: 50Gi
        storageClass: openebs-mayastor
      service:
        type: ClusterIP
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 2
          memory: 4Gi
