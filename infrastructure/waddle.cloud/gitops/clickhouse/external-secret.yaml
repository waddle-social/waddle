apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clickhouse-default-user
  namespace: clickhouse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: clickhouse-default-user
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: clickhouse-default-user
        property: password
