apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
  namespace: clickhouse-system
spec:
  interval: 30m
  chart:
    spec:
      chart: altinity-clickhouse-operator
      version: 0.26.2
      sourceRef:
        kind: HelmRepository
        name: altinity
        namespace: clickhouse-system
      interval: 12h
  values:
    metrics:
      enabled: true
    serviceMonitor:
      enabled: false
    dashboards:
      enabled: false
    rbac:
      namespaceScoped: false
