apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-waddle-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-external-secrets
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./waddle-operator
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: bootstrap
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: waddle-operator
      namespace: waddle-operator-system
