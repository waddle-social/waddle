apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-spicedb
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-onepassword-connect
    - name: infra-cloudnative-pg
    - name: infra-spicedb-operator
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./spicedb
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: bootstrap
  healthChecks:
    - apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      name: spicedb-config
      namespace: spicedb
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: spicedb-postgres
      namespace: spicedb
    - apiVersion: authzed.com/v1alpha1
      kind: SpiceDBCluster
      name: spicedb
      namespace: spicedb
