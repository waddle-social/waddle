apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waddle-gateway
  namespace: default
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.apps.waddle.social"
      tls:
        mode: Terminate
        certificateRefs:
          - name: apps-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.apps.waddle.social"
      allowedRoutes:
        namespaces:
          from: All
    - name: https-chat
      protocol: HTTPS
      port: 443
      hostname: chat.waddle.social
      tls:
        mode: Terminate
        certificateRefs:
          - name: chat-waddle-social-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: http-chat
      protocol: HTTP
      port: 80
      hostname: chat.waddle.social
      allowedRoutes:
        namespaces:
          from: All
    - name: teleport-passthrough
      protocol: TLS
      port: 443
      hostname: "teleport.waddle.social"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
    - name: teleport-grpc-passthrough
      protocol: TLS
      port: 443
      hostname: "*.teleport.cluster.local"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
    - name: teleport-kube-passthrough
      protocol: TLS
      port: 443
      hostname: "*.teleport.waddle.social"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
