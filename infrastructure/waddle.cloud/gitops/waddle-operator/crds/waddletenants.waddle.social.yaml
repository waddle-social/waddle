apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: waddletenants.waddle.social
spec:
  group: waddle.social
  names:
    kind: WaddleTenant
    plural: waddletenants
    shortNames:
    - wt
    singular: waddletenant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Canonical tenant DNS domain
      jsonPath: .spec.tenantId
      name: Tenant
      type: string
    - description: Referenced WaddleServer name
      jsonPath: .spec.serverRef.name
      name: Server
      type: string
    - description: Tenant placement mode
      jsonPath: .spec.placementMode
      name: Mode
      type: string
    - description: Current tenant lifecycle phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Provisioned OpenFGA store ID
      jsonPath: .status.openfgaStoreId
      name: StoreID
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Declarative multi-tenant configuration and OpenFGA store lifecycle for a WaddleServer.
        properties:
          spec:
            description: Declarative specification for a `WaddleTenant` resource.
            properties:
              authProvidersSecretRef:
                description: Optional same-namespace Secret key holding `WADDLE_AUTH_PROVIDERS_JSON` for this tenant.
                nullable: true
                properties:
                  key:
                    description: Key inside the `Secret` data map.
                    type: string
                    x-kubernetes-validations:
                    - rule: size(self) > 0
                  name:
                    description: Name of the Kubernetes `Secret` in the same namespace.
                    type: string
                    x-kubernetes-validations:
                    - rule: size(self) > 0
                required:
                - key
                - name
                type: object
              extensions:
                description: Optional per-tenant extension and inference provider allowlists.
                nullable: true
                properties:
                  approvedModels:
                    description: Model identifiers approved by tenant policy.
                    items:
                      type: string
                    type: array
                  approvedProviders:
                    description: Inference providers approved by tenant policy (e.g. `openrouter`).
                    items:
                      type: string
                    type: array
                  enabledPlugins:
                    description: Extension plugin identifiers enabled for this tenant.
                    items:
                      type: string
                    type: array
                  zdrRequired:
                    default: false
                    description: Require Zero Data Retention (ZDR) endpoints for inference requests.
                    type: boolean
                type: object
              owners:
                description: Localparts granted initial tenant owner privileges.
                items:
                  type: string
                type: array
              placementMode:
                default: SharedPool
                description: Tenant placement mode (`SharedPool` or `DedicatedCell`).
                enum:
                - SharedPool
                - DedicatedCell
                type: string
              quotas:
                description: Optional per-tenant connection, room, storage, and inference spend quotas.
                nullable: true
                properties:
                  maxConcurrentConnections:
                    description: Maximum concurrent XMPP/WebSocket sessions for this tenant.
                    format: uint32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  maxInferenceSpendMicrocents:
                    description: Maximum inference spend budget in microcents.
                    format: uint64
                    minimum: 0.0
                    nullable: true
                    type: integer
                  maxRooms:
                    description: Maximum rooms/channels allowed in this tenant.
                    format: uint32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  maxStorageBytes:
                    description: Maximum aggregate tenant storage in bytes.
                    format: uint64
                    minimum: 0.0
                    nullable: true
                    type: integer
                type: object
              serverRef:
                description: Reference to the `WaddleServer` hosting this tenant in the same namespace.
                properties:
                  name:
                    description: Name of the referenced Kubernetes resource in the same namespace.
                    type: string
                    x-kubernetes-validations:
                    - rule: size(self) > 0
                required:
                - name
                type: object
              tenantId:
                description: Canonical lower-case DNS domain identifying the tenant (e.g. `waddle.social`).
                type: string
                x-kubernetes-validations:
                - rule: size(self) > 0 && size(self) <= 253 && self.matches('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$')
            required:
            - serverRef
            - tenantId
            type: object
          status:
            description: Observed status subresource for `WaddleTenant`.
            nullable: true
            properties:
              conditions:
                description: Standard Kubernetes status conditions keyed by `type`.
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              leaseEpoch:
                description: Current placement lease epoch assigned to this tenant.
                format: uint64
                minimum: 0.0
                nullable: true
                type: integer
              observedGeneration:
                description: Latest `.metadata.generation` processed by the controller.
                format: int64
                nullable: true
                type: integer
              openfgaModelId:
                description: Provisioned immutable OpenFGA authorization model ID for this tenant.
                nullable: true
                type: string
              openfgaStoreId:
                description: Provisioned OpenFGA store ID for this tenant.
                nullable: true
                type: string
              phase:
                description: Current tenant lifecycle phase.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Degraded
                - Terminating
                type: string
            required:
            - phase
            type: object
        required:
        - spec
        title: WaddleTenant
        type: object
    served: true
    storage: true
    subresources:
      status: {}
