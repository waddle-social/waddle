apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: waddle-operator-gateway-manager
  namespace: default
  labels:
    app.kubernetes.io/name: waddle-operator
    app.kubernetes.io/component: controller
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    resourceNames: ["waddle-gateway"]
    verbs: ["get", "patch"]
