apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
  namespace: clickhouse-system
spec:
  interval: 30m
  chart:
    spec:
      chart: .
      version: 0.0.3
      sourceRef:
        kind: HelmRepository
        name: clickhouse-operator
        namespace: clickhouse-system
      interval: 12h
  values:
    metrics:
      enable: true
    prometheus:
      service_monitor: false
    certManager:
      enable: true
      install: false
