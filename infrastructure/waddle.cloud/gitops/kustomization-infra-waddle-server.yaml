apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-waddle-server
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-cilium-gateway
    - name: infra-external-dns
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./waddle-server
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: bootstrap
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: waddle-server
      namespace: waddle
