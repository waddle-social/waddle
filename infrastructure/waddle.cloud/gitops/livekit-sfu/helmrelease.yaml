apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: livekit-sfu
  namespace: livekit
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: livekit-sfu
      version: 0.1.x
      sourceRef:
        kind: HelmRepository
        name: livekit-sfu
        namespace: livekit
      interval: 12h
  valuesFrom:
    # Inject the dedicated webhook signer key NAME so LiveKit signs
    # webhook deliveries with the `webhook-key`/`webhook-secret` pair
    # (not the room-JWT `api-key`/`api-secret` pair). The matching
    # `webhook-secret` is what waddle-server verifies with, so a leaked
    # room-JWT secret cannot forge inbound webhooks.
    - kind: Secret
      name: livekit-sfu-api-keys
      valuesKey: webhook-key
      targetPath: webhook.apiKey
      optional: false
  values:
    image:
      repository: livekit/livekit-server
      tag: v1.11.0
    apiKeys:
      existingSecret: livekit-sfu-api-keys
    sharedTURN:
      configSecretName: livekit-turn-config
    webhook:
      enabled: true
      urls:
        # The public gateway hairpin rejects SFU-originated requests. Deliver
        # directly to the signed handler through the internal Service instead.
        - http://waddle-server.waddle.svc.cluster.local:3000/api/v1/livekit/webhook
    livekit:
      log_level: info
      rtc:
        use_external_ip: true
        tcp_port: 30881
        udp_port: 30882
      turn:
        enabled: false
    nodePorts:
      rtc:
        enabled: true
        tcp: 30881
        udp: 30882
      turnUdp:
        enabled: true
        udp: 30478
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
