apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: livekit-sfu
  namespace: livekit
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: livekit-sfu
      version: 0.1.x
      sourceRef:
        kind: HelmRepository
        name: livekit-sfu
        namespace: livekit
      interval: 12h
  valuesFrom:
    - kind: Secret
      name: livekit-sfu-api-keys
      valuesKey: api-key
      targetPath: webhook.apiKey
      optional: false
  values:
    image:
      repository: livekit/livekit-server
      tag: v1.11.0
    apiKeys:
      existingSecret: livekit-sfu-api-keys
    webhook:
      enabled: true
      urls:
        - https://xmpp.waddle.social/api/v1/livekit/webhook
    livekit:
      log_level: info
      rtc:
        use_external_ip: true
        tcp_port: 30881
        udp_port: 30882
      turn:
        enabled: true
        domain: turn.waddle.social
        udp_port: 30478
        tls_port: 443
        relay_range_start: 30000
        relay_range_end: 40000
    nodePorts:
      rtc:
        enabled: true
        tcp: 30881
        udp: 30882
      turnUdp:
        enabled: true
        udp: 30478
    turn:
      secretName: turn-waddle-social-tls
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
