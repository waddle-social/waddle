apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: livekit-sfu
  namespace: livekit
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: livekit-sfu
      version: 0.1.x
      sourceRef:
        kind: HelmRepository
        name: livekit-sfu
        namespace: livekit
      interval: 12h
  valuesFrom:
    # Inject the dedicated webhook signer key NAME so LiveKit signs
    # webhook deliveries with the `webhook-key`/`webhook-secret` pair
    # (not the room-JWT `api-key`/`api-secret` pair). The matching
    # `webhook-secret` is what waddle-server verifies with, so a leaked
    # room-JWT secret cannot forge inbound webhooks.
    - kind: Secret
      name: livekit-sfu-api-keys
      valuesKey: webhook-key
      targetPath: webhook.apiKey
      optional: false
  values:
    image:
      repository: livekit/livekit-server
      tag: v1.11.0
    apiKeys:
      existingSecret: livekit-sfu-api-keys
    webhook:
      enabled: true
      urls:
        - https://xmpp.waddle.social/api/v1/livekit/webhook
    livekit:
      log_level: info
      rtc:
        use_external_ip: true
        tcp_port: 30881
        udp_port: 30882
      turn:
        enabled: true
        domain: turn.waddle.social
        udp_port: 30478
        tls_port: 443
        relay_range_start: 30000
        relay_range_end: 40000
        # See charts/livekit-sfu/values.yaml for the rationale of both
        # keys; stated explicitly here because the restricted-peer relay
        # policy is a deliberate per-deployment security decision.
        ttl_seconds: 3600
        allow_restricted_peer_cidrs: []
    nodePorts:
      rtc:
        enabled: true
        tcp: 30881
        udp: 30882
      turnUdp:
        enabled: true
        udp: 30478
    turn:
      secretName: turn-waddle-social-tls
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
