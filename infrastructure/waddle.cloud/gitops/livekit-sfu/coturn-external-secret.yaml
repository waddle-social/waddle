apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: livekit-turn-config
  namespace: livekit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: livekit-turn-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        shared-secret: "{{ .sharedSecret }}"
        # This fragment is mounted only in the SFU pod and composed into
        # its private runtime configuration. Never put it in Helm values.
        turn-servers.yaml: |
          turn_servers:
            - host: turn.waddle.social
              port: 30478
              protocol: udp
              secret: {{ .sharedSecret | quote }}
              ttl: 3600
            - host: turn.waddle.social
              port: 443
              protocol: tls
              secret: {{ .sharedSecret | quote }}
              ttl: 3600
  data:
    - secretKey: sharedSecret
      remoteRef:
        key: livekit-sfu
        property: turn-shared-secret
