apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-clickhouse-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-cert-manager
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./clickhouse-operator
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: bootstrap
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: clickhouse-operator
      namespace: clickhouse-system
