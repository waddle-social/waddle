rule_files:
  - waddle-reliability.yaml
evaluation_interval: 1m

tests:
  - name: a zero-registered healthy counter stays quiet
    interval: 1m
    input_series:
      - series: 'xmpp_muc_fanout_fence_unavailable_total{instance="a"}'
        values: '0x60'
    alert_rule_test:
      - alertname: MucFanoutFenceUnavailable
        eval_time: 60m
        exp_alerts: []

  - name: a short switchover burst does not fire
    interval: 1m
    input_series:
      # Bounces during one minute of failover, then the database answers again.
      - series: 'xmpp_muc_fanout_fence_unavailable_total{instance="a"}'
        values: '0x10 40 40x50'
    alert_rule_test:
      - alertname: MucFanoutFenceUnavailable
        eval_time: 20m
        exp_alerts: []
      - alertname: MucFanoutFenceUnavailable
        eval_time: 60m
        exp_alerts: []

  - name: sustained bounces fire after the hold and clear on recovery
    interval: 1m
    input_series:
      # Bounces every minute from 10m to 40m, then none.
      - series: 'xmpp_muc_fanout_fence_unavailable_total{instance="a"}'
        values: '0x10 3+3x30 93x30'
      - series: 'xmpp_muc_fanout_fence_unavailable_total{instance="b"}'
        values: '0x70'
    alert_rule_test:
      - alertname: MucFanoutFenceUnavailable
        eval_time: 20m
        exp_alerts: []
      - alertname: MucFanoutFenceUnavailable
        eval_time: 22m
        exp_alerts:
          - exp_labels:
              severity: critical
              team: waddle
            exp_annotations:
              summary: Groupchat messages are bouncing because room ownership cannot be verified against the database.
              runbook: 'Groupchat dispatch could not verify the room ownership fence against Postgres after its bounded retry (3 attempts inside 2s), so it bounced the sender with a retryable wait/resource-constraint error instead of fanning out unfenced (#2046 W1.4). The room actor is deliberately NOT demoted, so the room serves again as soon as the database answers. Zero by construction on a healthy pod (the counter is zero-registered at startup). A CNPG switchover produces a short burst that the 5m window plus 10m hold ignores; firing means bounces recurred for over ten minutes. Check CNPG primary health and failover state, main-pool saturation, and the "fenced ownership check" WARN lines on the affected pods. Partial of https://github.com/waddle-social/waddle/issues/1283'
      - alertname: MucFanoutFenceUnavailable
        eval_time: 50m
        exp_alerts: []
