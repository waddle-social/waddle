namespace: waddle
groups:
    - name: waddle-scrape
      rules:
        - alert: ScrapeAbsent
          expr: (count(up{job="waddle-server"} == 1) or vector(0)) < 2
          for: 5m
          labels:
            severity: critical
            team: waddle
          annotations:
            runbook: Check pod status in the waddle namespace and the grafana-alloy scrape pipeline. 2 replicas are expected; the alloy scrape generates the `up` series. The `or vector(0)` keeps this firing even when every series vanishes (Alloy down, discovery empty) — total outage must not be the silent case.
            summary: Fewer than 2 waddle-server replicas are being scraped — a pod stopped reporting or the Alloy scrape is broken.
    - name: waddle-clustering
      rules:
        - alert: ClusterHeartbeatStale
          expr: max(waddle_clustering_node_heartbeat_age_milliseconds or waddle_clustering_node_heartbeat_age) > 60000
          for: 5m
          labels:
            severity: critical
            team: waddle
          annotations:
            runbook: Identify the stale node via the per-pod series, check its pod and Postgres lease writes. Node-death scenarios (claim leaks, orphaned sessions) follow if this persists. The instrument is `waddle.clustering.node_heartbeat_age` (unit ms, no unit in the name — #1437); the expression ORs the two plausible OTLP-exported spellings (with and without the translated `_milliseconds` suffix) — after verifying the live series name in Grafana, prune to the real one. Caveat - the gauge is self-reported, so a fully dead node goes stale rather than large; ScrapeAbsent is the backstop for that case.
            summary: A cluster node heartbeat is older than 60s (healthy steady-state is ~10s) — node death or lease-write stall.
        - alert: ClusterHeartbeatMissing
          expr: absent(waddle_clustering_node_heartbeat_age_milliseconds) and absent(waddle_clustering_node_heartbeat_age)
          for: 15m
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: ClusterHeartbeatStale can only evaluate while its series exists - this companion fires when every plausible spelling of the heartbeat series is absent, which means the metric was renamed, the clustering exporter broke, or rules synced before a server deploy. Verify the live series name in Grafana and prune the or-chain plus this rule's absent() list to the real one.
            summary: The cluster heartbeat series is missing entirely - the staleness alert has silently stopped evaluating.
    - name: waddle-pending-delivery
      rules:
        - alert: PendingDeliveryPoisonPill
          expr: increase(waddle_pending_delivery_unresolved_poison_pill_total[1h]) > 0
          labels:
            severity: critical
            team: waddle
          annotations:
            runbook: Always 0 in healthy history; any increment means a stuck delivery. Inspect the pending_delivery table for the unresolved row and the server logs around its message id.
            summary: A pending-delivery row could not be resolved (poison pill) — a message is stuck and will not be delivered.
    - name: waddle-push
      rules:
        - alert: PushDeadLettered
          expr: increase(waddle_push_outbox_dead_lettered_total[1h]) > 0
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: Always 0 so far. Check push endpoint reachability and the notification outbox janitor logs.
            summary: A push notification exhausted retries and was dead-lettered.
    - name: waddle-delivery
      rules:
        - alert: DeliveryDrops
          expr: increase(waddle_delivery_retry_exhausted_drop_total[1h]) + increase(waddle_delivery_terminal_error_drop_total[1h]) > 10
          for: 30m
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: Both counters are 0 in healthy history; the threshold allows small connection-churn noise. Sustained drops mean a delivery-path regression.
            summary: Messages are being dropped after retry exhaustion or terminal delivery errors.
    - name: waddle-stream-management
      rules:
        - alert: SmPauseTimeouts
          expr: increase(waddle_sm_send_window_pause_timeouts_total[30m]) > 5
          for: 30m
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: 0 in all history. A burst usually accompanies a network event or a client bug that stops acking.
            summary: XEP-0198 send-window pauses are timing out — dead peers are piling up instead of acking.
        - alert: SmUnackedEvictions
          expr: sum(increase(waddle_sm_unacked_evicted_total[1h])) > 100
          for: 2h
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: 'KNOWN-FIRING until issue #1316 lands (bootstrap-flood bursts measured 44-968/h). Tighten to > 0 after #1316. https://github.com/waddle-social/waddle/issues/1316'
            summary: Sustained eviction of unacked XEP-0198 stanzas — message-loss risk for resuming clients.
    - name: waddle-broadcast
      rules:
        - alert: BroadcastDropsFull
          expr: increase(waddle_broadcast_dropped_full_total[1h]) > 50
          for: 1h
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: 0 in healthy history. Check for a wedged consumer or a fan-out storm; correlate with connection counts and pod CPU.
            summary: Broadcast stanzas dropped because recipient outbound channels are full — consumers cannot keep up.
    - name: waddle-janitors
      rules:
        - alert: JanitorHeartbeatStale
          expr: min by (janitor) (increase(waddle_janitor_sweeps_total[30m])) == 0
          for: 30m
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: Every janitor loop records a sweep heartbeat on every tick (intervals 30s-300s), so at least 6 sweeps are expected per 30m per janitor. Zero increase over 30m sustained for 30m means the named loop is wedged, not idle. The series only exists once the dual-emit release (PR 1418) is deployed - before that this rule has nothing to evaluate.
            summary: A janitor loop stopped emitting sweep heartbeats - the loop is wedged, not idle.
    - name: waddle-calls
      rules:
        - alert: CallSetupFailureRate
          expr: (sum(increase(waddle_call_setup_failed_total[30m])) / clamp_min(sum(increase(waddle_call_setup_attempted_total[30m])), 1)) > 0.1 and sum(increase(waddle_call_setup_attempted_total[30m])) >= 10
          for: 15m
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: 'Every Jingle session-initiate increments `waddle.call.setup.attempted` exactly once and terminates in one `.ok` or `.failed`, so this ratio is the real call success rate. Break it down by the `reason` label on the failed counter first - `room_not_found`/`membership_denied` point at the MUC gate (client joining the call before the room), `token_mint_failed` at the SFU/LiveKit credentials, `unsupported_transport` at a client regression. The `>= 10` arm suppresses tiny-denominator noise on a quiet cluster. Neither counter is zero-registered, so this rule silently does not evaluate until the first call of a deploy. https://github.com/waddle-social/waddle/issues/1452'
            summary: More than 10% of Jingle call setups are failing - users cannot start calls.
        - alert: CallSetupRoomNotFound
          expr: sum(increase(waddle_call_setup_failed_total{reason="room_not_found"}[1h])) > 20
          for: 30m
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: 'The Muji membership gate found no room actor for the requested MUC room, so no LiveKit token was minted. A steady stream means clients are sending the Muji session-initiate before their XEP-0045 join has landed, or room actors are being evicted under an active call. Correlate with the gate WARN line ("SFU token request denied") and its `call.id` on the same call. https://github.com/waddle-social/waddle/issues/1452'
            summary: Muji call setups are being refused because the MUC room has no live room actor.
        - alert: LiveKitWebhookRejections
          expr: sum(increase(waddle_call_webhook_events_total{outcome=~"signature_failed|decode_failed"}[30m])) > 0
          for: 15m
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: '0 in healthy history - LiveKit signs every delivery with the shared API secret. Sustained `signature_failed` means the `livekit-sfu-api-keys` Secret drifted between the SFU and waddle-server (or something unauthenticated is posting at the endpoint); `decode_failed` means LiveKit changed a payload shape we parse. Rejected deliveries are dropped, so participant-left cleanup stops and ghost Muji occupants accumulate until the 60s reconciler sweeps them.'
            summary: Inbound LiveKit webhooks are being rejected - SFU participant cleanup is not being applied.
        - alert: LiveKitWebhookSilent
          expr: (sum(increase(waddle_call_webhook_events_total{outcome="received"}[6h])) or vector(0)) == 0 and sum(increase(waddle_call_setup_ok_total[6h])) > 0
          for: 1h
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: 'Calls are being set up but no LiveKit webhook has been accepted in 6h - the ingestion path is dark, not idle (the `setup.ok` arm is what distinguishes the two). Check the SFU webhook configuration points at /api/v1/livekit/webhook, that the route still returns 200 (its request span carries http.route), and that the SFU is not returning SERVICE_UNAVAILABLE because no SFU is configured on this pod. Every accepted delivery also logs one "LiveKit webhook accepted" line with its `call.id`. The `or vector(0)` is load-bearing: without it a webhook counter that never ticks at all yields an empty vector and the rule silently stops evaluating - exactly the outage it exists to catch.'
            summary: No LiveKit webhook has been accepted in 6h despite active calls - participant cleanup is dark.
    # ── Legacy-name aliases (#1330 contract phase) ──────────────────
    # Each record keeps a retired waddle_* text-family name answering
    # from its OTel successor's translated series (dots→underscores,
    # UCUM {x} annotation units dropped, _total on monotonic sums,
    # gauges unsuffixed). They live in this namespace so the existing
    # sync invocation (--namespaces=waddle) deploys them; see README.
    - name: waddle-aliases-sm
      rules:
        - record: waddle_sm_unacked_evicted_total
          expr: sum by (job, instance) (xmpp_sm_unacked_evicted_total)
        - record: waddle_sm_promotion_storage_failed_total
          expr: sum by (job, instance) (xmpp_sm_promotion_storage_failed_total)
        - record: waddle_sm_promotion_not_promotable_total
          expr: sum by (job, instance) (xmpp_sm_promotion_not_promotable_total)
        - record: waddle_sm_promotion_blocklist_failed_total
          expr: sum by (job, instance) (xmpp_sm_promotion_blocklist_failed_total)
        - record: waddle_sm_promotion_dead_lettered_total
          expr: sum by (job, instance) (xmpp_sm_promotion_dead_lettered_total)
        - record: waddle_sm_drain_timeout_total
          expr: sum by (job, instance) (xmpp_sm_drain_timeout_total)
        - record: waddle_sm_resume_window_clamped_total
          expr: sum by (job, instance) (xmpp_sm_resume_window_clamped_total)
        - record: waddle_sm_send_window_pauses_total
          expr: sum by (job, instance) (xmpp_sm_send_window_pauses_total)
        - record: waddle_sm_send_window_pause_timeouts_total
          expr: sum by (job, instance) (xmpp_sm_send_window_pause_timeouts_total)
        - record: waddle_sm_detached_unacked_evicted_total
          expr: sum by (job, instance) (xmpp_sm_detached_unacked_evicted_total)
    - name: waddle-aliases-push
      rules:
        - record: waddle_push_candidate_created_total
          expr: sum by (job, instance) (xmpp_push_candidate_created_total)
        - record: waddle_push_candidate_coalesced_total
          expr: sum by (job, instance) (xmpp_push_candidate_coalesced_total)
        - record: waddle_push_outbox_published_total
          expr: sum by (job, instance) (xmpp_push_outbox_published_total)
        - record: waddle_push_outbox_retry_scheduled_total
          expr: sum by (job, instance, reason) (xmpp_push_outbox_retry_scheduled_total)
        - record: waddle_push_outbox_dead_lettered_total
          expr: sum by (job, instance) (xmpp_push_outbox_dead_lettered_total)
        - record: waddle_push_suppressed_total
          expr: sum by (job, instance, reason) (xmpp_push_suppressed_total)
    - name: waddle-aliases-pending
      rules:
        - record: waddle_pending_delivery_quota_exceeded_total
          expr: sum by (job, instance) (xmpp_pending_delivery_quota_exceeded_total)
        - record: waddle_pending_delivery_orphan_claims_released_total
          expr: sum by (job, instance) (xmpp_pending_delivery_orphan_claims_released_total)
        - record: waddle_pending_delivery_aged_out_total
          expr: sum by (job, instance) (xmpp_pending_delivery_aged_out_total)
        - record: waddle_pending_delivery_unresolved_poison_pill_total
          expr: sum by (job, instance) (xmpp_pending_delivery_unresolved_poison_pill_total)
        - record: waddle_pending_delivery_archive_lookup_transient_failure_total
          expr: sum by (job, instance) (xmpp_pending_delivery_archive_lookup_transient_failure_total)
        - record: waddle_pending_flush_batches_total
          expr: sum by (job, instance) (xmpp_pending_flush_batches_total)
        - record: waddle_pending_flush_rows_pushed_total
          expr: sum by (job, instance) (xmpp_pending_flush_rows_pushed_total)
    - name: waddle-aliases-broadcast
      rules:
        - record: waddle_broadcast_delivered_total
          expr: sum by (job, instance) (xmpp_broadcast_delivered_total)
        - record: waddle_broadcast_not_connected_total
          expr: sum by (job, instance) (xmpp_broadcast_not_connected_total)
        - record: waddle_broadcast_dropped_full_total
          expr: sum by (job, instance) (xmpp_broadcast_dropped_full_total)
        - record: waddle_broadcast_dropped_closed_total
          expr: sum by (job, instance) (xmpp_broadcast_dropped_closed_total)
    - name: waddle-aliases-delivery
      rules:
        - record: waddle_delivery_terminal_error_drop_total
          expr: sum by (job, instance) (xmpp_delivery_terminal_error_drop_total)
        - record: waddle_delivery_retry_exhausted_drop_total
          expr: sum by (job, instance) (xmpp_delivery_retry_exhausted_drop_total)
        - record: waddle_resolver_affiliation_sync_capacity_drop_total
          expr: sum by (job, instance) (xmpp_resolver_affiliation_sync_capacity_drop_total)
        - record: waddle_user_actor_reaped_total
          expr: sum by (job, instance) (xmpp_user_actor_reaped_total)
    - name: waddle-aliases-dnd
      rules:
        - record: waddle_dnd_projection_read_errored_total
          expr: sum by (job, instance) (xmpp_dnd_projection_read_errored_total)
    - name: waddle-aliases-traffic
      rules:
        - record: waddle_messages_total
          expr: sum by (job, instance) (waddle_messages_delivered_total)
        - record: waddle_messages_per_second
          expr: sum by (job, instance) (rate(waddle_messages_delivered_total[1m]))
        - record: waddle_connected_users
          expr: sum by (job, instance) (xmpp_connections_active)
