namespace: waddle
groups:
    - name: waddle-authority-custody
      rules:
        - alert: ConnectionActorMailboxBacklog
          expr: histogram_quantile(0.99, sum by (le, lane) (rate(waddle_connection_actor_mailbox_oldest_age_seconds_bucket[10m]))) > 30
          for: 10m
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: docs/runbooks/node-recovery-and-drain.md, "Stream management custody backlog". A control-lane backlog means lifecycle work is starved; a data-lane backlog means a writer is blocked.
            summary: The oldest message in connection actor mailboxes is more than 30 seconds old at the 99th percentile.
    - name: waddle-authority-uncertainty
      rules:
        # KeypairLeaseFencingLost and FencingRejectionSpike read waddle_clustering_*
        # series that exist in production, but tests/alert_metric_contract.py
        # requires a clustering metric contract entry for each before a live
        # rule may read them.
        - alert: KeypairLeaseFencingLost
          expr: sum(increase(waddle_clustering_keypair_lease_outcomes_total{outcome="fencing_lost"}[15m])) > 0
          labels:
            severity: critical
            team: waddle
          annotations:
            runbook: docs/runbooks/node-recovery-and-drain.md, "Node loss and slot steal". The node must stop using that identity; confirm it restarted and leased a slot again.
            summary: A node's keypair-slot renewal found its slot stolen or lapsed.
        - alert: FencingRejectionSpike
          expr: sum(increase(waddle_clustering_fence_results_total{result="rejected"}[15m])) > 20
          for: 15m
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: docs/runbooks/node-recovery-and-drain.md, "Node loss and slot steal". Rejections follow every takeover; a sustained rate means a node keeps writing after it lost its claims. Production recorded no rejections in the week before 2026-11-15.
            summary: Ownership fences are rejecting writers at an unusual rate.
        - alert: RelayOutcomeUncertain
          expr: sum(increase(waddle_relay_ordered_outcomes_total{outcome="uncertain"}[15m])) > 0
          for: 5m
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: docs/runbooks/node-recovery-and-drain.md, "Relay uncertainty backlog". An uncertain delivery may have committed on the peer; it is recovered by lookup, never resent blind.
            summary: Ordered relay deliveries ended with an unknown outcome.
        - alert: RelayRefusedOrTimedOut
          expr: sum by (outcome) (increase(waddle_relay_ordered_outcomes_total{outcome=~"nacked|timed_out|incompatible_peer"}[15m])) > 20
          for: 15m
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: docs/runbooks/node-recovery-and-drain.md, "Relay uncertainty backlog". `incompatible_peer` during a rollout means two message versions are live at once.
            summary: Ordered relay deliveries are being refused, timing out or meeting a peer on another message version.
    - name: waddle-actors
      rules:
        - alert: ActorPanicked
          expr: sum by (actor) (increase(waddle_actor_stopped_total{reason="panicked"}[15m])) > 0
          labels:
            severity: critical
            team: waddle
          annotations:
            runbook: Find the panic in the pod log by actor name; kameo logs the stop reason. A registry or database actor does not restart, so check that the pod is still serving. Connection actor panics are also counted by TransportTaskPanickedOrAbandoned.
            summary: An actor stopped because a handler or lifecycle hook panicked.
        - alert: ActorQueueWaitHigh
          expr: histogram_quantile(0.99, sum by (le, actor) (rate(waddle_actor_message_queue_wait_seconds_bucket[10m]))) > 1
          for: 10m
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: Open the Waddle actors dashboard. Compare the actor's busy fraction and handler duration; a long wait with short handlers means senders are blocked on a full mailbox. The wait is recorded only for handled messages, so a stuck actor shows as a handled rate that stops instead. The threshold is not measured.
            summary: Messages wait more than a second for their actor at the 99th percentile.
        - alert: ActorSaturated
          expr: sum by (actor, instance) (rate(waddle_actor_message_handle_duration_seconds_sum{actor=~"room_registry|user_registry|permission|db|relay"}[10m])) > 0.8
          for: 15m
          labels:
            severity: warning
            team: waddle
          annotations:
            runbook: These actors run one instance per pod, so the handler-seconds rate is the fraction of time the actor is busy. Find the slow message type in Tempo (`actor.handle_message` spans by `message`). The threshold is not measured.
            summary: A single-instance actor spends more than 80% of its time in handlers.
