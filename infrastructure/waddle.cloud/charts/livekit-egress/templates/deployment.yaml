apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "livekit-egress.fullname" . }}
  labels:
    {{- include "livekit-egress.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "livekit-egress.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "livekit-egress.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when the rendered config changes (new SFU URL,
        # rotated keys, …) — a Secret edit alone would not restart them.
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "livekit-egress.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: egress
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: EGRESS_CONFIG_FILE
              value: /etc/egress/config.yaml
          ports:
            - name: health
              containerPort: {{ .Values.egress.healthPort }}
              protocol: TCP
          # tcpSocket (not httpGet): only asserts the health server is
          # listening — egress opens it once initialized, so this gates
          # Flux `wait: true` on real startup without assuming a path.
          readinessProbe:
            tcpSocket:
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/egress
              readOnly: true
            # Headless-Chrome compositor scratch space.
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          secret:
            secretName: {{ include "livekit-egress.configSecretName" . }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shmSize }}
        - name: tmp
          emptyDir: {}
