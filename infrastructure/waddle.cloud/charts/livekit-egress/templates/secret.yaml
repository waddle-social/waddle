{{- /*
  The egress config carries secret material (api_secret, S3 keys), so it
  is rendered into a Secret rather than a ConfigMap. Built as a typed dict
  and serialized with toYaml — never string-concatenated — so quoting and
  structure are correct. `force_path_style` is required for Cloudflare R2's
  S3 API.
*/ -}}
{{- $s3 := dict
    "access_key" .Values.egress.s3.accessKey
    "secret" .Values.egress.s3.secret
    "region" .Values.egress.s3.region
    "endpoint" .Values.egress.s3.endpoint
    "bucket" .Values.egress.s3.bucket
    "force_path_style" true -}}
{{- $config := dict
    "log_level" .Values.egress.logLevel
    "ws_url" .Values.egress.wsUrl
    "api_key" .Values.egress.apiKey
    "api_secret" .Values.egress.apiSecret
    "redis" (dict "address" .Values.egress.redisAddress)
    "s3" $s3 -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "livekit-egress.configSecretName" . }}
  labels:
    {{- include "livekit-egress.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
{{ toYaml $config | indent 4 }}
