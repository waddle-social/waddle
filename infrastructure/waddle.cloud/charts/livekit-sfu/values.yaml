replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: livekit/livekit-server
  tag: v1.11.0
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

automountServiceAccountToken: false

service:
  type: ClusterIP
  annotations: {}
  port: 7880

terminationGracePeriodSeconds: 18000

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

apiKeys:
  existingSecret: ""
  secretKey: keys.yaml
  mountPath: /etc/livekit/keys/keys.yaml
  values: {}

# LiveKit → waddle-server SFU-authoritative MUC call cleanup.
# `apiKey` is injected at deploy time (must match a key in keys.yaml).
webhook:
  enabled: false
  apiKey: ""
  urls: []

livekit:
  port: 7880
  prometheus_port: 6789
  log_level: info
  rtc:
    use_external_ip: true
    tcp_port: 30881
    udp_port: 30882
  # Defaults state the production posture (TURN live at turn.waddle.social
  # over TLS/443 + UDP/30478): the previous `enabled: false` default,
  # while production ran TURN-on via the Flux HelmRelease override, already
  # misled one investigation.
  turn:
    enabled: true
    domain: turn.waddle.social
    udp_port: 30478
    tls_port: 443
    external_tls: false
    relay_range_start: 30000
    relay_range_end: 40000
    # Validity window of the TURN credentials livekit-server itself mints
    # and hands to clients in the join response; v1.12+ embeds the expiry
    # in the username and enforces it on new allocations (upstream default
    # 300). 3600 keeps mid-call allocations working (e.g. an ICE restart
    # more than 5 minutes into a call must still be able to Allocate) and
    # matches the 3600s window waddle-server uses for the credentials it
    # mints (`LIVEKIT_TURN_TTL_SECONDS`). Note the embedded TURN cannot
    # validate waddle's coturn-REST-style credentials at all — that scheme
    # mismatch is #1447, and this key does not affect it.
    ttl_seconds: 3600
    # livekit-server v1.12+ denies TURN relay to restricted peers
    # (loopback, link-local, private, multicast, unspecified) unless
    # allowed here. Explicitly empty for our topology: with
    # rtc.use_external_ip=true the co-located SFU advertises only the
    # node's public IP in ICE candidates, so relayed clients never request
    # a restricted peer. Extend only if the SFU ever advertises private
    # candidates — and mind that every CIDR added here is a range any
    # TURN-authenticated client can relay UDP into.
    allow_restricted_peer_cidrs: []
    # Both keys above were introduced in livekit-server v1.12.0. The
    # deployed v1.11.0 tolerates them because the container runs
    # `--disable-strict-config`
    # (templates/deployment.yaml); the upgrade (#1531) picks them up with
    # nothing but an image bump.

nodePorts:
  rtc:
    enabled: true
    annotations: {}
    externalTrafficPolicy: Cluster
    tcp: 30881
    udp: 30882
  turnUdp:
    enabled: true
    annotations: {}
    externalTrafficPolicy: Cluster
    udp: 30478

turn:
  secretName: ""
  mountPath: /etc/livekit/turn
  certKey: tls.crt
  keyKey: tls.key

podHostNetwork: false
podAnnotations:
  sidecar.istio.io/inject: "false"
  linkerd.io/inject: disabled
podLabels: {}
podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

tmpDir:
  enabled: true
  mountPath: /tmp
  sizeLimit: 64Mi

# Default resource requests/limits. An empty `resources: {}` lets the
# pod run unbounded and means a single misbehaving SFU can starve the
# node or get OOM-killed without a guaranteed floor — production must
# not rely on the Flux HelmRelease override to supply these. These
# defaults match `gitops/livekit-sfu/helmrelease.yaml`; tune per node
# size. CPU limit is set well above the request because media muxing is
# bursty and CPU throttling degrades call quality more than it protects
# the node.
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}
