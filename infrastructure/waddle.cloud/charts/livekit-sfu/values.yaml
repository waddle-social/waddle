replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: livekit/livekit-server
  tag: v1.11.0
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

automountServiceAccountToken: false

service:
  type: ClusterIP
  annotations: {}
  port: 7880

terminationGracePeriodSeconds: 18000

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

apiKeys:
  existingSecret: ""
  secretKey: keys.yaml
  mountPath: /etc/livekit/keys/keys.yaml
  values: {}

# LiveKit → waddle-server SFU-authoritative MUC call cleanup.
# `apiKey` is injected at deploy time (must match a key in keys.yaml).
webhook:
  enabled: false
  apiKey: ""
  urls: []

livekit:
  port: 7880
  prometheus_port: 6789
  log_level: info
  rtc:
    use_external_ip: true
    tcp_port: 30881
    udp_port: 30882
  turn:
    enabled: false
    domain: ""
    udp_port: 30478
    tls_port: 443
    external_tls: false
    relay_range_start: 30000
    relay_range_end: 40000

nodePorts:
  rtc:
    enabled: true
    annotations: {}
    externalTrafficPolicy: Cluster
    tcp: 30881
    udp: 30882
  turnUdp:
    enabled: false
    annotations: {}
    externalTrafficPolicy: Cluster
    udp: 30478

turn:
  secretName: ""
  mountPath: /etc/livekit/turn
  certKey: tls.crt
  keyKey: tls.key

podHostNetwork: false
podAnnotations:
  sidecar.istio.io/inject: "false"
  linkerd.io/inject: disabled
podLabels: {}
podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

tmpDir:
  enabled: true
  mountPath: /tmp
  sizeLimit: 64Mi

# Default resource requests/limits. An empty `resources: {}` lets the
# pod run unbounded and means a single misbehaving SFU can starve the
# node or get OOM-killed without a guaranteed floor — production must
# not rely on the Flux HelmRelease override to supply these. These
# defaults match `gitops/livekit-sfu/helmrelease.yaml`; tune per node
# size. CPU limit is set well above the request because media muxing is
# bursty and CPU throttling degrades call quality more than it protects
# the node.
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}
