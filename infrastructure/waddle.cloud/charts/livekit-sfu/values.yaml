replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: livekit/livekit-server
  tag: v1.11.0
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

automountServiceAccountToken: false

service:
  type: ClusterIP
  annotations: {}
  port: 7880

terminationGracePeriodSeconds: 18000

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

apiKeys:
  existingSecret: ""
  secretKey: keys.yaml
  mountPath: /etc/livekit/keys/keys.yaml
  values: {}

livekit:
  port: 7880
  log_level: info
  rtc:
    use_external_ip: true
    tcp_port: 7881
    udp_port: 7882
  turn:
    enabled: false
    domain: ""
    udp_port: 3478
    tls_port: 5349
    external_tls: false
    relay_range_start: 30000
    relay_range_end: 40000

turn:
  secretName: ""
  mountPath: /etc/livekit/turn
  certKey: tls.crt
  keyKey: tls.key

podHostNetwork: true
podAnnotations:
  sidecar.istio.io/inject: "false"
  linkerd.io/inject: disabled
podLabels: {}
podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

tmpDir:
  enabled: true
  mountPath: /tmp
  sizeLimit: 64Mi

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
