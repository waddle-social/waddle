{{- if and .Values.nodePorts.turnUdp.enabled (or .Values.sharedTURN.configSecretName .Values.livekit.turn.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "livekit-sfu.fullname" . }}-turn-udp
  labels:
    {{- include "livekit-sfu.labels" . | nindent 4 }}
  {{- with .Values.nodePorts.turnUdp.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: NodePort
  externalTrafficPolicy: {{ .Values.nodePorts.turnUdp.externalTrafficPolicy }}
  ports:
    - name: turn-udp
      port: {{ .Values.nodePorts.turnUdp.udp }}
      targetPort: turn-udp
      nodePort: {{ .Values.nodePorts.turnUdp.udp }}
      protocol: UDP
  selector:
    {{- if .Values.sharedTURN.configSecretName }}
    app.kubernetes.io/name: coturn
    app.kubernetes.io/instance: coturn
    {{- else }}
    {{- include "livekit-sfu.selectorLabels" . | nindent 4 }}
    {{- end }}
{{- end }}
