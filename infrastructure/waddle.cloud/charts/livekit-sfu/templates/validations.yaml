{{- if and (not .Values.apiKeys.existingSecret) (eq (len .Values.apiKeys.values) 0) -}}
{{- fail "livekit-sfu requires apiKeys.existingSecret or apiKeys.values to be set" -}}
{{- end -}}
{{- range $apiKey, $apiSecret := .Values.apiKeys.values -}}
{{- if lt (len (printf "%v" $apiSecret)) 32 -}}
{{- fail (printf "apiKeys.values.%s must be at least 32 characters" $apiKey) -}}
{{- end -}}
{{- end -}}
{{- /*
  Single-replica is intentional but has NO high availability: there is
  exactly one SFU pod, so a node drain, kernel/node upgrade, helm
  rollout, or pod eviction drops every active call (media has no second
  replica to fail over to, and WebRTC sessions are stateful in-process).
  Operational guidance:
    - Schedule node maintenance / upgrades in announced maintenance
      windows when call volume is lowest.
    - Cordon + wait for calls to drain rather than hard-draining;
      `terminationGracePeriodSeconds` (values.yaml, default 18000s = 5h)
      lets in-flight calls finish before the pod is killed.
    - Going multi-replica requires a LiveKit setup with Redis-backed
      room distribution and node selection — not just bumping
      `replicaCount`; hence this hard guard.
*/ -}}
{{- if ne (int .Values.replicaCount) 1 -}}
{{- fail "livekit-sfu is intentionally single-node for now; replicaCount must be 1" -}}
{{- end -}}
{{- $nodePortMin := 30000 -}}
{{- $nodePortMax := 32767 -}}
{{- $capabilities := default (list) .Values.securityContext.capabilities.add -}}
{{- $canBindPrivileged := has "NET_BIND_SERVICE" $capabilities -}}
{{- if and .Values.livekit.port (lt (int .Values.livekit.port) 1024) (not $canBindPrivileged) -}}
{{- fail "livekit.port below 1024 requires securityContext.capabilities.add to include NET_BIND_SERVICE" -}}
{{- end -}}
{{- if and .Values.livekit.rtc.tcp_port (lt (int .Values.livekit.rtc.tcp_port) 1024) (not $canBindPrivileged) -}}
{{- fail "livekit.rtc.tcp_port below 1024 requires securityContext.capabilities.add to include NET_BIND_SERVICE" -}}
{{- end -}}
{{- if and .Values.livekit.rtc.udp_port (lt (int .Values.livekit.rtc.udp_port) 1024) (not $canBindPrivileged) -}}
{{- fail "livekit.rtc.udp_port below 1024 requires securityContext.capabilities.add to include NET_BIND_SERVICE" -}}
{{- end -}}
{{- if and .Values.livekit.turn.tls_port (lt (int .Values.livekit.turn.tls_port) 1024) (not $canBindPrivileged) -}}
{{- fail "livekit.turn.tls_port below 1024 requires securityContext.capabilities.add to include NET_BIND_SERVICE" -}}
{{- end -}}
{{- if and .Values.livekit.turn.udp_port (lt (int .Values.livekit.turn.udp_port) 1024) (not $canBindPrivileged) -}}
{{- fail "livekit.turn.udp_port below 1024 requires securityContext.capabilities.add to include NET_BIND_SERVICE" -}}
{{- end -}}
{{- if and .Values.nodePorts.rtc.enabled .Values.livekit.rtc.tcp_port (not .Values.nodePorts.rtc.tcp) -}}
{{- fail "nodePorts.rtc.tcp is required when nodePorts.rtc.enabled=true and livekit.rtc.tcp_port is set" -}}
{{- end -}}
{{- if and .Values.nodePorts.rtc.enabled .Values.livekit.rtc.udp_port (not .Values.nodePorts.rtc.udp) -}}
{{- fail "nodePorts.rtc.udp is required when nodePorts.rtc.enabled=true and livekit.rtc.udp_port is set" -}}
{{- end -}}
{{- if and .Values.nodePorts.rtc.enabled .Values.livekit.rtc.tcp_port .Values.nodePorts.rtc.tcp (ne (int .Values.nodePorts.rtc.tcp) (int .Values.livekit.rtc.tcp_port)) -}}
{{- fail "nodePorts.rtc.tcp must match livekit.rtc.tcp_port so LiveKit advertises a reachable TCP candidate" -}}
{{- end -}}
{{- if and .Values.nodePorts.rtc.enabled .Values.livekit.rtc.udp_port .Values.nodePorts.rtc.udp (ne (int .Values.nodePorts.rtc.udp) (int .Values.livekit.rtc.udp_port)) -}}
{{- fail "nodePorts.rtc.udp must match livekit.rtc.udp_port so LiveKit advertises a reachable UDP candidate" -}}
{{- end -}}
{{- if and .Values.nodePorts.rtc.enabled .Values.nodePorts.rtc.tcp (or (lt (int .Values.nodePorts.rtc.tcp) $nodePortMin) (gt (int .Values.nodePorts.rtc.tcp) $nodePortMax)) -}}
{{- fail "nodePorts.rtc.tcp must be inside the Kubernetes NodePort range 30000-32767" -}}
{{- end -}}
{{- if and .Values.nodePorts.rtc.enabled .Values.nodePorts.rtc.udp (or (lt (int .Values.nodePorts.rtc.udp) $nodePortMin) (gt (int .Values.nodePorts.rtc.udp) $nodePortMax)) -}}
{{- fail "nodePorts.rtc.udp must be inside the Kubernetes NodePort range 30000-32767" -}}
{{- end -}}
{{- if and .Values.nodePorts.turnUdp.enabled (not (and .Values.livekit.turn.enabled .Values.livekit.turn.udp_port)) -}}
{{- fail "nodePorts.turnUdp.enabled=true requires livekit.turn.enabled=true and livekit.turn.udp_port to be set" -}}
{{- end -}}
{{- if and .Values.nodePorts.turnUdp.enabled .Values.livekit.turn.udp_port .Values.nodePorts.turnUdp.udp (ne (int .Values.nodePorts.turnUdp.udp) (int .Values.livekit.turn.udp_port)) -}}
{{- fail "nodePorts.turnUdp.udp must match livekit.turn.udp_port so LiveKit advertises a reachable TURN/UDP port" -}}
{{- end -}}
{{- if and .Values.nodePorts.turnUdp.enabled .Values.nodePorts.turnUdp.udp (or (lt (int .Values.nodePorts.turnUdp.udp) $nodePortMin) (gt (int .Values.nodePorts.turnUdp.udp) $nodePortMax)) -}}
{{- fail "nodePorts.turnUdp.udp must be inside the Kubernetes NodePort range 30000-32767" -}}
{{- end -}}
{{- if and .Values.livekit.turn.enabled .Values.livekit.turn.udp_port (not .Values.podHostNetwork) (not .Values.nodePorts.turnUdp.enabled) -}}
{{- fail "livekit.turn.udp_port is set but nodePorts.turnUdp.enabled=false (and podHostNetwork=false): the embedded TURN/UDP listener would have no NodePort, so LiveKit advertises a udp relay candidate clients cannot reach and calls silently fall back to the TCP/443 relay. Set nodePorts.turnUdp.enabled=true, enable podHostNetwork, or unset livekit.turn.udp_port." -}}
{{- end -}}
{{- if and (or .Values.nodePorts.rtc.enabled .Values.nodePorts.turnUdp.enabled) (not .Values.podHostNetwork) (not .Values.livekit.rtc.use_external_ip) -}}
{{- fail "media NodePorts are exposed (nodePorts.rtc/turnUdp) without hostNetwork but livekit.rtc.use_external_ip=false: LiveKit would advertise its in-cluster pod IP in ICE candidates, so external clients cannot reach the SFU or the TURN relay. Set livekit.rtc.use_external_ip=true." -}}
{{- end -}}
{{- if and (not .Values.livekit.rtc.udp_port) (not (and .Values.livekit.rtc.port_range_start .Values.livekit.rtc.port_range_end)) -}}
{{- fail "livekit-sfu requires either livekit.rtc.udp_port or livekit.rtc.port_range_start/livekit.rtc.port_range_end" -}}
{{- end -}}
{{- if and .Values.livekit.turn.enabled (not .Values.livekit.turn.domain) -}}
{{- fail "livekit.turn.domain is required when turn.enabled=true" -}}
{{- end -}}
{{- if and .Values.livekit.turn.enabled (not (or .Values.livekit.turn.tls_port .Values.livekit.turn.udp_port)) -}}
{{- fail "livekit.turn requires at least one of tls_port or udp_port when enabled" -}}
{{- end -}}
{{- if and .Values.livekit.turn.enabled (not .Values.livekit.turn.ttl_seconds) -}}
{{- fail "livekit.turn.ttl_seconds is required when turn.enabled=true: livekit-server v1.12+ enforces it as the validity window of the TURN credentials it mints itself (upstream default 300), and a short window breaks mid-call allocations such as an ICE restart more than 5 minutes into a call; set 3600 (see values.yaml)" -}}
{{- end -}}
{{- if and .Values.livekit.turn.enabled (not (hasKey .Values.livekit.turn "allow_restricted_peer_cidrs")) -}}
{{- fail "livekit.turn.allow_restricted_peer_cidrs must be set explicitly (an empty list is valid) when turn.enabled=true: livekit-server v1.13+ denies relay to restricted peers by default, and this policy must be a deliberate choice for the relay topology" -}}
{{- end -}}
{{- if and .Values.livekit.turn.enabled .Values.livekit.turn.tls_port (not .Values.livekit.turn.external_tls) (not .Values.turn.secretName) -}}
{{- fail "turn.secretName is required when livekit.turn.tls_port is set and livekit.turn.external_tls=false" -}}
{{- end -}}
{{- if and .Values.webhook.enabled (eq (len .Values.webhook.urls) 0) -}}
{{- fail "webhook.urls is required when webhook.enabled=true" -}}
{{- end -}}
{{- if and .Values.webhook.enabled (not .Values.webhook.apiKey) -}}
{{- fail "webhook.apiKey is required when webhook.enabled=true" -}}
{{- end -}}
