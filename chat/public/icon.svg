<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#00b4a0"/>
  <g transform="translate(256,256)">
    <!-- body -->
    <ellipse cx="0" cy="20" rx="100" ry="120" fill="#1a1c24"/>
    <!-- belly -->
    <ellipse cx="0" cy="40" rx="65" ry="85" fill="#e4e6ed"/>
    <!-- head -->
    <circle cx="0" cy="-100" r="70" fill="#1a1c24"/>
    <!-- left eye -->
    <circle cx="-22" cy="-110" r="12" fill="#e4e6ed"/>
    <circle cx="-20" cy="-112" r="6" fill="#1a1c24"/>
    <!-- right eye -->
    <circle cx="22" cy="-110" r="12" fill="#e4e6ed"/>
    <circle cx="24" cy="-112" r="6" fill="#1a1c24"/>
    <!-- beak -->
    <path d="M-12,-88 L0,-72 L12,-88 Z" fill="#f59e0b"/>
    <!-- left flipper -->
    <path d="M-95,0 Q-120,40 -90,90 Q-80,70 -85,20 Z" fill="#1a1c24"/>
    <!-- right flipper -->
    <path d="M95,0 Q120,40 90,90 Q80,70 85,20 Z" fill="#1a1c24"/>
    <!-- left foot -->
    <ellipse cx="-35" cy="140" rx="30" ry="12" fill="#f59e0b"/>
    <!-- right foot -->
    <ellipse cx="35" cy="140" rx="30" ry="12" fill="#f59e0b"/>
  </g>
</svg>
