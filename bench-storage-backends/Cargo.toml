[workspace]
resolver = "2"
members = [
    "crates/bench-core",
    "crates/bench-sqlite",
    "crates/bench-postgres",
    "crates/bench-duckdb",
    "crates/bench-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["Waddle Contributors"]
repository = "https://github.com/waddle-social/bench"

[workspace.dependencies]
# Async
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Data
uuid = { version = "1.11", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Util
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
hdrhistogram = "7"
clap = { version = "4", features = ["derive"] }

# Backends
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
