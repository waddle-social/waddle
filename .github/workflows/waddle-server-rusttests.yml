jobs:
  nixTestShard1:
    name: nixTestShard1
    runs-on: nscloud-ubuntu-24.04-amd64-8x16;job.priority=1
    needs:
      - nixTestArchive-builder
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614
        with:
          extra-conf: accept-flake-config = true
      - name: Setup FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@e80fccc9c4e3a885ad51721c8b92ba3f839d2f6f
        with:
          use-gha-cache: disabled
      - name: Setup Hestia Nix Cache
        uses: Mic92/hestia@fb239a2f72d4b6e26eec5425f289dea23b27a527
        with:
          version: v2.0.0
          upstream-cache-filter: "true"
          drain-timeout: "900"
      - name: Download test archive metadata
        id: archive-metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nixTestArchive-1-metadata
          path: server/.ci/nextest-archive/builder
          digest-mismatch: error
      - name: Restore and verify archive from binary caches
        id: archive-cache
        shell: bash
        working-directory: server
        env:
          METADATA_DOWNLOAD: ${{ steps.archive-metadata.outputs.download-path }}
        run: |-
          set -euo pipefail
          if [[ -z "$METADATA_DOWNLOAD" ]]; then
            echo "Metadata download exited without reporting completion; no Nix operation attempted" >&2
            exit 1
          fi
          bash scripts/nextest-archive-transfer.sh validate .ci/nextest-archive/builder 1
          expected="$(nix eval --raw ../#waddle-server-test-archive.shard1.outPath)"
          if bash scripts/nextest-archive-transfer.sh cache "$expected" .ci/nextest-archive/builder 1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then exit "$status"; fi
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download raw test archive
        id: archive-payload
        if: ${{ steps.archive-cache.outputs.hit == 'false' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: archive-1.nar
          path: server/.ci/nextest-archive/builder
          skip-decompress: true
          digest-mismatch: error
      - name: Require completed artifact downloads
        shell: bash
        env:
          METADATA_DOWNLOAD: ${{ steps.archive-metadata.outputs.download-path }}
          PAYLOAD_DOWNLOAD: ${{ steps.archive-payload.outputs.download-path }}
          CACHE_HIT: ${{ steps.archive-cache.outputs.hit }}
        run: |-
          if [[ -z "$METADATA_DOWNLOAD" ]]; then
            echo "Metadata download exited without reporting completion" >&2
            exit 1
          fi
          if [[ "$CACHE_HIT" == true ]]; then exit 0; fi
          if [[ "$CACHE_HIT" != false || -z "$PAYLOAD_DOWNLOAD" ]]; then
            echo "Artifact download exited without reporting completion; no Nix import attempted" >&2
            exit 1
          fi
      - name: Run test shard
        shell: bash
        env:
          ARCHIVE_TRANSFER_MODE: ${{ steps.archive-cache.outputs.hit == 'true' && 'verify' || 'import' }}
        run: |-
          set -euo pipefail
          expected="$(nix eval --raw ../#waddle-server-test-archive.shard1.outPath)"
          transfer_mode="${ARCHIVE_TRANSFER_MODE:-import}"
          case "$transfer_mode" in import|verify) ;; *) echo "Invalid archive transfer mode" >&2; exit 1 ;; esac
          bash scripts/nextest-archive-transfer.sh "$transfer_mode" "$expected" .ci/nextest-archive/builder 1
          nix build --print-build-logs --no-link ../#waddle-server-test-shard-1
        working-directory: server
