# Generated from ci/rust-tests/workflow.cue; do not edit manually.
# Regenerate with: bash scripts/sync-rust-tests.sh

name: waddle-server-rustTests
"on":
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  nixTest-builder:
    name: nixTest (compile and four isolated shards)
    runs-on:
      - nscloud-ubuntu-24.04-amd64-32x64-with-features
      - namespace-features:container.privileged=true;job.priority=1
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614
        with:
          extra-conf: accept-flake-config = true
      - name: Setup FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@e80fccc9c4e3a885ad51721c8b92ba3f839d2f6f
        with:
          use-gha-cache: disabled
      - name: Setup Hestia Nix Cache
        uses: Mic92/hestia@fb239a2f72d4b6e26eec5425f289dea23b27a527
        with:
          version: v2.0.0
          upstream-cache-filter: "true"
          drain-timeout: "900"
      - name: Validate CI helper contracts
        shell: bash
        run: bash server/scripts/check-ci-helper-contracts.sh
      - name: Compile and run four isolated test shards
        shell: bash
        run: timeout --kill-after=2m 55m bash scripts/run-nextest-shards.sh
        working-directory: server
      - name: Upload compiler and coverage diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nixTestArchive-diagnostics
          path: server/.ci/nextest-archive
          if-no-files-found: error
          include-hidden-files: true
  nixTest:
    name: nixTest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - nixTest-builder
    steps:
      - name: Require compilation and all four isolated test shards
        shell: bash
        env:
          TEST_RESULT: ${{ needs['nixTest-builder'].result }}
        run: |-
          set -euo pipefail
          if [[ "$TEST_RESULT" != success ]]; then
            echo "Compilation and all four shards must succeed; received: ${TEST_RESULT:-missing}" >&2
            exit 1
          fi
          echo "All four test shards and inventory checks passed."
