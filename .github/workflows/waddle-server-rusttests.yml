  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: none
  packages: read
  id-token: write
jobs:
  nixTestShard1:
    name: nixTestShard1
    runs-on: namespace-profile-linux-x86
    needs:
      - nixTestArchive-builder
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614
        with:
          extra-conf: accept-flake-config = true
      - name: Setup FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@e80fccc9c4e3a885ad51721c8b92ba3f839d2f6f
        with:
          use-gha-cache: disabled
      - name: Setup Hestia Nix Cache
        uses: Mic92/hestia@fb239a2f72d4b6e26eec5425f289dea23b27a527
        with:
          version: v2.0.0
          upstream-cache-filter: "true"
          drain-timeout: "900"
      - name: Download test archive metadata
        id: archive-metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nixTestArchive-metadata
          path: server/.ci/nextest-archive/builder
          digest-mismatch: error
      - name: Download raw test archive
        id: archive-payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: archive.nar
          path: server/.ci/nextest-archive/builder
          skip-decompress: true
          digest-mismatch: error
      - name: Require completed artifact downloads
        shell: bash
        env:
          METADATA_DOWNLOAD: ${{ steps.archive-metadata.outputs.download-path }}
          PAYLOAD_DOWNLOAD: ${{ steps.archive-payload.outputs.download-path }}
        run: |-
          if [[ -z "$METADATA_DOWNLOAD" || -z "$PAYLOAD_DOWNLOAD" ]]; then
            echo "Artifact download exited without reporting completion; no Nix import attempted" >&2
            exit 1
          fi
      - name: Run test shard
        shell: bash
        run: |-
          set -euo pipefail
          expected="$(nix eval --raw ../#waddle-server-test-archive.outPath)"
          bash scripts/nextest-archive-transfer.sh import "$expected" .ci/nextest-archive/builder
          nix build --print-build-logs --no-link ../#waddle-server-test-shard-1
        working-directory: server
