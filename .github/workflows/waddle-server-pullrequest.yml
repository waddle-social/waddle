# Generated by cuenv - do not edit manually
# Regenerate with: cuenv ci --format github

name: waddle-server-pullRequest
on:
  pull_request:
    paths:
    - .github/workflows/waddle-server-pullrequest.yml
    - cue.mod/**
    - server/**/env.cue
    - infrastructure/waddle.cloud/gitops/waddle-server/**
    - infrastructure/waddle.cloud/gitops/waddle-server-source.yaml
    - infrastructure/waddle.cloud/gitops/kustomization-infra-waddle-server.yaml
    - server/Cargo.lock
    - server/Cargo.toml
    - server/charts/waddle-server/**
    - server/crates/**
    - server/env.cue
    - server/extensions/**
    - server/schema/**
    - server/wit/**
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write
jobs:
  waddle-server-pullRequest:
    name: waddle-server-pullRequest
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Nix
      uses: DeterminateSystems/determinate-nix-action@v3
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        curl -sSL -o /usr/local/bin/cuenv "https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: 'Run pipeline: pullRequest'
      run: cuenv ci --pipeline pullRequest --path server
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
