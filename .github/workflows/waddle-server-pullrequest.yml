name: waddle-server-pullRequest
on:
  pull_request:
    paths:
    - .github/workflows/waddle-server-pullrequest.yml
    - cue.mod/**
    - server/../flake.lock
    - server/../flake.nix
    - server/Cargo.lock
    - server/Cargo.toml
    - server/charts/**
    - server/crates/**
    - server/env.cue
    - server/rust-toolchain.toml
    - server/schema/**
    - server/scripts/check-nix-cache-keys.sh
    - server/wit/**
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write
jobs:
  nixBuildServer:
    name: nixBuildServer
    runs-on: namespace-profile-linux-x86
    needs:
    - nixWarmServerDeps
    - nixFlakeCheck
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Setup FlakeHub Cache
      uses: DeterminateSystems/flakehub-cache-action@v3
      with:
        flakehub-flake-name: waddle-social/waddle
        use-gha-cache: disabled
    - name: nixBuildServer
      run: nix build ../#waddle-server -L --accept-flake-config --max-jobs 1 --cores 0
      working-directory: server
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
  nixCacheKeyContract:
    name: nixCacheKeyContract
    runs-on: namespace-profile-linux-x86
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Setup FlakeHub Cache
      uses: DeterminateSystems/flakehub-cache-action@v3
      with:
        flakehub-flake-name: waddle-social/waddle
        use-gha-cache: disabled
    - name: nixCacheKeyContract
      run: nix develop -L --accept-flake-config .. -c bash scripts/check-nix-cache-keys.sh
      working-directory: server
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
  nixFlakeCheck:
    name: nixFlakeCheck
    runs-on: namespace-profile-linux-x86
    needs:
    - nixWarmServerDeps
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Setup FlakeHub Cache
      uses: DeterminateSystems/flakehub-cache-action@v3
      with:
        flakehub-flake-name: waddle-social/waddle
        use-gha-cache: disabled
    - name: nixFlakeCheck
      run: nix flake check .. -L --accept-flake-config --max-jobs 1 --cores 0
      working-directory: server
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
  nixWarmServerDeps:
    name: nixWarmServerDeps
    runs-on: namespace-profile-linux-x86
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
