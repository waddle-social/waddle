        extra-conf: accept-flake-config = true
    - name: Setup FlakeHub Cache
      uses: DeterminateSystems/flakehub-cache-action@v3
      with:
        flakehub-flake-name: waddle-social/waddle
        use-gha-cache: disabled
    - name: nixWarmServerDeps
      run: nix build ../#waddle-server-deps ../#waddle-server-workspace-deps ../#waddle-server-workspace-all-features-deps ../#waddle-server-xmpp-deps ../#waddle-server-test-deps -L --accept-flake-config --max-jobs 1 --cores 0
      working-directory: server
      env:
