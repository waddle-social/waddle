name: publication-selector-canary

on:
  pull_request:
    branches: ["claude/2046-w1-1-evidence-lane"]
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/ci-publish-selector-canary.yml"]

permissions:
  contents: read

concurrency:
  group: publication-selector-canary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ciHelperContracts:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/2046-runner-canary'
    runs-on: ${{ fromJSON(fromJSON(toJSON(needs)).ciHelperContracts.result == 'success' && fromJSON(toJSON(needs)).nixTestLocal.result == '' && '["nscloud-ubuntu-24.04-amd64-32x64-with-features","namespace-features:container.privileged=true;job.priority=1"]' || '["namespace-profile-linux-x86"]') }}
    timeout-minutes: 55
    outputs:
      sha: ${{ steps.evidence.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614
        with:
          extra-conf: accept-flake-config = true
      - name: Exercise missing and wrong ambient CUE
        run: |
          set -euo pipefail
          export CANARY_MISSING_PATH="$RUNNER_TEMP/canary-missing-cue"
          python3 - <<'PY'
          import os
          from pathlib import Path
          destination = Path(os.environ["CANARY_MISSING_PATH"])
          destination.mkdir()
          for directory in os.get_exec_path():
              source = Path(directory)
              if not source.is_dir():
                  continue
              for entry in source.iterdir():
                  target = destination / entry.name
                  if (entry.name != "cue" and entry.is_file()
                          and os.access(entry, os.X_OK) and not target.exists()):
                      target.symlink_to(entry.absolute())
          PY
          PATH="$CANARY_MISSING_PATH" bash -c '
            set -euo pipefail
            if command -v cue; then
              echo "Missing-CUE precondition failed" >&2
              exit 1
            fi
            bash server/scripts/check-ci-helper-contracts.sh
          '
          wrong="$RUNNER_TEMP/canary-wrong-cue"
          mkdir "$wrong"
          cat > "$wrong/cue" <<'SH'
          #!/bin/bash
          if [[ "${1:-}" == version ]]; then
            printf 'cue version v0.17.1\n\nCUE language version v0.17.1\n\n'
            exit 0
          fi
          echo "Wrong-version CUE must never evaluate files" >&2
          exit 97
          SH
          chmod +x "$wrong/cue"
          PATH="$wrong:$PATH" bash -c '
            set -euo pipefail
            cue version
            bash server/scripts/check-ci-helper-contracts.sh
          '
      - id: evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'normal helper runner: %s\n' "$RUNNER_NAME"

  nixTestLocal:
    needs: [ciHelperContracts]
    runs-on: ${{ fromJSON(fromJSON(toJSON(needs)).ciHelperContracts.result == 'success' && fromJSON(toJSON(needs)).nixTestLocal.result == '' && '["nscloud-ubuntu-24.04-amd64-32x64-with-features","namespace-features:container.privileged=true;job.priority=1"]' || '["namespace-profile-linux-x86"]') }}
    timeout-minutes: 50
    outputs:
      sha: ${{ steps.evidence.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614
        with:
          extra-conf: accept-flake-config = true
      - name: Verify CPU availability, shell and sandbox
        env:
          HELPER_SHA: ${{ needs.ciHelperContracts.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$HELPER_SHA" = "$GITHUB_SHA"
          python3 - <<'PY'
          import os
          cpus = sorted(os.sched_getaffinity(0))
          print("Available CPUs:", cpus)
          assert len(cpus) >= 32, cpus
          PY
          nix develop --no-write-lock-file --command bash -c '
            set -euo pipefail
            python3 -c "import subprocess; assert '\''CUE language version v0.16.1'\'' in subprocess.check_output(['\''cue'\'', '\''version'\''], text=True).splitlines()"
          '
          probe='let f = builtins.getFlake (toString ./.); pkgs = import f.inputs.nixpkgs { system = builtins.currentSystem; }; in pkgs.runCommand "waddle-ci-sandbox-probe" {} "echo WADDLE_SANDBOX_PROBE >&2; touch $out"'
          nix build -L --impure --no-link --no-write-lock-file \
            --option builders '' --option sandbox true --option sandbox-fallback false --expr "$probe"
          nix build -L --rebuild --impure --no-link --no-write-lock-file \
            --option builders '' --option sandbox true --option sandbox-fallback false --expr "$probe"
      - id: evidence
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'privileged test runner: %s\n' "$RUNNER_NAME"

  publishContainerImage:
    needs: [ciHelperContracts, nixTestLocal]
    permissions: {}
    runs-on: ${{ fromJSON(fromJSON(toJSON(needs)).ciHelperContracts.result == 'success' && fromJSON(toJSON(needs)).nixTestLocal.result == '' && '["nscloud-ubuntu-24.04-amd64-32x64-with-features","namespace-features:container.privileged=true;job.priority=1"]' || '["namespace-profile-linux-x86"]') }}
    timeout-minutes: 5
    steps:
      - name: Simulate publication without running publication code
        env:
          HELPER_SHA: ${{ needs.ciHelperContracts.outputs.sha }}
          TEST_SHA: ${{ needs.nixTestLocal.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$HELPER_SHA"
          test "$HELPER_SHA" = "$TEST_SHA"
          test "$TEST_SHA" = "$GITHUB_SHA"
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          printf 'SIMULATION ONLY: revision=%s runner=%s\n' "$GITHUB_SHA" "$RUNNER_NAME"

  skippedPrerequisite:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1

  blockedBySkip:
    needs: [skippedPrerequisite]
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "ERROR: a skipped prerequisite did not block this job" >&2
          exit 1

  verdict:
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/2046-runner-canary'
    needs: [ciHelperContracts, nixTestLocal, publishContainerImage, skippedPrerequisite, blockedBySkip]
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require positive and negative evidence
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = {
              "ciHelperContracts": "success",
              "nixTestLocal": "success",
              "publishContainerImage": "success",
              "skippedPrerequisite": "skipped",
              "blockedBySkip": "skipped",
          }
          actual = {name: results[name]["result"] for name in expected}
          print(actual)
          assert actual == expected, (actual, expected)
          PY
