    - server/schema/**
    - server/wit/**
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: none
  packages: read
  id-token: write
jobs:
  build-cuenv:
    name: build.cuenv
    runs-on: namespace-profile-linux-x86
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Cache /nix on Namespace volume
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
    - name: Hand /nix to the runner user
      run: sudo chown -R runner /nix
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: accept-flake-config = true
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        curl -sSL -o /usr/local/bin/cuenv "https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  nixXmppServerTests:
    name: nixXmppServerTests
    runs-on: namespace-profile-linux-x86
    needs:
    - build-cuenv
    steps:
    - name: Checkout
      uses: actions/checkout@v4
