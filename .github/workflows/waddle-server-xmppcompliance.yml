    - server/schema/**
    - server/wit/**
  pull_request:
    branches:
    - main
    paths:
    - .github/workflows/waddle-server-xmppcompliance.yml
    - cue.mod/**
    - flake.lock
    - flake.lock/**
    - flake.nix
    - flake.nix/**
