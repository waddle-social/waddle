# Generated by cuenv - do not edit manually
# Regenerate with: cuenv sync ci

name: waddle-linux-pullRequest
on:
  pull_request:
    paths:
    - .github/workflows/waddle-linux-*.yml
    - .github/workflows/waddle-linux-pullrequest.yml
    - apps/linux/Cargo.lock
    - apps/linux/Cargo.lock/**
    - apps/linux/Cargo.toml
    - apps/linux/Cargo.toml/**
    - apps/linux/data/**
    - apps/linux/env.cue
    - apps/linux/env.cue/**
    - apps/linux/rust-toolchain.toml
    - apps/linux/rust-toolchain.toml/**
    - apps/linux/schema/**
    - apps/linux/src/**
    - cue.mod/**
    - flake.lock
    - flake.lock/**
    - flake.nix
    - flake.nix/**
    - server/Cargo.toml
    - server/Cargo.toml/**
    - server/crates/waddle-client-session/**
    - server/crates/waddle-xmpp-client-ffi/**
    - server/crates/waddle-xmpp-client/**
    - server/crates/waddle-xmpp-core/**
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  waddle-linux-pullRequest:
    permissions:
      contents: read
      checks: write
      pull-requests: write
      id-token: write
    name: waddle-linux-pullRequest
    runs-on: namespace-profile-linux-x86
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 2
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614
      with:
        extra-conf: accept-flake-config = true
    - name: Setup FlakeHub Cache
      uses: DeterminateSystems/flakehub-cache-action@e80fccc9c4e3a885ad51721c8b92ba3f839d2f6f
      with:
        use-gha-cache: disabled
    - name: Fetch Hestia
      run: |-
        set -euo pipefail
        hestia_platform="$(uname -s)-$(uname -m)"
        case "$hestia_platform" in
          Darwin-arm64|Darwin-aarch64)
            hestia_asset="hestia-aarch64-darwin"
            hestia_sha256="bb3da08432fb28436dd617359c3516d1c1373585311b88dc6fb50f8f6f40ffbe"
            ;;
          Linux-aarch64|Linux-arm64)
            hestia_asset="hestia-aarch64-linux"
            hestia_sha256="67c849c35a07b4562afccf4b0fb4b0f82ff6732cd8d4503c5f6d02b7e1e5637a"
            ;;
          Linux-x86_64|Linux-amd64)
            hestia_asset="hestia-x86_64-linux"
            hestia_sha256="f6c8fe84dc425e99e14f893ca708bba8254d587536e591471df1fc79beb5aed5"
            ;;
          *) echo "Unsupported Hestia platform: $hestia_platform" >&2; exit 1 ;;
        esac
        test -d "${RUNNER_TEMP:?RUNNER_TEMP is required}"
        hestia_dir="$RUNNER_TEMP/hestia-release"
        mkdir -p "$hestia_dir"
        hestia_binary="$hestia_dir/hestia"
        hestia_url="https://github.com/Mic92/hestia/releases/download/v2.0.0/${hestia_asset}"
        hestia_verified=false
        for hestia_attempt in 1 2 3 4 5; do
          rm -f "$hestia_binary"
          if curl --proto '=https' --proto-redir '=https' -fsSL --connect-timeout 20 --max-time 120 \
            --retry 3 --retry-all-errors -o "$hestia_binary" "$hestia_url"; then
            case "$hestia_platform" in
              Darwin-*) hestia_actual="$(shasum -a 256 "$hestia_binary" | cut -d ' ' -f 1)" ;;
              *) hestia_actual="$(sha256sum "$hestia_binary" | cut -d ' ' -f 1)" ;;
            esac
            if [ "$hestia_actual" = "$hestia_sha256" ]; then
              hestia_verified=true
              break
            fi
            echo "Hestia download digest $hestia_actual differs from the pinned $hestia_sha256" >&2
          fi
          echo "Hestia download attempt $hestia_attempt failed" >&2
          if [ "$hestia_attempt" -lt 5 ]; then sleep $((hestia_attempt * 10)); fi
        done
        if [ "$hestia_verified" != true ]; then
          echo "Could not download a verified Hestia v2.0.0 binary" >&2
          exit 1
        fi
        chmod 0755 "$hestia_binary"
    - name: Setup Hestia Nix Cache
      uses: Mic92/hestia@fb239a2f72d4b6e26eec5425f289dea23b27a527
      with:
        binary: ${{ runner.temp }}/hestia-release/hestia
        drain-timeout: '900'
        upstream-cache-filter: 'true'
    - name: Setup cuenv (release)
      run: |-
        set -euo pipefail
        cuenv_version="0.63.2"
        if [ "$cuenv_version" != "0.63.2" ]; then
          echo "Unsupported cuenv version: $cuenv_version; reviewed digests are required" >&2
          exit 1
        fi
        cuenv_platform="$(uname -s)-$(uname -m)"
        case "$cuenv_platform" in
          Darwin-arm64|Darwin-aarch64)
            cuenv_asset="cuenv-darwin-arm64"
            cuenv_sha256="8ffe172f09390308b90378f64723b07a2689761351c37affec308aa656e0aaba"
            ;;
          Linux-aarch64|Linux-arm64)
            cuenv_asset="cuenv-linux-arm64"
            cuenv_sha256="0c6dd349b14a11d3740b07aecef566150ddc808dd95fdcc127feaa58df605519"
            ;;
          Linux-x86_64|Linux-amd64)
            cuenv_asset="cuenv-linux-x64"
            cuenv_sha256="5f9a363851b6031972c09e55e177753a7474de073d98ede5ecf2a2a4133197fa"
            ;;
          *) echo "Unsupported cuenv platform: $cuenv_platform" >&2; exit 1 ;;
        esac
        if [[ ! "$cuenv_sha256" =~ ^[0-9a-f]{64}$ ]]; then
          echo "Missing or invalid cuenv SHA-256" >&2
          exit 1
        fi
        test -d "${RUNNER_TEMP:?RUNNER_TEMP is required}"
        : "${GITHUB_PATH:?GITHUB_PATH is required}"
        cuenv_download="$(mktemp "$RUNNER_TEMP/cuenv-download.XXXXXX")"
        trap 'rm -f "$cuenv_download"' EXIT
        cuenv_url="https://github.com/cuenv/cuenv/releases/download/${cuenv_version}/${cuenv_asset}"
        curl --proto '=https' --proto-redir '=https' -fsSL -o "$cuenv_download" "$cuenv_url"
        case "$cuenv_platform" in
          Darwin-*) printf '%s  %s\n' "$cuenv_sha256" "$cuenv_download" | shasum -a 256 -c - ;;
          Linux-*) printf '%s  %s\n' "$cuenv_sha256" "$cuenv_download" | sha256sum -c - ;;
        esac
        chmod 0755 "$cuenv_download"
        if [ "$("$cuenv_download" --version)" != "cuenv 0.63.2" ]; then
          echo "Downloaded cuenv version differs from the pinned release" >&2
          exit 1
        fi
        cuenv_bin="$(mktemp -d "$RUNNER_TEMP/waddle-cuenv.XXXXXX")"
        install -m 0755 "$cuenv_download" "$cuenv_bin/cuenv"
        printf '%s\n' "$cuenv_bin" >> "$GITHUB_PATH"
        "$cuenv_bin/cuenv" sync vcs -p .
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: 'Run pipeline: pullRequest'
      run: cuenv ci --pipeline pullRequest --path apps/linux
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
