name: waddle-android-pullRequest
on:
  pull_request:
    paths:
    - .github/workflows/waddle-android-pullrequest.yml
    - apps/android/**
    - server/Cargo.toml
    - server/Cargo.lock
    - server/crates/waddle-xmpp-client-ffi/**
    - server/crates/waddle-xmpp-client/**
    - server/crates/waddle-xmpp-core/**
    - server/rust-toolchain.toml
    - scripts/build-android-bindings.sh
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  build:
    name: build android debug + lint + test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 2

    - name: Setup JDK 25 (Temurin)
      uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b  # v4.6.0
      with:
        distribution: temurin
        java-version: '25'

    - name: Setup Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2
      with:
        cmdline-tools-version: 13114758
        packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
        accept-android-sdk-licenses: true

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b  # stable
      with:
        toolchain: stable
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - name: Cache cargo registry + target
      uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2.7.7
      with:
        workspaces: server -> target
        key: android-ffi

    - name: Cache cargo-ndk binary
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
      with:
        path: ~/.cargo/bin/cargo-ndk
        key: cargo-ndk-3.5-${{ runner.os }}

    - name: Install cargo-ndk
      run: |
        # Pin to 3.5.x; cargo-ndk 4.x has linker-flag regressions around
        # modern NDK sysroots (crtbegin_so.o lookup fails). 3.5.4 has the
        # right flag handling and uses lowercase `-p` for the API level.
        if ! command -v cargo-ndk >/dev/null 2>&1; then
          cargo install cargo-ndk --locked --version ^3.5
        fi

    - name: Build FFI artefacts (.so + Kotlin bindings)
      env:
        # Build the .so against API 35 even though the app's minSdk is 36 —
        # the NDK 28.2 API 36 sysroot is missing crtbegin_so.o / liblog.so
        # (cargo-ndk issue #200 against the same combination). Android lib
        # ABI is forward-compatible: a lib built for API 35 runs fine on 36.
        ANDROID_API_LEVEL: '35'
      run: |
        # Pin to NDK r28.2 — it's pre-installed on ubuntu-latest, stable
        # (unlike r29 preview), and supplies the API 35 sysroot.
        export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358"
        echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
        test -d "${ANDROID_NDK_HOME}" || {
          echo "NDK 28.2.13676358 not found on runner; falling back to ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME}"
        }
        bash scripts/build-android-bindings.sh

    - name: Setup Gradle
      # Handles the dependency cache, build cache, and configuration cache
      # in one step (replaces a hand-rolled actions/cache for ~/.gradle).
      # Read-only on PRs so forks don't poison the shared cache.
      uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947  # v4
      with:
        cache-read-only: true
        build-scan-publish: false
        gradle-home-cache-cleanup: true
        add-job-summary: on-failure

    - name: ktlintCheck + lintDebug + tests + assembleDebug
      # One Gradle invocation: a single daemon, single task graph, full
      # incremental + build-cache + config-cache replay.
      working-directory: apps/android
      run: ./gradlew ktlintCheck :app:lintDebug testDebugUnitTest :app:assembleDebug --build-cache

    - name: Upload debug APK
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
      with:
        name: app-debug.apk
        path: apps/android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 14
