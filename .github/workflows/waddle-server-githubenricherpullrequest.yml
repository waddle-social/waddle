name: waddle-server-githubEnricherPullRequest
on:
  pull_request:
    paths:
    - .github/workflows/waddle-server-githubenricherpullrequest.yml
    - cue.mod/**
    - server/Cargo.lock
    - server/env.cue
    - server/extensions/github-enricher/**
    - server/schema/**
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write
  id-token: write
jobs:
  waddle-server-githubEnricherPullRequest:
    name: waddle-server-githubEnricherPullRequest
    runs-on: namespace-profile-linux-x86
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Set up Namespace Nix cache
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
    - name: Remove cached Determinate Nix receipt
      run: sudo rm -f /nix/receipt.json /nix/receipt.tmp /nix/nix-installer /nix/uninstall-phase1.json /nix/uninstall-phase2.json /nix/var/nix/daemon-socket/socket
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@92ffb5400c3776307a27a1727d7e2ac3dcd9f844
      with:
        extra-conf: accept-flake-config = true
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        curl -sSL -o /usr/local/bin/cuenv "https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: 'Run pipeline: githubEnricherPullRequest'
      run: cuenv ci --pipeline githubEnricherPullRequest --path server
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
