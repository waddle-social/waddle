# Generated by cuenv - do not edit manually
# Regenerate with: cuenv sync ci

name: waddle-cloud-pullRequest
on:
  pull_request:
    paths:
    - .github/workflows/waddle-cloud-pullrequest.yml
    - cue.mod/**
    - infrastructure/waddle.cloud/dashboards/**
    - infrastructure/waddle.cloud/env.cue
    - infrastructure/waddle.cloud/env.cue/**
    - infrastructure/waddle.cloud/rules/**
    - infrastructure/waddle.cloud/schema/**
    - infrastructure/waddle.cloud/scripts/validate-dashboards.sh
    - infrastructure/waddle.cloud/scripts/validate-dashboards.sh/**
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  waddle-cloud-pullRequest:
    name: waddle-cloud-pullRequest
    runs-on: namespace-profile-linux-x86
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Cache /nix on Namespace volume
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
    - name: Hand /nix to the runner user
      run: sudo chown -R runner /nix
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: accept-flake-config = true
    - name: Build cuenv (nix)
      run: |-
        . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
        nix build .#cuenv -L --accept-flake-config
        echo "$(pwd)/result/bin" >> "$GITHUB_PATH" 2>/dev/null || echo "$(pwd)/result/bin" >> "$BUILDKITE_ENV_FILE" 2>/dev/null || true
        ./result/bin/cuenv sync ci
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: 'Run pipeline: pullRequest'
      run: cuenv ci --pipeline pullRequest --path infrastructure/waddle.cloud
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
