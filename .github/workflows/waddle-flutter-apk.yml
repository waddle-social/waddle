# Standalone client lane; the Kotlin Android pipelines remain unchanged.
# Its inclusion in waddle-integration.yml is generated by integration-ci.ts.
name: waddle-flutter-apk

on:
  pull_request:
    paths:
      - .cargo/**
      - .github/workflows/waddle-flutter-apk.yml
      - apps/flutter/**
      - flake.nix
      - flake.lock
      - scripts/build-flutter-*.sh
      - scripts/setup-flutter-*.sh
      - scripts/flutter-*
      - server/.cargo/**
      - server/Cargo.toml
      - server/Cargo.lock
      - server/rust-toolchain.toml
      - server/crates/waddle-flutter-runtime/**
      - server/crates/waddle-flutter-timeline/**
      - server/crates/waddle-client-session/**
      - server/crates/waddle-xmpp-client*/**
      - server/crates/waddle-xmpp-core/**
      - server/vendor/**
  workflow_dispatch:
    inputs:
      native_base_sha:
        description: Commit against which the unchanged Kotlin app is checked
        required: false
        default: 12fd7aa01dbef427c383fd16fed00b83badbb84f
        type: string

permissions:
  contents: read

concurrency:
  group: flutter-apk-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Independent Flutter Android and web
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: ${{ runner.temp }}/waddle-flutter-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/waddle-flutter-sdk
      CARGO_BUILD_JOBS: 2
      WADDLE_NATIVE_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.native_base_sha || '12fd7aa01dbef427c383fd16fed00b83badbb84f' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Verify standalone boundary and CI contracts
        run: |
          bash scripts/flutter-boundary-check.sh
          bun test scripts/flutter-ci.test.ts
          bun scripts/integration-ci.ts --check
      - id: nix
        name: Install pinned Nix environment
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614
        with:
          extra-conf: accept-flake-config = true
      - name: Setup Hestia Nix Cache
        uses: Mic92/hestia@fb239a2f72d4b6e26eec5425f289dea23b27a527
        with:
          drain-timeout: '900'
          upstream-cache-filter: 'true'
          version: v2.0.0
      - id: tools
        name: Verify pinned Flutter and Rust toolchains
        run: |
          nix develop . --command flutter --version
          nix develop . --command rustc --version
          nix develop . --command wasm-pack --version
          nix develop . --command cmake --version
          nix develop . --command ninja --version
      - id: sdk
        name: Provision standalone Android SDK
        run: nix develop . --command bash scripts/setup-flutter-android.sh
      - id: pub
        name: Resolve locked Flutter dependencies
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        working-directory: apps/flutter
        run: nix develop ../.. --command flutter pub get --enforce-lockfile
      - id: rust
        name: Rust formatting, warnings and unit tests
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: nix develop . --command bash scripts/flutter-ci.sh rust
      - id: host
        name: Build direct Rust host library
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: nix develop . --command bash scripts/build-flutter-rust.sh --host
      - id: analyze
        name: Flutter formatting and analysis
        if: ${{ !cancelled() && steps.pub.outcome == 'success' }}
        run: nix develop . --command bash scripts/flutter-ci.sh analyze
      - id: tests
        name: Flutter tests and rendered design evidence
        if: ${{ !cancelled() && steps.pub.outcome == 'success' && steps.host.outcome == 'success' }}
        run: nix develop . --command bash scripts/flutter-ci.sh test
      # Keep artifact production independent of lint/test outcomes, while those
      # failed steps still make the job (and aggregate integration lane) fail.
      - id: native
        name: Build direct Rust Android libraries for both ABIs
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.pub.outcome == 'success' }}
        run: nix develop . --command bash scripts/build-flutter-rust.sh --android
      - id: apk
        name: Build independent Flutter debug APK
        if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.pub.outcome == 'success' }}
        run: nix develop . --command bash scripts/flutter-ci.sh apk
      - id: wasm
        name: Build Rust browser JS and WASM together
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: nix develop . --command bash scripts/build-flutter-rust.sh --web
      - id: web
        name: Build standalone Flutter web app
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' && steps.pub.outcome == 'success' }}
        run: nix develop . --command bash scripts/flutter-ci.sh web
      - id: browser
        name: Exercise actual Rust WASM in Chromium and verify browser contracts
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        run: |
          nix develop . --command env WADDLE_REQUIRE_WASM_ARTIFACT=1 WADDLE_REQUIRE_BROWSER_CONTRACT=1 bun test ./apps/flutter/test/transport/wasm_loader_test.cjs ./apps/flutter/test/transport/wasm_artifact_test.cjs ./apps/flutter/test/transport/wasm_browser_test.cjs
      - id: smoke
        name: Launch the production Flutter app and Rust ABI on Android
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          nix develop . --command bash scripts/flutter-device-smoke.sh
      - id: apk_artifact
        name: Upload standalone Flutter APK
        if: ${{ always() && hashFiles('apps/flutter/build/artifacts/waddle-flutter.apk') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: waddle-flutter-apk
          path: apps/flutter/build/artifacts/waddle-flutter.apk
          if-no-files-found: error
          retention-days: 7
      - id: preview_artifact
        name: Upload rendered Flutter previews
        if: ${{ always() && hashFiles('apps/flutter/build/design-previews/*.png') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: waddle-flutter-previews
          path: apps/flutter/build/design-previews/
          if-no-files-found: error
          retention-days: 7
      - id: web_artifact
        name: Upload standalone Flutter web build
        if: ${{ always() && steps.web.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: waddle-flutter-web
          path: apps/flutter/build/web/
          if-no-files-found: error
          retention-days: 7
      - id: smoke_artifact
        name: Upload Android device smoke evidence
        if: ${{ always() && hashFiles('apps/flutter/build/device-smoke/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: waddle-flutter-device-smoke
          path: apps/flutter/build/device-smoke/
          if-no-files-found: error
          retention-days: 7
      - name: Link standalone downloads in run summary
        if: ${{ always() }}
        env:
          FLUTTER_APK_URL: ${{ steps.apk_artifact.outputs.artifact-url }}
          FLUTTER_PREVIEWS_URL: ${{ steps.preview_artifact.outputs.artifact-url }}
          FLUTTER_WEB_URL: ${{ steps.web_artifact.outputs.artifact-url }}
        run: bash scripts/flutter-artifact-summary.sh
