name: Isolated CI bootstrap canary
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  integration_canary_2047:
    name: integration-canary-2047
    runs-on: ubuntu-latest
    steps:
      - name: Fail only on the merge-group candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = merge_group ]; then
            exit 1
          fi
