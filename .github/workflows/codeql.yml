name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: server/target
          key: codeql-xcframework-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: codeql-xcframework-

      - name: Build XCFramework
        run: ./scripts/build-xcframework.sh --debug

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd apps/apple && xcodegen generate

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [actions, go, javascript-typescript, rust]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
