# Generated by cuenv - do not edit manually
# Regenerate with: cuenv sync ci

name: waddle-website-pullRequest
on:
  pull_request:
    paths:
    - .github/workflows/waddle-website-pullrequest.yml
    - bun.lock
    - bun.lock/**
    - cue.mod/**
    - package.json
    - package.json/**
    - website/astro.config.ts
    - website/astro.config.ts/**
    - website/env.cue
    - website/package.json
    - website/package.json/**
    - website/public/**
    - website/schema/**
    - website/src/**
    - website/tsconfig.json
    - website/tsconfig.json/**
    - website/worker-configuration.d.ts
    - website/worker-configuration.d.ts/**
    - website/wrangler.jsonc
    - website/wrangler.jsonc/**
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write
  id-token: write
jobs:
  waddle-website-pullRequest:
    name: waddle-website-pullRequest
    runs-on: namespace-profile-linux-x86
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Cache /nix on Namespace volume
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
    - name: Hand /nix to the runner user
      run: sudo chown -R runner /nix
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: accept-flake-config = true
    - name: Build cuenv (nix)
      run: |-
        . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
        nix build .#cuenv -L --accept-flake-config
        echo "$(pwd)/result/bin" >> "$GITHUB_PATH" 2>/dev/null || echo "$(pwd)/result/bin" >> "$BUILDKITE_ENV_FILE" 2>/dev/null || true
        ./result/bin/cuenv sync ci
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: cuenv:contributor:bun.workspace.setup
      run: 'true'
    - name: Install Bun dependencies
      run: cuenv exec -- bun install --frozen-lockfile
    - name: 'Run pipeline: pullRequest'
      run: cuenv ci --pipeline pullRequest --path website
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
