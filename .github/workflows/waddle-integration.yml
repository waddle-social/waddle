  waddle_apple_pullrequest__apple-xmpp-client:
    name: waddle-apple-pullrequest / apple-xmpp-client
    runs-on: namespace-profile-darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        working-directory: server
        run: rustup toolchain install
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Check native telemetry contract
        run: bash scripts/check-native-remote-telemetry.sh --apple
      - name: Test WaddleKit
        working-directory: apps/apple/WaddleKit
        run: swift test
      - name: Build XMPP client XCFramework
        run: bash scripts/build-xcframework.sh --debug
      - name: Build macOS app
        run: "xcodebuild -project apps/apple/Waddle.xcodeproj -scheme Waddle-macOS -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build"
      - name: Build iOS app
        run: "xcodebuild -project apps/apple/Waddle.xcodeproj -scheme Waddle-iOS -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build"
    needs:
      - plan
    if: "${{ (success()) && needs.plan.result == 'success' && needs.plan.outputs.waddle_apple_pullrequest == 'true' }}"
    permissions:
      contents: read
