  waddle_server_xmppservercompliance__nixxmppservertests:
    permissions:
      contents: read
    name: waddle-server-xmppServerCompliance / nixXmppServerTests
    runs-on: namespace-profile-linux-x86
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: "${{ github.sha }}"
          persist-credentials: false
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614
        with:
          extra-conf: accept-flake-config = true
      - name: Setup Hestia Nix Cache
        uses: Mic92/hestia@fb239a2f72d4b6e26eec5425f289dea23b27a527
        with:
          drain-timeout: "900"
          upstream-cache-filter: "true"
          version: v2.0.0
      - name: nixXmppServerTests
        run: "nix build --print-build-logs ../#checks.x86_64-linux.waddle-server-xmpp-server-tests"
