# Generated from existing PR workflow graphs; do not edit manually.
# Regenerate with: bun scripts/integration-ci.ts sync

name: waddle-integration
"on":
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full ancestor SHA to compare with the selected workflow ref
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: "integration-${{ github.event_name }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true
jobs:
  plan:
    name: Plan exact candidate verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      expected: "${{ steps.plan.outputs.expected }}"
      base: "${{ steps.plan.outputs.base }}"
      waddle_android_pullrequest: "${{ steps.plan.outputs.waddle_android_pullrequest }}"
      waddle_apple_pullrequest: "${{ steps.plan.outputs.waddle_apple_pullrequest }}"
      waddle_chat_pullrequest: "${{ steps.plan.outputs.waddle_chat_pullrequest }}"
      waddle_cloud_pullrequest: "${{ steps.plan.outputs.waddle_cloud_pullrequest }}"
      waddle_colony_pullrequest: "${{ steps.plan.outputs.waddle_colony_pullrequest }}"
      waddle_design_pullrequest: "${{ steps.plan.outputs.waddle_design_pullrequest }}"
      waddle_linux_pullrequest: "${{ steps.plan.outputs.waddle_linux_pullrequest }}"
      waddle_operator_pullrequest: "${{ steps.plan.outputs.waddle_operator_pullrequest }}"
      waddle_server_authzidcodec: "${{ steps.plan.outputs.waddle_server_authzidcodec }}"
      waddle_server_federationgrantfencepullrequest: "${{ steps.plan.outputs.waddle_server_federationgrantfencepullrequest }}"
      waddle_server_namespacerustchecks: "${{ steps.plan.outputs.waddle_server_namespacerustchecks }}"
      waddle_server_pullrequest: "${{ steps.plan.outputs.waddle_server_pullrequest }}"
      waddle_server_rootsync: "${{ steps.plan.outputs.waddle_server_rootsync }}"
      waddle_server_streammanagementverification: "${{ steps.plan.outputs.waddle_server_streammanagementverification }}"
      waddle_server_xmppcompliance: "${{ steps.plan.outputs.waddle_server_xmppcompliance }}"
      waddle_website_pullrequest: "${{ steps.plan.outputs.waddle_website_pullrequest }}"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Check graph parity and planner contracts
        run: "bun scripts/integration-ci.ts --check\nbun test scripts/integration-ci.test.ts\npython3 scripts/test_integration_ci_project.py\npython3 scripts/test_cuenv_bootstrap.py"
      - id: plan
        name: Select every applicable lane
        run: bun scripts/integration-ci.ts plan
  waddle_android_pullrequest__waddle-android-pullrequest:
    permissions:
      contents: read
    name: waddle-android-pullRequest / waddle-android-pullRequest
    runs-on: namespace-profile-linux-x86
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: "${{ github.sha }}"
          persist-credentials: false
      - name: Cache Android SDK and Gradle on Namespace volume
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9
        with:
          path: "/home/runner/.android-sdk\n/home/runner/.gradle"
      - name: Bound CUE evaluator memory
        run: "# GITHUB_ENV applies to subsequent steps, including cuenv startup.\nprintf '%s\\n' 'GOGC=100' >> \"$GITHUB_ENV\""
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614
        with:
          extra-conf: accept-flake-config = true
      - name: Setup Hestia Nix Cache
        uses: Mic92/hestia@fb239a2f72d4b6e26eec5425f289dea23b27a527
        with:
          drain-timeout: "900"
          upstream-cache-filter: "true"
          version: v2.0.0
      - name: Setup Namespace Bazel Remote Cache
        run: "set -euo pipefail\n: \"${GITHUB_ENV:?GITHUB_ENV is required}\"\n: \"${RUNNER_TEMP:?RUNNER_TEMP is required}\"\nif [ \"$(uname -s)\" != \"Linux\" ]; then\n  printf 'CUENV_REMOTE_CACHE=\\nCUENV_REMOTE_CACHE_UPLOAD=false\\n' >> \"$GITHUB_ENV\"\n  exit 0\nfi\npython3 - \"$GITHUB_ENV\" <<'PY'\nimport json, os, re, shutil, subprocess, sys\nfrom pathlib import Path\n\ngithub_env = Path(sys.argv[1])\ntrusted = (\n    os.environ.get(\"GITHUB_EVENT_NAME\") == \"push\"\n    and os.environ.get(\"GITHUB_REF\") == \"refs/heads/main\"\n)\nrunner_temp = os.environ[\"RUNNER_TEMP\"]\nvalues = {\n    \"CUENV_REMOTE_CACHE_UPLOAD\": \"true\" if trusted else \"false\",\n    \"CUENV_CACHE_DIR\": os.path.join(\n        runner_temp, \"cuenv-cache\", \"trusted\" if trusted else \"untrusted\"\n    ),\n}\n\ndef normalize_endpoint(endpoint: str) -> str:\n    if endpoint.startswith(\"grpcs://\"):\n        return \"https://\" + endpoint[len(\"grpcs://\"):]\n    if endpoint.startswith(\"grpc://\"):\n        return \"http://\" + endpoint[len(\"grpc://\"):]\n    return endpoint\n\ndef parse_bazelrc(path: Path) -> bool:\n    text = path.read_text(encoding=\"utf-8\", errors=\"replace\")\n    endpoint = \"\"\n    parsed = {}\n    for raw_line in text.splitlines():\n        line = raw_line.split(\"#\", 1)[0].strip()\n        if not line:\n            continue\n        if m := re.search(r\"--remote_cache=(\\S+)\", line):\n            endpoint = m.group(1)\n        if m := re.search(r\"--tls_certificate=(\\S+)\", line):\n            parsed[\"CUENV_REMOTE_CACHE_CA_CERT\"] = m.group(1)\n        if m := re.search(r\"--tls_client_certificate=(\\S+)\", line):\n            parsed[\"CUENV_REMOTE_CACHE_CLIENT_CERT\"] = m.group(1)\n        if m := re.search(r\"--tls_client_key=(\\S+)\", line):\n            parsed[\"CUENV_REMOTE_CACHE_CLIENT_KEY\"] = m.group(1)\n        if m := re.search(r\"--credential_helper=[^=\\s]+=(\\S+)\", line):\n            parsed[\"CUENV_REMOTE_CACHE_CREDENTIAL_HELPER\"] = m.group(1)\n    if not endpoint:\n        return False\n    values[\"CUENV_REMOTE_CACHE\"] = normalize_endpoint(endpoint)\n    values[\"CUENV_REMOTE_CACHE_PROTOCOL\"] = \"grpc\"\n    values.update(parsed)\n    return True\n\nconfigured = False\nfor candidate in (os.environ.get(\"BAZELRC\", \"\"), \"/etc/bazel.bazelrc\"):\n    if candidate:\n        p = Path(candidate)\n        if p.is_file():\n            configured = parse_bazelrc(p)\n            if configured:\n                break\n\nif not configured and shutil.which(\"nsc\"):\n    try:\n        proc = subprocess.run(\n            [\"nsc\", \"cache\", \"bazel\", \"setup\", \"--disable_build_events\", \"-o\", \"json\"],\n            capture_output=True,\n            text=True,\n            timeout=20,\n            check=True,\n        )\n        data = json.loads(proc.stdout)\n        endpoint = (data.get(\"endpoint\") or \"\").strip()\n        if endpoint:\n            values[\"CUENV_REMOTE_CACHE\"] = normalize_endpoint(endpoint)\n            values[\"CUENV_REMOTE_CACHE_PROTOCOL\"] = \"grpc\"\n            if data.get(\"server_ca_cert\"):\n                values[\"CUENV_REMOTE_CACHE_CA_CERT\"] = data[\"server_ca_cert\"]\n            if data.get(\"client_cert\") and data.get(\"client_key\"):\n                values[\"CUENV_REMOTE_CACHE_CLIENT_CERT\"] = data[\"client_cert\"]\n                values[\"CUENV_REMOTE_CACHE_CLIENT_KEY\"] = data[\"client_key\"]\n            if data.get(\"credential_helper_domains\"):\n                helper = shutil.which(\"bazel-credential-nsc\")\n                if helper:\n                    values[\"CUENV_REMOTE_CACHE_CREDENTIAL_HELPER\"] = helper\n            configured = True\n    except Exception:\n        pass\n\nif not configured:\n    values[\"CUENV_REMOTE_CACHE\"] = \"\"\n\nwith github_env.open(\"a\", encoding=\"utf-8\") as handle:\n    for k, v in values.items():\n        if \"\\n\" in v or \"\\r\" in v:\n            raise SystemExit(f\"Invalid newline in {k}\")\n        handle.write(f\"{k}={v}\\n\")\nPY"
      - name: Setup cuenv (release)
        run: "set -euo pipefail\ncuenv_version=\"0.77.0\"\nif [ \"$cuenv_version\" != \"0.77.0\" ]; then\n  echo \"Unsupported cuenv version: $cuenv_version; reviewed digests are required\" >&2\n  exit 1\nfi\ncuenv_platform=\"$(uname -s)-$(uname -m)\"\ncase \"$cuenv_platform\" in\n  Darwin-arm64|Darwin-aarch64)\n    cuenv_asset=\"cuenv-darwin-arm64\"\n    cuenv_sha256=\"bdb3413abdea0c5617ed5a9ec3c10c5813dd6a3b8233305e81c53d76d5236647\"\n    ;;\n  Linux-aarch64|Linux-arm64)\n    cuenv_asset=\"cuenv-linux-arm64\"\n    cuenv_sha256=\"fde68bff3e2adc383d25bc64530b0c72b53fab32181da97af99dbed52e7a6814\"\n    ;;\n  Linux-x86_64|Linux-amd64)\n    cuenv_asset=\"cuenv-linux-x64\"\n    cuenv_sha256=\"d7a35a14778316c65ff725bd3c1bd776ea1610b09f02cc20badc588110899085\"\n    ;;\n  *) echo \"Unsupported cuenv platform: $cuenv_platform\" >&2; exit 1 ;;\nesac\nif [[ ! \"$cuenv_sha256\" =~ ^[0-9a-f]{64}$ ]]; then\n  echo \"Missing or invalid cuenv SHA-256\" >&2\n  exit 1\nfi\ntest -d \"${RUNNER_TEMP:?RUNNER_TEMP is required}\"\n: \"${GITHUB_PATH:?GITHUB_PATH is required}\"\ncuenv_download=\"$(mktemp \"$RUNNER_TEMP/cuenv-download.XXXXXX\")\"\ntrap 'rm -f \"$cuenv_download\"' EXIT\ncuenv_url=\"https://github.com/cuenv/cuenv/releases/download/${cuenv_version}/${cuenv_asset}\"\ncurl --proto '=https' --proto-redir '=https' -fsSL -o \"$cuenv_download\" \"$cuenv_url\"\ncase \"$cuenv_platform\" in\n  Darwin-*) printf '%s  %s\\n' \"$cuenv_sha256\" \"$cuenv_download\" | shasum -a 256 -c - ;;\n  Linux-*) printf '%s  %s\\n' \"$cuenv_sha256\" \"$cuenv_download\" | sha256sum -c - ;;\n  *) echo \"Unsupported cuenv platform: $cuenv_platform\" >&2; exit 1 ;;\nesac\nchmod 0755 \"$cuenv_download\"\nif [ \"$(\"$cuenv_download\" --version)\" != \"cuenv 0.77.0\" ]; then\n  echo \"Downloaded cuenv version differs from the pinned release\" >&2\n  exit 1\nfi\ncuenv_bin=\"$(mktemp -d \"$RUNNER_TEMP/waddle-cuenv.XXXXXX\")\"\ninstall -m 0755 \"$cuenv_download\" \"$cuenv_bin/cuenv\"\nprintf '%s\\n' \"$cuenv_bin\" >> \"$GITHUB_PATH\"\n\"$cuenv_bin/cuenv\" sync vcs -p ."
      - name: Check Namespace Bazel Remote Cache
        run: "set -euo pipefail\nif [ -z \"${CUENV_REMOTE_CACHE:-}\" ]; then\n  echo \"Namespace Bazel remote cache not configured on this runner; using local cache only.\"\n  exit 0\nfi\ncuenv cache status || true"
      - name: "Run pipeline: pullRequest"
        run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$WADDLE_CI_HEAD_SHA\"\ngit cat-file -e \"${WADDLE_CI_BASE_SHA}^{commit}\"\ngit merge-base --is-ancestor \"$WADDLE_CI_BASE_SHA\" \"$WADDLE_CI_HEAD_SHA\"\ngit -c diff.renames=false diff --no-renames --name-only -z \"$WADDLE_CI_BASE_SHA...$WADDLE_CI_HEAD_SHA\" > /dev/null\nWADDLE_TEST_ALL_CUENV=1 python3 scripts/test_integration_ci_project.py\npython3 scripts/integration-ci-project.py --path apps/android --pipeline pullRequest --run"
        env:
          GITHUB_ACTOR: "${{ github.actor }}"
          GITHUB_REF_TYPE: "${{ github.ref_type }}"
          GITHUB_REF_NAME: "${{ github.ref_name }}"
          WADDLE_CI_BASE_SHA: "${{ needs.plan.outputs.base }}"
          WADDLE_CI_HEAD_SHA: "${{ github.sha }}"
      - name: Upload Android test failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: ignore
          name: waddle_android_pullrequest-android-test-failure-reports
          path: "apps/android/app/build/outputs/roborazzi/\napps/android/app/build/reports/roborazzi/\napps/android/app/build/test-results/\napps/android/app/build/reports/tests/"
          retention-days: 3
    needs:
      - plan
    if: "${{ (success()) && needs.plan.result == 'success' && needs.plan.outputs.waddle_android_pullrequest == 'true' }}"
  waddle_apple_pullrequest__apple-xmpp-client:
    name: waddle-apple-pullrequest / apple-xmpp-client
    runs-on: namespace-profile-darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        working-directory: server
        run: rustup toolchain install
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Check native telemetry contract
        run: bash scripts/check-native-remote-telemetry.sh --apple
      - name: Test WaddleKit
        working-directory: apps/apple/WaddleKit
        run: swift test
      - name: Build XMPP client XCFramework
        run: bash scripts/build-xcframework.sh --debug
      - name: Build and test macOS app
        run: "xcodebuild -project apps/apple/Waddle.xcodeproj -scheme Waddle-macOS -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test"
      - name: Build and test iOS app
        run: "device=\"$(python3 apps/apple/scripts/newest-iphone-simulator.py)\"\nxcodebuild -project apps/apple/Waddle.xcodeproj -scheme Waddle-iOS -destination \"platform=iOS Simulator,id=${device}\" CODE_SIGNING_ALLOWED=NO test\n"
    needs:
      - plan
    if: "${{ (success()) && needs.plan.result == 'success' && needs.plan.outputs.waddle_apple_pullrequest == 'true' }}"
    permissions:
      contents: read
  waddle_chat_pullrequest__waddle-chat-pullrequest:
