# Generated from existing PR workflow graphs; do not edit manually.
# Regenerate with: bun scripts/integration-ci.ts sync

name: waddle-integration
"on":
  pull_request:
    {}
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full ancestor SHA to compare with the selected workflow ref
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: "integration-${{ github.event_name }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true
jobs:
  plan:
    name: Plan exact candidate verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      expected: "${{ steps.plan.outputs.expected }}"
      base: "${{ steps.plan.outputs.base }}"
      waddle_android_devicetests: "${{ steps.plan.outputs.waddle_android_devicetests }}"
      waddle_android_pullrequest: "${{ steps.plan.outputs.waddle_android_pullrequest }}"
      waddle_apple_pullrequest: "${{ steps.plan.outputs.waddle_apple_pullrequest }}"
      waddle_chat_pullrequest: "${{ steps.plan.outputs.waddle_chat_pullrequest }}"
      waddle_cloud_pullrequest: "${{ steps.plan.outputs.waddle_cloud_pullrequest }}"
      waddle_colony_pullrequest: "${{ steps.plan.outputs.waddle_colony_pullrequest }}"
      waddle_linux_pullrequest: "${{ steps.plan.outputs.waddle_linux_pullrequest }}"
      waddle_server_federationgrantfence: "${{ steps.plan.outputs.waddle_server_federationgrantfence }}"
      waddle_server_namespacerustchecks: "${{ steps.plan.outputs.waddle_server_namespacerustchecks }}"
      waddle_server_pullrequest: "${{ steps.plan.outputs.waddle_server_pullrequest }}"
      waddle_server_rootsync: "${{ steps.plan.outputs.waddle_server_rootsync }}"
      waddle_server_rusttests: "${{ steps.plan.outputs.waddle_server_rusttests }}"
      waddle_server_xmppcompliance: "${{ steps.plan.outputs.waddle_server_xmppcompliance }}"
      waddle_server_xmppservercompliance: "${{ steps.plan.outputs.waddle_server_xmppservercompliance }}"
      waddle_website_pullrequest: "${{ steps.plan.outputs.waddle_website_pullrequest }}"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Check graph parity and planner contracts
        run: "bun scripts/integration-ci.ts --check\nbun test scripts/integration-ci.test.ts\npython3 scripts/test_integration_ci_project.py"
      - id: plan
        name: Select every applicable lane
        run: bun scripts/integration-ci.ts plan
  waddle_android_devicetests__waddle-android-devicetests:
    permissions:
      contents: read
    name: waddle-android-deviceTests / waddle-android-deviceTests
    runs-on: namespace-profile-linux-x86
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.sha }}"
          persist-credentials: false
      - name: Cache Android SDK and Gradle on Namespace volume
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9
        with:
          path: "/home/runner/.android-sdk\n/home/runner/.gradle"
      - name: Bound CUE evaluator memory
        run: "# GITHUB_ENV applies to subsequent steps, including cuenv startup.\nprintf '%s\\n' 'GOGC=100' >> \"$GITHUB_ENV\""
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614
        with:
          extra-conf: accept-flake-config = true
      - name: Setup Hestia Nix Cache
        uses: Mic92/hestia@fb239a2f72d4b6e26eec5425f289dea23b27a527
        with:
          drain-timeout: "900"
          upstream-cache-filter: "true"
          version: v2.0.0
      - name: Setup cuenv (release)
        run: "arch=\"$(uname -m)\"\ncase \"$arch\" in\n  x86_64|amd64) cuenv_asset=\"cuenv-linux-x64\" ;;\n  aarch64|arm64) cuenv_asset=\"cuenv-linux-arm64\" ;;\n  *) echo \"Unsupported Linux architecture: $arch\" >&2; exit 1 ;;\nesac\ncuenv_version=\"0.57.3\"\nif [ -z \"$cuenv_version\" ]; then\n  cuenv_version=\"latest\"\nfi\nif [ \"$cuenv_version\" = \"latest\" ]; then\n  cuenv_url=\"https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}\"\nelse\n  cuenv_url=\"https://github.com/cuenv/cuenv/releases/download/${cuenv_version}/${cuenv_asset}\"\nfi\ncurl --proto '=https' --proto-redir '=https' -fsSL -o /usr/local/bin/cuenv \"$cuenv_url\" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync vcs -p ."
      - name: "Run pipeline: deviceTests"
        run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$WADDLE_CI_HEAD_SHA\"\ngit cat-file -e \"${WADDLE_CI_BASE_SHA}^{commit}\"\ngit merge-base --is-ancestor \"$WADDLE_CI_BASE_SHA\" \"$WADDLE_CI_HEAD_SHA\"\ngit -c diff.renames=false diff --no-renames --name-only -z \"$WADDLE_CI_BASE_SHA...$WADDLE_CI_HEAD_SHA\" > /dev/null\nWADDLE_TEST_PINNED_CUENV=1 python3 scripts/test_integration_ci_project.py\npython3 scripts/integration-ci-project.py --path apps/android --pipeline deviceTests\nenv -u GITHUB_ACTIONS -u BUILDKITE GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=diff.renames GIT_CONFIG_VALUE_0=false cuenv ci --pipeline deviceTests --path apps/android --from \"$WADDLE_CI_BASE_SHA\""
        env:
          GITHUB_ACTOR: "${{ github.actor }}"
          GITHUB_REF_TYPE: "${{ github.ref_type }}"
          GITHUB_REF_NAME: "${{ github.ref_name }}"
          WADDLE_CI_BASE_SHA: "${{ needs.plan.outputs.base }}"
          WADDLE_CI_HEAD_SHA: "${{ github.sha }}"
      - name: Upload Android test failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: ignore
          name: waddle_android_devicetests-android-test-failure-reports
          path: "apps/android/app/build/outputs/roborazzi/\napps/android/app/build/reports/roborazzi/\napps/android/app/build/test-results/\napps/android/app/build/reports/tests/"
          retention-days: 3
    needs:
      - plan
    if: "${{ (success()) && needs.plan.result == 'success' && needs.plan.outputs.waddle_android_devicetests == 'true' }}"
