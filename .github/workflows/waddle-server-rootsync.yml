# Generated by cuenv - do not edit manually
# Regenerate with: cuenv sync ci

name: waddle-server-rootSync
on:
  push:
    branches:
    - main
    paths:
    - .github/workflows/waddle-server-rootsync.yml
    - .gitignore
    - .gitignore/**
    - .rules.cue
    - .rules.cue/**
    - cue.mod/**
    - cuenv.lock
    - cuenv.lock/**
    - env.cue
    - env.cue/**
    - server/env.cue
    - server/schema/**
  pull_request:
    branches:
    - main
    paths:
    - .github/workflows/waddle-server-rootsync.yml
    - .gitignore
    - .gitignore/**
    - .rules.cue
    - .rules.cue/**
    - cue.mod/**
    - cuenv.lock
    - cuenv.lock/**
    - env.cue
    - env.cue/**
    - server/env.cue
    - server/schema/**
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: none
  packages: read
  id-token: write
jobs:
  checkRootSyncDrift:
    name: checkRootSyncDrift
    runs-on: namespace-profile-linux-x86
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb
      with:
        extra-conf: accept-flake-config = true
    - name: Setup Hestia Nix Cache
      uses: Mic92/hestia@fb239a2f72d4b6e26eec5425f289dea23b27a527
      with:
        drain-timeout: '900'
        upstream-cache-filter: 'true'
        version: v2.0.0
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        cuenv_version="0.55.0"
        if [ -z "$cuenv_version" ]; then
          cuenv_version="latest"
        fi
        if [ "$cuenv_version" = "latest" ]; then
          cuenv_url="https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}"
        else
          cuenv_url="https://github.com/cuenv/cuenv/releases/download/${cuenv_version}/${cuenv_asset}"
        fi
        curl -fsSL -o /usr/local/bin/cuenv "$cuenv_url" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: checkRootSyncDrift
      run: cuenv task checkRootSyncDrift --skip-dependencies
      working-directory: server
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
