name: waddle-server-default
on:
  push:
    branches:
    - main
    paths:
    - .github/workflows/waddle-server-default.yml
    - cue.mod/**
    - server/../flake.lock
    - server/../flake.nix
    - server/Cargo.lock
    - server/Cargo.toml
    - server/charts/**
    - server/crates/**
    - server/env.cue
    - server/rust-toolchain.toml
    - server/schema/**
    - server/scripts/check-nix-cache-keys.sh
    - server/wit/**
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write
  id-token: write
jobs:
  nixBuildServer:
    name: nixBuildServer
    runs-on: namespace-profile-linux-x86
    needs:
    - nixWarmServerDeps
    - nixFlakeCheck
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Setup FlakeHub Cache
      uses: DeterminateSystems/flakehub-cache-action@v3
      with:
        flakehub-flake-name: waddle-social/waddle
        use-gha-cache: disabled
    - name: nixBuildServer
      run: nix build ../#waddle-server -L --accept-flake-config --max-jobs 1 --cores 0
      working-directory: server
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
  nixCacheKeyContract:
    name: nixCacheKeyContract
    runs-on: namespace-profile-linux-x86
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Setup FlakeHub Cache
      uses: DeterminateSystems/flakehub-cache-action@v3
      with:
        flakehub-flake-name: waddle-social/waddle
        use-gha-cache: disabled
    - name: nixCacheKeyContract
      run: nix develop -L --accept-flake-config .. -c bash scripts/check-nix-cache-keys.sh
      working-directory: server
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
  nixFlakeCheck:
    name: nixFlakeCheck
    runs-on: namespace-profile-linux-x86
    needs:
    - nixWarmServerDeps
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Setup FlakeHub Cache
      uses: DeterminateSystems/flakehub-cache-action@v3
      with:
        flakehub-flake-name: waddle-social/waddle
        use-gha-cache: disabled
    - name: nixFlakeCheck
      run: nix flake check .. -L --accept-flake-config --max-jobs 1 --cores 0
      working-directory: server
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
  nixWarmServerDeps:
    name: nixWarmServerDeps
    runs-on: namespace-profile-linux-x86
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Setup FlakeHub Cache
      uses: DeterminateSystems/flakehub-cache-action@v3
      with:
        flakehub-flake-name: waddle-social/waddle
        use-gha-cache: disabled
    - name: nixWarmServerDeps
      run: nix build ../#waddle-server-deps ../#waddle-server-workspace-deps ../#waddle-server-workspace-all-features-deps ../#waddle-server-xmpp-deps ../#waddle-server-test-deps -L --accept-flake-config --max-jobs 1 --cores 0
      working-directory: server
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
  publishContainerImage:
    name: publishContainerImage
    runs-on: namespace-profile-linux-x86
    needs:
    - nixCacheKeyContract
    - nixBuildServer
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Setup FlakeHub Cache
      uses: DeterminateSystems/flakehub-cache-action@v3
      with:
        flakehub-flake-name: waddle-social/waddle
        use-gha-cache: disabled
    - name: publishContainerImage
      run: |-
        nix develop -L --accept-flake-config .. -c bash -c '
        set -euo pipefail
        case "${CUENV_ARCH}" in
          amd64) ;;
          *) echo "unsupported CUENV_ARCH=${CUENV_ARCH}" >&2; exit 1 ;;
        esac

        echo "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        FULL_SHA="$(git rev-parse HEAD)"
        SHORT_SHA="$(git rev-parse --short HEAD)"
        mkdir -p ../target/digests

        image_stream="$(nix build --print-out-paths ../#waddle-server-image-stream)"
        "${image_stream}" | docker image load

        docker tag ghcr.io/waddle-social/waddle:nix "ghcr.io/waddle-social/waddle:sha-${SHORT_SHA}"
        docker push "ghcr.io/waddle-social/waddle:sha-${SHORT_SHA}" 2>&1 | tee "../target/digests/push-${CUENV_ARCH}.log"
        digest="$(docker inspect --format="{{index .RepoDigests 0}}" "ghcr.io/waddle-social/waddle:sha-${SHORT_SHA}" | sed "s/^.*@//")"
        if [ -z "${digest}" ]; then
          digest="$(grep -Eo "sha256:[a-f0-9]{64}" "../target/digests/push-${CUENV_ARCH}.log" | tail -n1)"
        fi
        if [ -z "${digest}" ]; then
          echo "No image digest found" >&2
          exit 1
        fi
        printf '%s\n' "${digest}" > "../target/digests/${CUENV_ARCH}.txt"

        TAG_ARGS=()
        TAG_ARGS+=("-t" "ghcr.io/waddle-social/waddle:sha-${SHORT_SHA}")
        if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
          VERSION="${GITHUB_REF_NAME}"
          TAG_ARGS+=("-t" "ghcr.io/waddle-social/waddle:${VERSION}")
          if [[ "${VERSION}" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            TAG_ARGS+=("-t" "ghcr.io/waddle-social/waddle:${MAJOR}.${MINOR}.${PATCH}")
            TAG_ARGS+=("-t" "ghcr.io/waddle-social/waddle:${MAJOR}.${MINOR}")
            TAG_ARGS+=("-t" "ghcr.io/waddle-social/waddle:${MAJOR}")
          fi
        else
          TAG_ARGS+=("-t" "ghcr.io/waddle-social/waddle:main")
        fi

        docker buildx imagetools create "${TAG_ARGS[@]}" "ghcr.io/waddle-social/waddle@${digest}"
        docker buildx imagetools inspect "${TAG_ARGS[1]}"

        echo "${GITHUB_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        helm package charts/waddle-server -d /tmp/charts
        helm push /tmp/charts/waddle-server-*.tgz oci://ghcr.io/waddle-social/waddle/charts || echo "Chart version already exists, skipping"

        yq -i ".spec.values.image.tag = \"sha-${SHORT_SHA}\"" ../infrastructure/waddle.cloud/gitops/waddle-server/helmrelease.yaml
        yq -e ".spec.values.image.tag == \"sha-${SHORT_SHA}\"" ../infrastructure/waddle.cloud/gitops/waddle-server/helmrelease.yaml > /dev/null
        flux push artifact oci://ghcr.io/waddle-social/waddle/gitops-waddle-server:latest \
          --path=../infrastructure/waddle.cloud/gitops/waddle-server \
          --source="$(git config --get remote.origin.url)" \
          --revision="${SHORT_SHA}"
        '
      working-directory: server
      env:
        CUENV_ARCH: amd64
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: publishContainerImage-artifacts
        path: target/digests/**
        if-no-files-found: ignore
        include-hidden-files: true
