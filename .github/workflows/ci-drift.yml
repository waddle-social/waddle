name: ci-drift
on:
  pull_request:
    paths:
    - .github/workflows/ci-drift.yml
    - .github/workflows/codeql.yml
    - cue.mod/**
    - env.cue
    - chat/env.cue
    - colony/env.cue
    - infrastructure/waddle.cloud/env.cue
    - server/env.cue
    - server/scripts/check-ci-drift.sh
    - server/scripts/pin-generated-github-actions.sh
    - website/env.cue
  push:
    branches:
    - main
    paths:
    - .github/workflows/ci-drift.yml
    - .github/workflows/codeql.yml
    - cue.mod/**
    - env.cue
    - chat/env.cue
    - colony/env.cue
    - infrastructure/waddle.cloud/env.cue
    - server/env.cue
    - server/scripts/check-ci-drift.sh
    - server/scripts/pin-generated-github-actions.sh
    - website/env.cue
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    name: ci drift
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 2
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        curl -sSL -o /usr/local/bin/cuenv "https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}" && chmod +x /usr/local/bin/cuenv
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Check generated CI drift
      run: bash server/scripts/check-ci-drift.sh
