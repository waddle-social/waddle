# Generated by cuenv - do not edit manually
# Regenerate with: cuenv ci --format github

name: waddle-server-Publish tags to FlakeHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to publish to FlakeHub
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write
jobs:
  waddle-server-Publish-tags-to-FlakeHub:
    name: waddle-server-Publish tags to FlakeHub
    runs-on: namespace-profile-linux-x86
    environment: flakehub
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Set up Namespace Nix cache
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@92ffb5400c3776307a27a1727d7e2ac3dcd9f844
      with:
        extra-conf: accept-flake-config = true
    - name: Checkout tag
      uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: ${{ (inputs.tag != null) && format('refs/tags/{0}', inputs.tag) || '' }}
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        curl -sSL -o /usr/local/bin/cuenv "https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Push to FlakeHub
      uses: DeterminateSystems/flakehub-push@71f57208810a5d299fc6545350981de98fdbc860
      with:
        include-output-paths: true
        name: waddle-social/waddle
        tag: ${{ inputs.tag }}
        visibility: public
    - name: 'Run pipeline: Publish tags to FlakeHub'
      run: cuenv ci --pipeline Publish tags to FlakeHub --path server
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        CUENV_ENVIRONMENT: flakehub
