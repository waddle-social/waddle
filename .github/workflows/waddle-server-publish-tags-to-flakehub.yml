name: waddle-server-Publish tags to FlakeHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to publish to FlakeHub
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: none
  id-token: write
jobs:
  waddle-server-Publish-tags-to-FlakeHub:
    name: waddle-server-Publish tags to FlakeHub
    runs-on: ubuntu-latest
    environment: flakehub
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Nix
      uses: DeterminateSystems/determinate-nix-action@f4c468f2287f0f14a113841b41f2dc8957119519
    - name: Checkout tag
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        ref: ${{ (inputs.tag != null) && format('refs/tags/{0}', inputs.tag) || '' }}
    - name: Setup Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@f4c468f2287f0f14a113841b41f2dc8957119519
    - name: Push to FlakeHub
      uses: DeterminateSystems/flakehub-push@a225170f3ab20a9d93dbb4424090ef0523ca7425
      with:
        include-output-paths: true
        name: waddle-social/waddle
        tag: ${{ inputs.tag }}
        visibility: public
    - name: Setup cuenv (pinned release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64)
            cuenv_asset="cuenv-linux-x64"
            cuenv_sha256="1bdcea6505d4ededee6fd416e7b5dc071e93db6fc91baaaf680e92f175743312"
            ;;
          aarch64|arm64)
            cuenv_asset="cuenv-linux-arm64"
            cuenv_sha256="6d56a2864434509270e59b931d97b77b416e5161d60f0928bdf14c25f54b897e"
            ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        curl -sSL -o /usr/local/bin/cuenv "https://github.com/cuenv/cuenv/releases/download/0.41.1/${cuenv_asset}"
        echo "${cuenv_sha256}  /usr/local/bin/cuenv" | sha256sum -c -
        chmod +x /usr/local/bin/cuenv
        /usr/local/bin/cuenv sync -A
    - name: 'Run pipeline: Publish tags to FlakeHub'
      run: cuenv ci --pipeline Publish tags to FlakeHub --path server
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        CUENV_ENVIRONMENT: flakehub
