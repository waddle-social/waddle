# Regenerate with: cuenv sync ci

name: waddle-server-Publish tags to FlakeHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to publish to FlakeHub
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write
jobs:
  flakehubPublished:
    name: flakehubPublished
    runs-on: namespace-profile-linux-x86
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Checkout tag
      uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: ${{ (inputs.tag != null) && format('refs/tags/{0}', inputs.tag) || '' }}
    - name: Setup FlakeHub Cache
      uses: DeterminateSystems/flakehub-cache-action@v3
      with:
        flakehub-flake-name: waddle-social/waddle
        use-gha-cache: disabled
    - name: Push to FlakeHub
      uses: DeterminateSystems/flakehub-push@71f57208810a5d299fc6545350981de98fdbc860
      with:
        include-output-paths: true
        name: waddle-social/waddle
        tag: ${{ inputs.tag }}
        visibility: public
    - name: flakehubPublished
      run: nix flake metadata .. --accept-flake-config
      working-directory: server
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
