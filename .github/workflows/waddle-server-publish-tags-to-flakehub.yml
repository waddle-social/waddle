# Generated by cuenv - do not edit manually
# Regenerate with: cuenv sync ci

name: waddle-server-Publish tags to FlakeHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to publish to FlakeHub
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: none
  id-token: write
jobs:
  waddle-server-Publish-tags-to-FlakeHub:
    name: waddle-server-Publish tags to FlakeHub
    runs-on: namespace-profile-linux-x86
    environment: flakehub
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Cache /nix on Namespace volume
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
    - name: Hand /nix to the runner user
      run: sudo chown -R runner /nix
    - name: Checkout tag
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        ref: ${{ (inputs.tag != null) && format('refs/tags/{0}', inputs.tag) || '' }}
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: accept-flake-config = true
    - name: Push to FlakeHub
      uses: DeterminateSystems/flakehub-push@a225170f3ab20a9d93dbb4424090ef0523ca7425
      with:
        include-output-paths: true
        name: waddle-social/waddle
        tag: ${{ inputs.tag }}
        visibility: public
    - name: Build cuenv (nix)
      run: |-
        . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
        nix build .#cuenv -L --accept-flake-config
        echo "$(pwd)/result/bin" >> "$GITHUB_PATH" 2>/dev/null || echo "$(pwd)/result/bin" >> "$BUILDKITE_ENV_FILE" 2>/dev/null || true
        ./result/bin/cuenv sync ci
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: 'Run pipeline: Publish tags to FlakeHub'
      run: cuenv ci --pipeline Publish tags to FlakeHub --path server
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        CUENV_ENVIRONMENT: flakehub
