name: waddle-apple-pullrequest

on:
  pull_request:
    paths:
      - .cargo/**
      - .github/workflows/waddle-apple-pullrequest.yml
      - apps/apple/**
      - scripts/check-native-remote-telemetry.sh
      - scripts/native-telemetry-cargo-closure.py
      - scripts/build-xcframework.sh
      - server/.cargo/**
      - server/Cargo.lock
      - server/Cargo.toml
      - server/crates/**/.cargo/**
      - server/crates/waddle-xmpp-client-ffi/**
      - server/crates/waddle-xmpp-client/**
      - server/crates/waddle-xmpp-core/**
      - server/rust-toolchain.toml
      - server/vendor/**
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  telemetry:
    name: Apple telemetry contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check native telemetry contract
        run: bash scripts/check-native-remote-telemetry.sh --apple
