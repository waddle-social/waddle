name: waddle-apple-pullrequest

on:
  pull_request:
    paths:
      - .cargo/**
      - .github/workflows/waddle-apple-pullrequest.yml
      - apps/apple/**
      - scripts/check-native-remote-telemetry.sh
      - scripts/native-telemetry-cargo-closure.py
      - scripts/build-xcframework.sh
      - server/.cargo/**
      - server/Cargo.lock
      - server/Cargo.toml
      - server/crates/**/.cargo/**
      - server/crates/waddle-xmpp-client-ffi/**
      - server/crates/waddle-xmpp-client/**
      - server/crates/waddle-xmpp-core/**
      - server/rust-toolchain.toml
      - server/vendor/**
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  apple-xmpp-client:
    name: apple-xmpp-client
    runs-on: namespace-profile-darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        working-directory: server
        run: rustup toolchain install
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check native telemetry contract
        run: bash scripts/check-native-remote-telemetry.sh --apple
      - name: Test WaddleKit
        working-directory: apps/apple/WaddleKit
        run: swift test
      - name: Build XMPP client XCFramework
        run: bash scripts/build-xcframework.sh --debug
      - name: Build and test macOS app
        run: xcodebuild -project apps/apple/Waddle.xcodeproj -scheme Waddle-macOS -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
      - name: Build and test iOS app
        run: |
          device="$(python3 apps/apple/scripts/newest-iphone-simulator.py)"
          xcodebuild -project apps/apple/Waddle.xcodeproj -scheme Waddle-iOS -destination "platform=iOS Simulator,id=${device}" CODE_SIGNING_ALLOWED=NO test
      # A golden that is missing is recorded by the failing run. Keeping
      # it lets a platform with no local simulator get its goldens here.
      - name: Keep the snapshots a failed run recorded
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apple-recorded-snapshots
          path: apps/apple/WaddleTests/__Snapshots__
          if-no-files-found: ignore
          retention-days: 7
