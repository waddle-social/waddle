name: waddle-chat-pullRequest
on:
  pull_request:
    paths:
    - .github/workflows/waddle-chat-pullrequest.yml
    - bun.lock
    - bun.lock/**
    - chat/astro.config.mjs
    - chat/astro.config.mjs/**
    - chat/dist/**
    - chat/env.cue
    - chat/knip.json
    - chat/knip.json/**
    - chat/package.json
    - chat/package.json/**
    - chat/public/**
    - chat/schema/**
    - chat/scripts/**
    - chat/scripts/build-xmpp-wasm.mjs
    - chat/scripts/build-xmpp-wasm.mjs/**
    - chat/scripts/generate-service-worker.mjs
    - chat/scripts/generate-service-worker.mjs/**
    - chat/scripts/resolve-commit-sha.mjs
    - chat/scripts/resolve-commit-sha.mjs/**
    - chat/src/**
    - chat/tests/**
    - chat/tsconfig.json
    - chat/tsconfig.json/**
    - chat/wrangler.jsonc
    - chat/wrangler.jsonc/**
    - cue.mod/**
    - env.cue
    - env.cue/**
    - package.json
    - package.json/**
    - server/Cargo.lock
    - server/Cargo.lock/**
    - server/Cargo.toml
    - server/Cargo.toml/**
    - server/crates/waddle-xmpp-client-wasm/**
    - server/crates/waddle-xmpp-client/**
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write
  id-token: write
jobs:
  waddle-chat-pullRequest:
    name: waddle-chat-pullRequest
    runs-on: namespace-profile-linux-x86
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Cache /nix on Namespace volume
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
    - name: Hand /nix to the runner user
      run: sudo chown -R runner /nix
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: accept-flake-config = true
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        curl -fsSL -o /usr/local/bin/cuenv "https://github.com/cuenv/cuenv/releases/download/0.41.3/${cuenv_asset}" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: cuenv:contributor:bun.workspace.setup
      run: 'true'
    - name: Install Bun dependencies
      run: cuenv exec -- bun install --frozen-lockfile
    - name: 'Run pipeline: pullRequest'
      run: cuenv ci --pipeline pullRequest --path chat
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
