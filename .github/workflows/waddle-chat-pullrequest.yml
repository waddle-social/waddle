# Generated by cuenv - do not edit manually
# Regenerate with: cuenv ci --format github

name: waddle-chat-pullRequest
on:
  pull_request:
    paths:
    - .github/workflows/waddle-chat-pullrequest.yml
    - chat/../bun.lock
    - chat/../package.json
    - chat/astro.config.mjs
    - chat/env.cue
    - chat/package.json
    - chat/public/**
    - chat/schema/**
    - chat/src/**
    - chat/tsconfig.json
    - chat/wrangler.jsonc
    - cue.mod/**
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write
jobs:
  waddle-chat-pullRequest:
    name: waddle-chat-pullRequest
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v16
      with:
        extra-conf: accept-flake-config = true
    - name: Setup cuenv (release)
      run: curl -sSL -o /usr/local/bin/cuenv https://github.com/cuenv/cuenv/releases/latest/download/cuenv-linux-x64 && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup 1Password
      run: cuenv exec -- cuenv secrets setup onepassword
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    - name: 'Run pipeline: pullRequest'
      run: cuenv ci --pipeline pullRequest --path chat
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CUENV_ENVIRONMENT: production
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
