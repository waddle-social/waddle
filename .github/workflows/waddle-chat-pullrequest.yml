# Generated by cuenv - do not edit manually
# Regenerate with: cuenv ci --format github

name: waddle-chat-pullRequest
on:
  pull_request:
    paths:
    - .github/workflows/waddle-chat-pullrequest.yml
    - chat/../bun.lock
    - chat/../package.json
    - chat/astro.config.mjs
    - chat/env.cue
    - chat/knip.json
    - chat/package.json
    - chat/public/**
    - chat/schema/**
    - chat/scripts/**
    - chat/src/**
    - chat/tests/**
    - chat/tsconfig.json
    - chat/wrangler.jsonc
    - cue.mod/**
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write
  id-token: write
jobs:
  waddle-chat-pullRequest:
    name: waddle-chat-pullRequest
    runs-on: namespace-profile-linux-x86
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Setup FlakeHub Cache
      uses: DeterminateSystems/flakehub-cache-action@v3
      with:
        flakehub-flake-name: waddle-social/waddle
        use-gha-cache: disabled
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        curl -sSL -o /usr/local/bin/cuenv "https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: cuenv:contributor:bun.workspace.setup
      run: 'true'
    - name: Install Bun dependencies
      run: cuenv exec -- bun install --frozen-lockfile
    - name: 'Run pipeline: pullRequest'
      run: cuenv ci --pipeline pullRequest --path chat
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
