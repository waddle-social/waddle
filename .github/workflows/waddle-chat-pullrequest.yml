# Generated by cuenv - do not edit manually
# Regenerate with: cuenv sync ci

name: waddle-chat-pullRequest
on:
  pull_request:
    paths:
    - .github/workflows/waddle-chat-pullrequest.yml
    - chat/astro.config.ts
    - chat/bun.lock
    - chat/env.cue
    - chat/package.json
    - chat/public/**
    - chat/schema/**
    - chat/src/**
    - chat/tsconfig.json
    - chat/wrangler.jsonc
    - cue.mod/**
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  waddle-chat-pullrequest:
    name: waddle-chat-pullRequest
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup cuenv (release)
      run: curl -sSL -o /usr/local/bin/cuenv https://github.com/cuenv/cuenv/releases/latest/download/cuenv-linux-x64 && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: 'Run pipeline: pullRequest'
      run: cuenv ci --pipeline pullRequest --path chat
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
