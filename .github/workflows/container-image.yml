name: Container Image

on:
  pull_request:
    branches: [main]
    paths:
      - "server/Cargo.toml"
      - "server/Cargo.lock"
      - "server/crates/**"
      - "server/Containerfile"
      - "server/.dockerignore"
      - "server/certs/**"
      - ".github/workflows/container-image.yml"
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Containerfile
          target: runtime
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=waddle-server-amd64
          cache-to: type=gha,mode=max,scope=waddle-server-amd64

  publish-platform:
    name: Publish ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Containerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=waddle-server-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: |
            type=gha,mode=max,scope=waddle-server-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}.txt"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    needs: publish-platform
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Create and push manifest list
        run: |
          set -euo pipefail

          refs=()
          while IFS= read -r digest; do
            [ -n "${digest}" ] || continue
            refs+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${digest}")
          done < <(cat /tmp/digests/*.txt)

          if [ "${#refs[@]}" -eq 0 ]; then
            echo "No image digests found" >&2
            exit 1
          fi

          tag_args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            tag_args+=("-t" "${tag}")
          done <<< "${{ steps.meta.outputs.tags }}"

          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"

      - name: Inspect published manifest
        run: |
          first_tag="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker buildx imagetools inspect "${first_tag}"

  gitops-push:
    name: Push GitOps artifact
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    needs: publish-manifest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin image tag to commit SHA
        working-directory: infrastructure/waddle.cloud
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i "s/tag: main/tag: sha-${SHORT_SHA}/" ./gitops/waddle-server/helmrelease.yaml

      - name: Push gitops artifact
        working-directory: infrastructure/waddle.cloud
        run: |
          flux push artifact \
            oci://ghcr.io/waddle-social/waddle/gitops:latest \
            --path=./gitops \
            --source="${{ github.server_url }}/${{ github.repository }}" \
            --revision="$(git rev-parse --short HEAD)"
