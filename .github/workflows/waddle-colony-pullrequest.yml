name: waddle-colony-pullRequest
on:
  pull_request:
    paths:
    - .github/workflows/waddle-colony-pullrequest.yml
    - colony/../bun.lock
    - colony/../package.json
    - colony/astro.config.ts
    - colony/drizzle.config.ts
    - colony/drizzle/**
    - colony/env.cue
    - colony/package.json
    - colony/public/**
    - colony/schema/**
    - colony/src/**
    - colony/tsconfig.json
    - colony/wrangler.jsonc
    - cue.mod/**
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write
jobs:
  waddle-colony-pullRequest:
    name: waddle-colony-pullRequest
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v16
      with:
        extra-conf: accept-flake-config = true
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        curl -sSL -o /usr/local/bin/cuenv "https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
