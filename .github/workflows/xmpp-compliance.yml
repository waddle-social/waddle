name: XMPP Compliance

on:
  push:
    branches: [main]
    paths:
      - 'server/crates/waddle-server/**'
      - 'server/crates/waddle-xmpp/**'
      - 'server/Cargo.toml'
      - 'server/Cargo.lock'
      - '.github/workflows/xmpp-compliance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/crates/waddle-server/**'
      - 'server/crates/waddle-xmpp/**'
      - 'server/Cargo.toml'
      - 'server/Cargo.lock'
      - '.github/workflows/xmpp-compliance.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  unit-tests:
    name: Unit Tests (inline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            server/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('server/Cargo.lock', 'server/**/Cargo.toml', 'server/rust-toolchain.toml') }}

      - name: Run XMPP crate unit tests
        run: cargo test --package waddle-xmpp --lib --verbose

      - name: Run server crate tests
        run: cargo test --package waddle-server --verbose

  protocol-conformance:
    name: Protocol Conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            server/target/
          key: ${{ runner.os }}-cargo-conformance-${{ hashFiles('server/Cargo.lock', 'server/**/Cargo.toml', 'server/rust-toolchain.toml') }}

      - name: Run protocol conformance suite
        run: cargo test --package waddle-xmpp --test protocol_conformance --verbose

      - name: Run compliance fast regression
        run: cargo test --package waddle-xmpp --test compliance_fast_regression --verbose

  xep-integration-tests:
    name: XEP Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            server/target/
          key: ${{ runner.os }}-cargo-xep-integ-${{ hashFiles('server/Cargo.lock', 'server/**/Cargo.toml', 'server/rust-toolchain.toml') }}

      - name: Run all XEP integration tests
        run: cargo test --package waddle-xmpp --tests --verbose

      - name: Summarize results
        if: always()
        run: |
          echo "## XEP Integration Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All XEP integration tests ran as native Rust tests." >> "$GITHUB_STEP_SUMMARY"
          echo "No Docker, CAAS, or external dependencies required." >> "$GITHUB_STEP_SUMMARY"

  e2e-messaging:
    name: E2E Messaging & Federation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            server/target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('server/Cargo.lock', 'server/**/Cargo.toml', 'server/rust-toolchain.toml') }}

      - name: Run messaging E2E tests
        run: cargo test --package waddle-xmpp --test messaging_e2e --verbose

      - name: Run federated MUC tests
        run: cargo test --package waddle-xmpp --test federated_muc --verbose

      - name: Run S2S integration tests
        run: cargo test --package waddle-xmpp --test s2s_integration --verbose

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D clippy::correctness
