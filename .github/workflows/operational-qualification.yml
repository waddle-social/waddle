name: Operational qualification contract

on:
  push:
    branches:
      - '**'
    paths:
      - .github/workflows/operational-qualification.yml
      - server/experiments/operational-qualification/**
      - server/rust-toolchain.toml
      - server/.cargo/**
      - flake.lock
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Offline qualification contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the repository Rust toolchain
        run: |
          set -euo pipefail
          version="$(python3 -c 'import re, tomllib; v = tomllib.load(open("server/rust-toolchain.toml", "rb"))["toolchain"]["channel"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", v); print(v)')"
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy --no-self-update
          printf 'RUST_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Format, test and lint
        working-directory: server/experiments/operational-qualification
        run: |
          set -euo pipefail
          cargo "+$RUST_VERSION" fmt --check
          cargo "+$RUST_VERSION" test --locked
          cargo "+$RUST_VERSION" clippy --locked --all-targets -- -D warnings
      - name: Check build-only probe models and archive inspector
        working-directory: server/experiments/operational-qualification/probe-artifact
        run: |
          set -euo pipefail
          probe_test_cc="$(command -v cc)"
          "$probe_test_cc" -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            model.c model_test.c -o "$RUNNER_TEMP/waddle-probe-model-test"
          "$RUNNER_TEMP/waddle-probe-model-test"
          "$probe_test_cc" -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -D_FORTIFY_SOURCE=2 -c init.c -o "$RUNNER_TEMP/waddle-probe-init.o"
          python3 -m unittest -v test_artifact
  probe-artifact:
    name: Pinned build-only guest artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614
        with:
          extra-conf: experimental-features = nix-command flakes
      - name: Build, inspect and repeat the pinned artifact without executing it
        run: |
          set -euo pipefail
          probe_output="$(nix-build server/experiments/operational-qualification/probe-artifact/default.nix --no-out-link)"
          python3 server/experiments/operational-qualification/probe-artifact/inspect_artifact.py "$probe_output/initramfs.cpio.gz"
          nix-build server/experiments/operational-qualification/probe-artifact/default.nix --check --no-out-link
  host-inspection-probe:
    name: Pinned build-only host inspection probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614
        with:
          extra-conf: experimental-features = nix-command flakes
      - name: Build and test the probe without executing it
        run: nix-build server/experiments/operational-qualification/host-canary/default.nix --no-out-link
  host-controller:
    name: Pinned build-only host controller
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614
        with:
          extra-conf: experimental-features = nix-command flakes
      - name: Build controller and run only pure models and integration fakes
        run: nix-build server/experiments/operational-qualification/host-controller/default.nix --no-out-link
