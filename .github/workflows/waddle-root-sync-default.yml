# Regenerate with: cuenv sync ci

name: waddle-root-sync-default
on:
  push:
    branches:
    - main
    paths:
    - '**/env.cue'
    - .github/workflows/**
    - .github/workflows/waddle-root-sync-default.yml
    - .gitignore
    - .gitignore/**
    - .rules.cue
    - .rules.cue/**
    - ci/root-sync/env.cue
    - ci/root-sync/env.cue/**
    - ci/root-sync/run-root-sync-guard.sh
    - ci/root-sync/run-root-sync-guard.sh/**
    - ci/root-sync/run-root-sync-guard.test.ts
    - ci/root-sync/run-root-sync-guard.test.ts/**
    - ci/root-sync/schema/**
    - cue.mod/**
    - cuenv.lock
    - cuenv.lock/**
    - env.cue
    - env.cue/**
    - flake.lock
    - flake.lock/**
    - flake.nix
    - flake.nix/**
    - server/scripts/check-root-sync-drift.mjs
    - server/scripts/check-root-sync-drift.mjs/**
    - server/scripts/check-root-sync-drift.test.ts
    - server/scripts/check-root-sync-drift.test.ts/**
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: none
  pull-requests: none
jobs:
  requireGuardMarker:
    name: requireGuardMarker
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        cuenv_version="0.54.0"
        if [ -z "$cuenv_version" ]; then
          cuenv_version="latest"
        fi
        if [ "$cuenv_version" = "latest" ]; then
          cuenv_url="https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}"
        else
          cuenv_url="https://github.com/cuenv/cuenv/releases/download/${cuenv_version}/${cuenv_asset}"
        fi
        curl -fsSL -o /usr/local/bin/cuenv "$cuenv_url" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Run root sync guard
      run: bash ci/root-sync/run-root-sync-guard.sh
    - name: requireGuardMarker
      run: cuenv task requireGuardMarker --skip-dependencies
      working-directory: ci/root-sync
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
