      - existing
      - seed
      - warm
      - h3-seed
      - h3-warm
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.scope != 'cargo' && inputs.scope != 'namespace-volume' }}
    runs-on: ubuntu-24.04
