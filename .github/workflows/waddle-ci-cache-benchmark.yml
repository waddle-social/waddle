  h3-seed:
    if: ${{ !cancelled() && needs.normal-ci.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.scope == 'all' }}
    name: cache-benchmark/seed/${{ matrix.variant }}
    needs:
      - normal-ci
      - warm
    outputs:
      manifest-version: ${{ steps.hestia-seed.outputs.manifest-version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: fh
            variant: h3-seeded
            runner:
              - nscloud-ubuntu-24.04-amd64-8x16
      max-parallel: 1
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
