# Generated from ci/cache-benchmark/workflow.cue; do not edit manually.
# Regenerate with: bash scripts/sync-cache-benchmark.sh

name: waddle-ci-cache-benchmark
"on":
  pull_request:
    paths:
      - ci/cache-benchmark/**
      - scripts/*cache-benchmark*
      - docs/ci-cache-benchmarks.md
  workflow_dispatch:
    inputs:
      scope:
        description: Compare all providers, or retry only the Namespace seed/warm pair
        type: choice
        default: all
        required: true
        options:
          - all
          - namespace
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  normal-ci:
    name: Wait for normal CI before cache qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Validate qualification contracts
        run: python3 scripts/test-ci-cache-benchmark.py
      - name: Wait for existing workflows to finish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BENCHMARK_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci-cache-benchmark.py wait-for-ci --sha "$BENCHMARK_HEAD_SHA"
