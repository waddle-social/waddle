              - nscloud-ubuntu-24.04-amd64-8x16
          - variant: fh
            provider: fh
            runner:
              - nscloud-ubuntu-24.04-amd64-8x16
          - variant: h2
            provider: h2
            runner:
              - nscloud-ubuntu-24.04-amd64-8x16
          - variant: h3
            provider: h3
            runner:
              - nscloud-ubuntu-24.04-amd64-8x16
          - variant: fh-h3
            provider: fh-h3
            runner:
              - nscloud-ubuntu-24.04-amd64-8x16
      max-parallel: 1
    steps:
