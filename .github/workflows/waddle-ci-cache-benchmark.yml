          CUENV_CACHE: read
          CUENV_REMOTE_CACHE_UPLOAD: "false"
          EXPECTED_ACTION_DIGEST: ${{ needs.bazel-seed.outputs.digest }}
        run: bash ci/cache-benchmark/verify-bazel.sh restore
  normal-ci:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope != 'cargo' && inputs.scope != 'namespace-volume' }}
    permissions:
      contents: read
      actions: read
    name: Wait for normal CI before cache qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Validate qualification contracts
        run: python3 scripts/test-ci-cache-benchmark.py
      - name: Wait for existing workflows to finish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BENCHMARK_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci-cache-benchmark.py wait-for-ci --sha "$BENCHMARK_HEAD_SHA"
  existing:
    name: cache-benchmark/existing/${{ matrix.variant }}
    needs:
      - normal-ci
    if: ${{ !cancelled() && needs.normal-ci.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.scope == 'all' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: fh-h2
            provider: fh-h2
            runner:
              - nscloud-ubuntu-24.04-amd64-8x16
          - variant: fh
            provider: fh
            runner:
              - nscloud-ubuntu-24.04-amd64-8x16
