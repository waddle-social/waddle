        with:
          cache: nix
      - name: Prepare retained Namespace store for fresh host installation
        if: ${{ matrix.variant == 'namespace' }}
        run: |-
          set -euo pipefail
          if ! sudo test -f /nix/receipt.json; then
            echo "No cached installation receipt; continue with fresh installation."
            exit 0
          fi
          if command -v nix >/dev/null 2>&1 || sudo test -e /usr/local/bin/determinate-nixd; then
            echo "::error::Unexpected existing host Nix installation; refusing receipt recovery."
            exit 1
          fi
          receipt_backup="$(mktemp -d "$RUNNER_TEMP/nix-volume-receipt.XXXXXX")"
          sudo mv /nix/receipt.json "$receipt_backup/receipt.json"
          echo "Retained cached store and database; preserved receipt for fresh host setup."
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614
        with:
          extra-conf: accept-flake-config = true
      - name: Verify Namespace host daemon without building
        if: ${{ matrix.variant == 'namespace' }}
        run: |-
          for attempt in 1 2 3 4 5; do
            if timeout 5s nix store ping --store daemon; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Namespace Nix daemon did not become ready."
          exit 1
      - name: Restore or seed isolated Nix store snapshot
        if: ${{ matrix.variant == 'cache-nix' }}
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: waddle-nix-benchmark-${{ github.run_id }}
          paths: |-
            !/nix
            /nix/store
            /nix/var/nix/db
          purge: false
          save: false
      - name: Setup FlakeHub Cache
        if: ${{ matrix.provider == 'fh' || matrix.provider == 'fh-h2' || matrix.provider == 'fh-h3' }}
        uses: DeterminateSystems/flakehub-cache-action@e80fccc9c4e3a885ad51721c8b92ba3f839d2f6f
        with:
          use-gha-cache: disabled
      - name: Setup Hestia 2
        if: ${{ matrix.provider == 'h2' || matrix.provider == 'fh-h2' }}
        uses: Mic92/hestia@fb239a2f72d4b6e26eec5425f289dea23b27a527
        with:
          version: v2.0.0
          listen: "127.0.0.1:37516"
          upstream-cache-filter: true
          drain-timeout: 300
      - name: Setup Hestia 3
        if: ${{ matrix.provider == 'h3' || matrix.provider == 'fh-h3' || matrix.variant == 'h3-seeded' }}
        uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df
        with:
          drain-timeout: 300
          version: v3.0.1
          listen: "127.0.0.1:37516"
          upstream-cache-filter: true
          wait-manifest-version: ${{ needs.h3-seed.outputs.manifest-version || '0' }}
      - name: Setup Magic GHA cache
        if: ${{ matrix.variant == 'magic' }}
        uses: DeterminateSystems/magic-nix-cache-action@2cdbb78a6eed25b3bc8b97f863549be5f6567e55
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          diff-store: false
          listen: "127.0.0.1:37515"
          source-revision: 5a7f052c8f0c6511bbef3570eeed4d39242171ef
      - name: Restore dependencies, vendor and exact prior archive without building
        env:
          BENCHMARK_PROVIDER: ${{ matrix.provider }}
          BENCHMARK_VARIANT: ${{ matrix.variant }}
        run: |-
          set +e
          python3 scripts/ci-cache-benchmark.py restore --provider "$BENCHMARK_PROVIDER" --variant "$BENCHMARK_VARIANT" --phase warm --output .ci/cache-benchmark
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "Cache miss recorded; this candidate is unqualified, and no build was attempted."
            exit 0
          fi
          exit "$status"
      - name: Upload cache measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cache-benchmark-warm-${{ matrix.variant }}
          path: .ci/cache-benchmark
          include-hidden-files: true
          if-no-files-found: error
  summary:
    name: Cache qualification report
    needs:
      - existing
      - seed
      - warm
      - h3-seed
      - h3-warm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Download measurements
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: cache-benchmark-*
          path: .ci/cache-results
          digest-mismatch: error
      - name: Include cache post-job and queue timings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-cache-benchmark.py summarize --input .ci/cache-results --output .ci/cache-summary
      - name: Upload qualification report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cache-qualification-summary
          path: .ci/cache-summary
          include-hidden-files: true
          if-no-files-found: error
