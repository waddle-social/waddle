    name: cache-benchmark/existing/${{ matrix.variant }}
    needs:
      - normal-ci
    if: ${{ !cancelled() && needs.normal-ci.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.scope == 'all' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: fh-h2
            provider: fh-h2
