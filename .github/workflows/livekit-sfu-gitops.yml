name: LiveKit SFU GitOps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infrastructure/waddle.cloud/charts/livekit-sfu/**"
      - "infrastructure/waddle.cloud/gitops/livekit-sfu/**"
      - "infrastructure/waddle.cloud/gitops/kustomization-infra-livekit-sfu.yaml"
      - "infrastructure/waddle.cloud/gitops/livekit-sfu-source.yaml"
      - ".github/workflows/livekit-sfu-gitops.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  CHART_REPOSITORY: oci://ghcr.io/waddle-social/waddle/charts
  GITOPS_ARTIFACT: oci://ghcr.io/waddle-social/waddle/gitops-livekit-sfu:latest

jobs:
  publish:
    name: Publish LiveKit chart and GitOps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish LiveKit Helm chart
        env:
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          HELM_REGISTRY_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail

          echo "${HELM_REGISTRY_PASSWORD}" | helm registry login ghcr.io --username "${HELM_REGISTRY_USERNAME}" --password-stdin
          mkdir -p /tmp/charts
          helm lint infrastructure/waddle.cloud/charts/livekit-sfu \
            --set apiKeys.values.ci=abcdefghijklmnopqrstuvwxyz123456
          helm package infrastructure/waddle.cloud/charts/livekit-sfu -d /tmp/charts
          chart_version="$(helm show chart infrastructure/waddle.cloud/charts/livekit-sfu | awk '$1 == "version:" { print $2 }')"

          if helm show chart "${CHART_REPOSITORY}/livekit-sfu" --version "${chart_version}" >/dev/null 2>&1; then
            echo "LiveKit chart ${chart_version} already exists, skipping chart push."
            echo "Bump infrastructure/waddle.cloud/charts/livekit-sfu/Chart.yaml when chart content changes."
          else
            helm push /tmp/charts/livekit-sfu-*.tgz "${CHART_REPOSITORY}"
          fi

      - name: Push GitOps artifact
        run: |
          set -euo pipefail

          flux push artifact "${GITOPS_ARTIFACT}" \
            --path=./infrastructure/waddle.cloud/gitops/livekit-sfu \
            --source="${{ github.server_url }}/${{ github.repository }}" \
            --revision="$(git rev-parse --short HEAD)"
