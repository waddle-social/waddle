<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="empty-waddle-title empty-waddle-desc">
<title id="empty-waddle-title">On the way</title>
<desc id="empty-waddle-desc">A penguin hurries to the left, with a raised foot and three small motion dots behind it.</desc>
