<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Waddle together</title>
  <desc id="desc">Three penguin friends on an ice floe. Germany waves with happy closed eyes, a black-red-gold scarf and a salted pretzel. Scotland stands tallest in front, wearing a tartan tam with a red pom-pom and a metal saltire badge. Norway wears a red ribbed hat with a white pom-pom, a Nordic rose band and a red, white and navy scarf. Soft light falls from the upper left.</desc>
