name: waddle_android
description: Waddle Android, with Flutter Material You presentation and a native XMPP core.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  module:
    androidX: true
    androidPackage: social.waddle.flutter
    iosBundleIdentifier: social.waddle.flutter
