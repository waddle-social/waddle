org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Flutter 3.47 tasks access Project during execution, which Gradle 9 rejects
# under configuration caching. The task output/build cache remains enabled.
org.gradle.configuration-cache=false
android.useAndroidX=true
# Flutter 3.47 still resolves BaseExtension; AGP 9's new DSL hides that API.
# Keep AGP's built-in Kotlin enabled for the native app and shared client.
android.newDsl=false
