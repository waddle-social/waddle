[package]
name = "waddle-linux"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Waddle for Linux: a GTK4 + libadwaita client"
repository = "https://github.com/waddle-social/waddle"
publish = false

# Its own workspace: GTK system libraries never enter the server's builds.
# Shared client logic comes from server/crates by path (ADR-0019).
[workspace]

[dependencies]
# Baseline: GNOME 48 (GTK 4.18, libadwaita 1.7).
gtk = { package = "gtk4", version = "0.11", features = ["gnome_48", "blueprint"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
# HTTP for the RFC 8628 device-flow sign-in only, which runs before any XMPP
# stream exists. rustls with ring, matching waddle-xmpp-client.
reqwest = { version = "0.13", default-features = false, features = ["json", "charset", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Secret Service (works in and outside Flatpak through the portal).
oo7 = "0.6"
tokio = { version = "1.52", features = ["rt-multi-thread", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jid = { version = "0.12", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
tracing = "0.1"
async-channel = "2.5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v4"] }
# The shared client core (ADR-0019) and the protocol facade the phones use.
waddle-client-session = { path = "../../server/crates/waddle-client-session" }
waddle-xmpp-client-ffi = { path = "../../server/crates/waddle-xmpp-client-ffi" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }

[profile.release]
lto = "thin"
strip = true
