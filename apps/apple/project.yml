name: Waddle
options:
  createIntermediateGroups: true
packages:
  WaddleKit:
    path: WaddleKit
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 3
    # Xcode Cloud signs with cloud-managed certificates for this team and
    # overrides CURRENT_PROJECT_VERSION with its own build number.
    DEVELOPMENT_TEAM: 6KXCJGJ45W
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    FRAMEWORK_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/Generated
targets:
  Waddle-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Waddle
        excludes:
          - "**/*.md"
    dependencies:
      - framework: $(SRCROOT)/Generated/WaddleXmppClientFFI.xcframework
        embed: false
        link: true
      - package: WaddleKit
    preBuildScripts:
      - name: Sync Waddle Brand Assets
        script: |
          set -euo pipefail
          env -u SDKROOT -u SDK_NAME -u EFFECTIVE_PLATFORM_NAME -u PLATFORM_NAME -u ARCHS -u CURRENT_ARCH xcrun --sdk macosx swift "$SRCROOT/scripts/sync_brand_assets.swift"
    entitlements:
      path: Waddle/Platform/Waddle-iOS.entitlements
      properties:
        # APNs for XEP-0357 push; export swaps in production for release.
        aps-environment: development
    settings:
      base:
        PRODUCT_NAME: Waddle-iOS
        PRODUCT_BUNDLE_IDENTIFIER: p4x.waddle.social
        INFOPLIST_KEY_CFBundleDisplayName: Waddle
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: "Waddle/Waddle-Bridging-Header.h"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Generated/WaddleXmppClientFFI.xcframework/*/Headers $(SRCROOT)/Waddle/RustClient"
        MODULEMAP_FILE: "$(SRCROOT)/Waddle/RustClient/module.modulemap"
  Waddle-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Waddle
        excludes:
          - "**/*.md"
          - LaunchScreen.storyboard
    dependencies:
      - framework: $(SRCROOT)/Generated/WaddleXmppClientFFI.xcframework
        embed: false
        link: true
      - package: WaddleKit
    preBuildScripts:
      - name: Sync Waddle Brand Assets
        script: |
          set -euo pipefail
          env -u SDKROOT -u SDK_NAME -u EFFECTIVE_PLATFORM_NAME -u PLATFORM_NAME -u ARCHS -u CURRENT_ARCH xcrun --sdk macosx swift "$SRCROOT/scripts/sync_brand_assets.swift"
    entitlements:
      path: Waddle/Platform/Waddle-macOS.entitlements
      properties:
        com.apple.developer.aps-environment: development
        # The Mac App Store and TestFlight reject builds without the sandbox.
        com.apple.security.app-sandbox: true
        # XMPP connection, device-authorization sign-in, XEP-0363 uploads.
        com.apple.security.network.client: true
        # Composer file importer.
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_NAME: Waddle-macOS
        PRODUCT_BUNDLE_IDENTIFIER: p4x.waddle.social
        INFOPLIST_KEY_CFBundleDisplayName: Waddle
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        SWIFT_OBJC_BRIDGING_HEADER: "Waddle/Waddle-Bridging-Header.h"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Generated/WaddleXmppClientFFI.xcframework/*/Headers $(SRCROOT)/Waddle/RustClient"
        MODULEMAP_FILE: "$(SRCROOT)/Waddle/RustClient/module.modulemap"
# One scheme per app, and no combined scheme: an archive must build a single
# app for a single platform. Xcode Cloud's ci_post_clone.sh builds only the
# archived platform's XCFramework slice, so a scheme archiving both apps
# fails linking the other one.
schemes:
  Waddle-iOS:
    build:
      targets:
        Waddle-iOS: all
  Waddle-macOS:
    build:
      targets:
        Waddle-macOS: all
