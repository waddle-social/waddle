[workspace]
resolver = "2"
members = [
    "crates/waddle-ecdysis",
    "crates/waddle-server",
    "crates/waddle-sfu",
    "crates/waddle-xmpp",
    "crates/waddle-extensions",
    "crates/waddle-xmpp-core",
    "crates/waddle-xmpp-client",
    "crates/waddle-xmpp-client-ffi",
    "crates/waddle-xmpp-client-wasm",
    "crates/waddle-ws-test-support",
    "extensions/ai-chatbot",
    "extensions/decision-polls",
    "extensions/github",
    "extensions/link-board",
    "extensions/stargate-quotes",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["Waddle Contributors"]
repository = "https://github.com/waddle-social/waddle"

[workspace.dependencies]
# Core Runtime & Async
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
futures = "0.3"

# Web Framework (Server)
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }

# CLI TUI (Client)
ratatui = "0.30"
crossterm = "0.29"
tui-textarea = "0.7"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "macros", "chrono", "uuid"] }

# Actor Framework
kameo = "0.20"

jid = { version = "0.12", features = ["serde"] }
xmpp-parsers = "0.22"
minidom = "0.18"
rxml = "0.14"
quick-xml = "0.40.1"
dashmap = "6.2"
unicode-segmentation = "1.13"

tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

# Object Storage
bytes = "1"
object_store = { version = "0.13", features = ["aws"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"
proptest = "1.5"

# HTTP Client
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }

# CLI Arguments & Config
clap = { version = "4.6", features = ["derive"] }
config = "0.15"
dirs = "6.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.32", features = ["logs"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-http = "0.32"
tracing-opentelemetry = "0.33"

# Security/Crypto
rustls = "0.23"
rustls-acme = { version = "0.15.2", default-features = false, features = ["ring", "tokio", "tower", "webpki-roots", "tls12"] }
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "jwk", "pem", "pkcs8"] }
elliptic-curve = { version = "0.13", features = ["jwk"] }
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"
hkdf = "0.13"

# Utilities
uuid = { version = "1.23", features = ["v4", "v7", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
url = "2.5"
base64 = "0.22"
rand = "0.10"
hex = "0.4"
lru = "0.18"
regex = "1.12"
jsonwebtoken = { version = "10.4", features = ["aws_lc_rs"] }

# Markdown/Syntax (CLI)
pulldown-cmark = "0.13"
syntect = "5.3"

# WebAssembly Extension Runtime
wasmtime = { version = "44", features = ["component-model", "async"] }
wasmtime-wasi = "44"
wasmtime-wasi-http = "44"


[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"

[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 4

# CI lint/test builds only — never shipped (release and ci cover shipped
# binaries). No LTO and wide codegen parallelism to minimize compile and
# link time of the ~200 test binaries; light optimization keeps the test
# suite fast at runtime; line-tables keep backtraces usable.
[profile.ci-test]
inherits = "release"
lto = "off"
codegen-units = 16
opt-level = 1
strip = false
debug = "line-tables-only"

[profile.dev]
opt-level = 0
# line-tables-only keeps usable backtraces while cutting test-binary size
# roughly 5-10x; full debuginfo repeatedly exhausted local dev disks.
debug = "line-tables-only"
