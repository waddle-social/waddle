replicaCount: 1

# ADR-0017 clustering. Multi-replica deployments must set this true and use
# Postgres plus shared blob storage/RWX persistence so routing, claims, MUC,
# SM, and ISR state have one durable source of truth.
clustering:
  enabled: false
  swarmPort: 7900
  listenAddrs:
    - /ip4/0.0.0.0/tcp/7900
  bootstrapPeers: []
  # Required when the keypair pool is supplied by an external Secret. When
  # secret.clusteringKeypairPool is set directly, the chart counts it.
  enrolledKeyCount: 0
  keypairHeadroom: 1
  # ADR-0017 Phase 3 Slice 10: the per-entity claim-release drain budget
  # ("claimReleaseBudget" in the ADR's own Implementation Plan text, named
  # as a chart value "consumed from Phase 3 on"). Included in the
  # terminationGracePeriodSeconds floor below (validations.yaml) even while
  # clustering.enabled stays hard-locked false, mirroring
  # WADDLE_CLUSTERING_POD_TEMPLATE_HASH's identical "ships ahead of Phase 4's
  # chart unlock rather than needing a second chart change then" precedent.
  claimReleaseBudgetSeconds: 5

# Deployment update strategy. While persistence uses a ReadWriteOnce PVC, a
# RollingUpdate surges a second pod that deadlocks on Multi-Attach, so the
# single-replica phases pin Recreate (a brief per-deploy connection gap
# absorbed by XEP-0198 resume + client reconnect). Phase 4 flips this to
# RollingUpdate once the RWO PVC requirement is dropped and clustering ships.
updateStrategy:
  type: Recreate

# ADR-0017 Phase 0 preStop: seconds to sleep before SIGTERM so the endpoint
# removal propagates through kube-proxy/ingress and no new connections land on
# a terminating pod while the drain runs. Must be included in
# terminationGracePeriodSeconds below.
preStopSleepSeconds: 5

image:
  repository: ghcr.io/waddle-social/waddle
  pullPolicy: Always
  tag: ""
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

# Pod termination grace period (seconds).
# Must cover the full shutdown budget: preStopSleepSeconds (endpoint
# propagation) + config.drainTimeoutSeconds (connection drain) +
# clustering.claimReleaseBudgetSeconds (ADR-0017 Phase 3 Slice 10's
# per-entity claim-release drain) + a kill margin.
# Default = 5 + 30 + 5 + 5. validations.yaml enforces the floor.
terminationGracePeriodSeconds: 45

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  annotations: {}
  ports:
    http: 3000

headlessService:
  annotations: {}

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: waddle.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: waddle-tls
  #   hosts:
  #     - waddle.local

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  existingClaim: ""
  annotations: {}
  accessModes:
    - ReadWriteOnce
  # By default, the chart fails rendering when replicaCount > 1 and
  # accessModes includes ReadWriteOnce. Set this true only if you know your
  # storage backend supports this topology.
  allowUnsafeRwoScale: false
  size: 10Gi
  storageClassName: ""
  mountPath: /var/lib/waddle
  uploadSubPath: uploads

database:
  driver: postgres
  # Non-sensitive DSN overrides (prefer secret.databaseUrl for credentials).
  url: ""
  xmppMamUrl: ""
  xmppInboxUrl: ""
  xmppPubsubUrl: ""
  # Main/shared pool connection cap (ADR-0017 element 12). Matches the
  # historical hardcoded sqlx `.max_connections(10)`.
  poolSize: 10
  # Dedicated control-plane pool size (ADR-0017 element 4/12) — hosts only
  # node/claim liveness statements (keypair-slot lease heartbeat, claims CAS).
  # Only opened when clustering.enabled is true on a Postgres deployment; a
  # small default since this pool never carries bulk writes.
  controlPlanePoolSize: 4

xmpp:
  enabled: true
  domain: waddle.local
  # Trusted public RFC 7395 endpoint. Use wss:// when TLS is terminated at
  # the ingress/gateway; TLS-only XEP-0397 ISR stays disabled for ws://. Empty
  # derives the fail-closed ws://<xmpp.domain>/ws endpoint at server startup.
  publicWebsocketUrl: ""
  tls:
    secretName: ""
    mountPath: /etc/waddle/tls
    certKey: tls.crt
    keyKey: tls.key
  nativeAuthEnabled: true
  registrationEnabled: false

extensions:
  enabled: false
  cacheDir: /var/lib/waddle/extensions
  # Extensions are loaded from immutable OCI artifact digests. Release
  # automation enables and pins modules after publishing their WASM OCI
  # artifacts. Production wires ai-chatbot provider secrets through
  # configSecretFiles and a mounted ExternalSecret-backed file.
  modules: []

config:
  mode: homeserver
  baseUrl: https://waddle.local
  corsOrigins: ""
  serverOwnerLocalparts: []
  # Optional non-sensitive provider JSON (usually keep this empty and use secret.authProvidersJson).
  authProvidersJson: ""
  drainTimeoutSeconds: 30
  rustLog: info
  # S3-compatible blob storage (Cloudflare R2, AWS S3, MinIO).
  # When s3Endpoint is set, file uploads use S3 instead of local disk.
  s3Endpoint: ""
  s3Bucket: ""
  # Extra key/value env vars rendered into ConfigMap data (non-sensitive).
  extraEnv: {}

spicedb:
  enabled: true
  endpoint: ""
  insecure: false

# Additional Kubernetes Secrets to inject as env vars (e.g. R2 credentials from ExternalSecrets).
extraSecretRefs: []
# Optional checksum/version value for externally-managed Secrets in
# extraSecretRefs. Use HelmRelease valuesFrom to wire this from a Secret key so
# secret rotation changes the pod template and rolls the Deployment.
extraSecretChecksum: ""

telemetry:
  otlpEndpoint: ""
  serviceName: waddle-server
  serviceVersion: ""
  # deployment.environment resource attribute (e.g. "production").
  # Rendered as the standard OTEL_RESOURCE_ATTRIBUTES env var and
  # merged by the SDK's env resource detector; omitted when empty.
  deploymentEnvironment: ""
  # Trace sampler per the OTel spec's OTEL_TRACES_SAMPLER /
  # OTEL_TRACES_SAMPLER_ARG. The server defaults to
  # parentbased_traceidratio with ratio 1.0 when unset.
  tracesSampler: ""
  tracesSamplerArg: ""

secret:
  create: true
  existingSecret: ""
  # Externally-managed Secret containing the required runtime keys:
  # WADDLE_SESSION_KEY and WADDLE_OCCUPANT_ID_SECRET. Use this when the chart
  # should still render its operator Secret for other values but runtime keys
  # come from ExternalSecrets or another secret manager.
  runtimeSecretName: ""
  # WADDLE_SESSION_KEY is required at server startup. Supply it through this
  # value, secret.existingSecret, or secret.runtimeSecretName.
  sessionKey: ""
  # Per-deployment HMAC key used to derive XEP-0421 occupant identifiers.
  # Required (>=32 bytes). Supply it through this value,
  # secret.existingSecret, or secret.runtimeSecretName.
  # **Do not rotate** without an explicit migration plan — rotation breaks
  # XEP-0421 occupant-id continuity for every existing room/user pair.
  occupantIdSecret: ""
  # JSON object/array for WADDLE_AUTH_PROVIDERS_JSON.
  # This usually contains provider client secrets and should stay in Secret data.
  # Example:
  # [{"id":"github","display_name":"GitHub","kind":"oauth2","issuer":"https://github.com","client_id":"...","client_secret":"...","scopes":["read:user","user:email"],"authorization_endpoint":"https://github.com/login/oauth/authorize","token_endpoint":"https://github.com/login/oauth/access_token","userinfo_endpoint":"https://api.github.com/user","subject_claim":"id","username_claim":"login","email_claim":"email"}]
  authProvidersJson: ""
  # sqlx DSNs (recommended location for sensitive URLs).
  databaseUrl: ""
  xmppMamDatabaseUrl: ""
  xmppInboxDatabaseUrl: ""
  xmppPubsubDatabaseUrl: ""
  spicedbPresharedKey: ""
  # Comma-separated base64 ed25519 secret-key pool for
  # WADDLE_CLUSTERING_KEYPAIR_POOL. Prefer an ExternalSecret via
  # secret.existingSecret/extraSecretRefs in production.
  clusteringKeypairPool: ""

probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /api/v1/health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

# Extra env vars rendered directly in Deployment container.env.
# Supports both value and valueFrom entries.
containerExtraEnv: []
extraVolumes: []
extraVolumeMounts: []

podAntiAffinity:
  enabled: true
  weight: 50
  topologyKey: kubernetes.io/hostname

nodeSelector: {}
tolerations: []
affinity: {}
