{{- if and .Values.restrictedRuntime.enabled (not (include "waddle-server.restrictedHandoffPending" .)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "waddle-server.handoffConfigMapName" . }}
  labels:
    {{- include "waddle-server.labels" . | nindent 4 }}
data:
  handoff.json: {{ include "waddle-server.restrictedHandoff" . | quote }}
{{- end }}
