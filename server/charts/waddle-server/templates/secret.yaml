{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{- $secretName := include "waddle-server.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingSessionKey := "" -}}
{{- $existingAuthProvidersJson := "" -}}
{{- $existingDatabaseUrl := "" -}}
{{- $existingXmppMamDatabaseUrl := "" -}}
{{- $existingXmppInboxDatabaseUrl := "" -}}
{{- $existingSpiceDbPresharedKey := "" -}}
{{- $existingLiveKitApiKey := "" -}}
{{- $existingLiveKitApiSecret := "" -}}
{{- $existingLiveKitTurnSharedSecret := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "WADDLE_SESSION_KEY") -}}
{{- $existingSessionKey = (index $existing.data "WADDLE_SESSION_KEY" | b64dec) -}}
{{- end -}}
{{- if and $existing $existing.data (hasKey $existing.data "WADDLE_AUTH_PROVIDERS_JSON") -}}
{{- $existingAuthProvidersJson = (index $existing.data "WADDLE_AUTH_PROVIDERS_JSON" | b64dec) -}}
{{- end -}}
{{- if and $existing $existing.data (hasKey $existing.data "WADDLE_DATABASE_URL") -}}
{{- $existingDatabaseUrl = (index $existing.data "WADDLE_DATABASE_URL" | b64dec) -}}
{{- end -}}
{{- if and $existing $existing.data (hasKey $existing.data "WADDLE_XMPP_MAM_DATABASE_URL") -}}
{{- $existingXmppMamDatabaseUrl = (index $existing.data "WADDLE_XMPP_MAM_DATABASE_URL" | b64dec) -}}
{{- end -}}
{{- if and $existing $existing.data (hasKey $existing.data "WADDLE_XMPP_INBOX_DATABASE_URL") -}}
{{- $existingXmppInboxDatabaseUrl = (index $existing.data "WADDLE_XMPP_INBOX_DATABASE_URL" | b64dec) -}}
{{- end -}}
{{- if and $existing $existing.data (hasKey $existing.data "WADDLE_SPICEDB_PRESHARED_KEY") -}}
{{- $existingSpiceDbPresharedKey = (index $existing.data "WADDLE_SPICEDB_PRESHARED_KEY" | b64dec) -}}
{{- end -}}
{{- if and $existing $existing.data (hasKey $existing.data "WADDLE_LIVEKIT_API_KEY") -}}
{{- $existingLiveKitApiKey = (index $existing.data "WADDLE_LIVEKIT_API_KEY" | b64dec) -}}
{{- end -}}
{{- if and $existing $existing.data (hasKey $existing.data "WADDLE_LIVEKIT_API_SECRET") -}}
{{- $existingLiveKitApiSecret = (index $existing.data "WADDLE_LIVEKIT_API_SECRET" | b64dec) -}}
{{- end -}}
{{- if and $existing $existing.data (hasKey $existing.data "WADDLE_LIVEKIT_TURN_SHARED_SECRET") -}}
{{- $existingLiveKitTurnSharedSecret = (index $existing.data "WADDLE_LIVEKIT_TURN_SHARED_SECRET" | b64dec) -}}
{{- end -}}
{{- $sessionKey := default "" (coalesce .Values.secret.sessionKey $existingSessionKey) -}}
{{- $authProvidersJson := default "" (coalesce .Values.secret.authProvidersJson $existingAuthProvidersJson) -}}
{{- $databaseUrl := default "" (coalesce .Values.secret.databaseUrl $existingDatabaseUrl) -}}
{{- $xmppMamDatabaseUrl := default "" (coalesce .Values.secret.xmppMamDatabaseUrl $existingXmppMamDatabaseUrl) -}}
{{- $xmppInboxDatabaseUrl := default "" (coalesce .Values.secret.xmppInboxDatabaseUrl $existingXmppInboxDatabaseUrl) -}}
{{- $spicedbPresharedKey := default "" (coalesce .Values.secret.spicedbPresharedKey $existingSpiceDbPresharedKey) -}}
{{- $livekitApiKey := default "" (coalesce .Values.secret.livekitApiKey $existingLiveKitApiKey) -}}
{{- $livekitApiSecret := default "" (coalesce .Values.secret.livekitApiSecret $existingLiveKitApiSecret) -}}
{{- $livekitTurnSharedSecret := default "" (coalesce .Values.secret.livekitTurnSharedSecret $existingLiveKitTurnSharedSecret) -}}
{{- if eq $sessionKey "" -}}
{{- $sessionKey = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "waddle-server.labels" . | nindent 4 }}
type: Opaque
data:
  WADDLE_SESSION_KEY: {{ $sessionKey | toString | b64enc }}
  {{- if $authProvidersJson }}
  WADDLE_AUTH_PROVIDERS_JSON: {{ $authProvidersJson | toString | b64enc }}
  {{- end }}
  {{- if $databaseUrl }}
  WADDLE_DATABASE_URL: {{ $databaseUrl | toString | b64enc }}
  {{- end }}
  {{- if $xmppMamDatabaseUrl }}
  WADDLE_XMPP_MAM_DATABASE_URL: {{ $xmppMamDatabaseUrl | toString | b64enc }}
  {{- end }}
  {{- if $xmppInboxDatabaseUrl }}
  WADDLE_XMPP_INBOX_DATABASE_URL: {{ $xmppInboxDatabaseUrl | toString | b64enc }}
  {{- end }}
  {{- if .Values.secret.githubToken }}
  GITHUB_TOKEN: {{ .Values.secret.githubToken | toString | b64enc }}
  {{- end }}
  {{- if $spicedbPresharedKey }}
  WADDLE_SPICEDB_PRESHARED_KEY: {{ $spicedbPresharedKey | b64enc }}
  {{- end }}
  {{- if $livekitApiKey }}
  WADDLE_LIVEKIT_API_KEY: {{ $livekitApiKey | b64enc }}
  {{- end }}
  {{- if $livekitApiSecret }}
  WADDLE_LIVEKIT_API_SECRET: {{ $livekitApiSecret | b64enc }}
  {{- end }}
  {{- if $livekitTurnSharedSecret }}
  WADDLE_LIVEKIT_TURN_SHARED_SECRET: {{ $livekitTurnSharedSecret | b64enc }}
  {{- end }}
{{- end }}
