{{- /*
Operator-supplied Secret. This template emits only keys the operator
explicitly passes through values. Nothing here uses `lookup`, so render output
is deterministic.

The Secret is created only when the operator supplies at least one value;
otherwise the Deployment relies on secret.existingSecret or extraSecretRefs.
*/ -}}
{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{- $sessionKey := default "" .Values.secret.sessionKey -}}
{{- $occupantIdSecret := default "" .Values.secret.occupantIdSecret -}}
{{- $authProvidersJson := default "" .Values.secret.authProvidersJson -}}
{{- $databaseUrl := default "" .Values.secret.databaseUrl -}}
{{- $xmppMamDatabaseUrl := default "" .Values.secret.xmppMamDatabaseUrl -}}
{{- $xmppInboxDatabaseUrl := default "" .Values.secret.xmppInboxDatabaseUrl -}}
{{- $xmppPubsubDatabaseUrl := default "" .Values.secret.xmppPubsubDatabaseUrl -}}
{{- $spicedbPresharedKey := default "" .Values.secret.spicedbPresharedKey -}}
{{- $clusteringKeypairPool := default "" .Values.secret.clusteringKeypairPool -}}
{{- $hasOperatorData := or
  (ne $sessionKey "")
  (ne $occupantIdSecret "")
  (ne $authProvidersJson "")
  (ne $databaseUrl "")
  (ne $xmppMamDatabaseUrl "")
  (ne $xmppInboxDatabaseUrl "")
  (ne $xmppPubsubDatabaseUrl "")
  (ne $spicedbPresharedKey "")
  (ne $clusteringKeypairPool "") -}}
{{- if $hasOperatorData }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "waddle-server.secretName" . }}
  labels:
    {{- include "waddle-server.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $sessionKey }}
  WADDLE_SESSION_KEY: {{ $sessionKey | toString | b64enc }}
  {{- end }}
  {{- if $occupantIdSecret }}
  WADDLE_OCCUPANT_ID_SECRET: {{ $occupantIdSecret | toString | b64enc }}
  {{- end }}
  {{- if $authProvidersJson }}
  WADDLE_AUTH_PROVIDERS_JSON: {{ $authProvidersJson | toString | b64enc }}
  {{- end }}
  {{- if $databaseUrl }}
  WADDLE_DATABASE_URL: {{ $databaseUrl | toString | b64enc }}
  {{- end }}
  {{- if $xmppMamDatabaseUrl }}
  WADDLE_XMPP_MAM_DATABASE_URL: {{ $xmppMamDatabaseUrl | toString | b64enc }}
  {{- end }}
  {{- if $xmppInboxDatabaseUrl }}
  WADDLE_XMPP_INBOX_DATABASE_URL: {{ $xmppInboxDatabaseUrl | toString | b64enc }}
  {{- end }}
  {{- if $xmppPubsubDatabaseUrl }}
  WADDLE_XMPP_PUBSUB_DATABASE_URL: {{ $xmppPubsubDatabaseUrl | toString | b64enc }}
  {{- end }}
  {{- if $spicedbPresharedKey }}
  WADDLE_SPICEDB_PRESHARED_KEY: {{ $spicedbPresharedKey | b64enc }}
  {{- end }}
  {{- if $clusteringKeypairPool }}
  WADDLE_CLUSTERING_KEYPAIR_POOL: {{ $clusteringKeypairPool | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
