{{- if .Values.sfu.udpPort }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddle-server.fullname" . }}-sfu
  labels:
    {{- include "waddle-server.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "waddle-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: sfu-udp
      port: {{ .Values.sfu.udpPort }}
      targetPort: sfu-udp
      nodePort: {{ .Values.sfu.nodePort }}
      protocol: UDP
{{- end }}
