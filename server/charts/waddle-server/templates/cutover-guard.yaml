{{- if and .Values.cutoverGuard.enabled (eq .Values.updateStrategy.type "RollingUpdate") .Release.IsUpgrade -}}
{{- $deployment := lookup "apps/v1" "Deployment" .Release.Namespace (include "waddle-server.fullname" .) -}}
{{- $pods := lookup "v1" "Pod" .Release.Namespace "" -}}
{{- include "waddle-server.guardCutover" (dict "allowedRevisions" .Values.cutoverGuard.allowedRevisions "deployment" $deployment "pods" $pods) -}}
{{- end -}}
