apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "waddle-server.configMapName" . }}
  labels:
    {{- include "waddle-server.labels" . | nindent 4 }}
data:
  WADDLE_MODE: {{ .Values.config.mode | quote }}
  WADDLE_BASE_URL: {{ .Values.config.baseUrl | quote }}
  WADDLE_DB_DRIVER: {{ .Values.database.driver | quote }}
  WADDLE_DB_POOL_SIZE: {{ .Values.database.poolSize | toString | quote }}
  WADDLE_DB_CONTROL_PLANE_POOL_SIZE: {{ .Values.database.controlPlanePoolSize | toString | quote }}
  WADDLE_XMPP_ENABLED: {{ .Values.xmpp.enabled | toString | quote }}
  WADDLE_XMPP_DOMAIN: {{ .Values.xmpp.domain | quote }}
  {{- if .Values.xmpp.publicWebsocketUrl }}
  WADDLE_XMPP_PUBLIC_WEBSOCKET_URL: {{ .Values.xmpp.publicWebsocketUrl | quote }}
  {{- end }}
  WADDLE_NATIVE_AUTH_ENABLED: {{ .Values.xmpp.nativeAuthEnabled | toString | quote }}
  WADDLE_REGISTRATION_ENABLED: {{ .Values.xmpp.registrationEnabled | toString | quote }}
  WADDLE_EXTENSIONS_JSON: {{ .Values.extensions | toJson | quote }}
  WADDLE_DRAIN_TIMEOUT_SECS: {{ .Values.config.drainTimeoutSeconds | toString | quote }}
  WADDLE_CLUSTERING_ENABLED: {{ .Values.clustering.enabled | toString | quote }}
  {{ if .Values.clustering.enabled }}
  WADDLE_CLUSTERING_LISTEN_ADDRS: {{ join "," .Values.clustering.listenAddrs | quote }}
  {{- $bootstrapPeers := .Values.clustering.bootstrapPeers | default (list) -}}
  {{ if eq (len $bootstrapPeers) 0 }}
  WADDLE_CLUSTERING_BOOTSTRAP_PEERS: {{ printf "%s:%d" (include "waddle-server.headlessServiceName" .) (int .Values.clustering.swarmPort) | quote }}
  {{ else }}
  WADDLE_CLUSTERING_BOOTSTRAP_PEERS: {{ join "," $bootstrapPeers | quote }}
  {{ end }}
  {{ end }}
  {{- /*
    ADR-0017 Phase 3 Slice 10: wired unconditionally, mirroring
    WADDLE_CLUSTERING_POD_TEMPLATE_HASH's identical precedent in
    deployment.yaml — harmless while clustering.enabled stays hard-locked
    false (Phase 0 guard), and ships ahead of Phase 4's chart unlock.
  */}}
  WADDLE_CLUSTERING_CLAIM_RELEASE_BUDGET_MS: {{ mul (int .Values.clustering.claimReleaseBudgetSeconds) 1000 | toString | quote }}
  WADDLE_SERVER_OWNER_LOCALPARTS: {{ join "," .Values.config.serverOwnerLocalparts | quote }}
  RUST_LOG: {{ .Values.config.rustLog | quote }}
  {{- if .Values.config.corsOrigins }}
  WADDLE_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  {{- end }}
  {{- if .Values.config.authProvidersJson }}
  WADDLE_AUTH_PROVIDERS_JSON: {{ .Values.config.authProvidersJson | quote }}
  {{- end }}
  {{- if .Values.database.url }}
  WADDLE_DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if .Values.database.xmppMamUrl }}
  WADDLE_XMPP_MAM_DATABASE_URL: {{ .Values.database.xmppMamUrl | quote }}
  {{- end }}
  {{- if .Values.database.xmppInboxUrl }}
  WADDLE_XMPP_INBOX_DATABASE_URL: {{ .Values.database.xmppInboxUrl | quote }}
  {{- end }}
  {{- if .Values.database.xmppPubsubUrl }}
  WADDLE_XMPP_PUBSUB_DATABASE_URL: {{ .Values.database.xmppPubsubUrl | quote }}
  {{- end }}
  {{- if .Values.spicedb.enabled }}
  WADDLE_SPICEDB_ENDPOINT: {{ .Values.spicedb.endpoint | quote }}
  WADDLE_SPICEDB_INSECURE: {{ .Values.spicedb.insecure | toString | quote }}
  {{- end }}
  {{- if .Values.telemetry.otlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.telemetry.otlpEndpoint | quote }}
  {{- end }}
  {{- if .Values.telemetry.serviceName }}
  OTEL_SERVICE_NAME: {{ .Values.telemetry.serviceName | quote }}
  {{- end }}
  {{- if .Values.telemetry.serviceVersion }}
  OTEL_SERVICE_VERSION: {{ .Values.telemetry.serviceVersion | quote }}
  {{- end }}
  {{- if .Values.telemetry.deploymentEnvironment }}
  OTEL_DEPLOYMENT_ENVIRONMENT: {{ .Values.telemetry.deploymentEnvironment | quote }}
  {{- end }}
  {{- if .Values.telemetry.tracesSampler }}
  OTEL_TRACES_SAMPLER: {{ .Values.telemetry.tracesSampler | quote }}
  {{- end }}
  {{- if .Values.telemetry.tracesSamplerArg }}
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.telemetry.tracesSamplerArg | quote }}
  {{- end }}
  {{- if .Values.config.s3Endpoint }}
  WADDLE_S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  {{- end }}
  {{- if .Values.config.s3Bucket }}
  WADDLE_S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  {{- end }}
  {{- range $key, $value := .Values.config.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
