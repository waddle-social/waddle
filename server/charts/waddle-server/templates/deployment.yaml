apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddle-server.fullname" . }}
  labels:
    {{- include "waddle-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- /*
      ADR-0017 Phase 0: Recreate while a ReadWriteOnce PVC is in use so a
      RollingUpdate surge pod cannot deadlock on Multi-Attach. Phase 4 sets
      updateStrategy.type=RollingUpdate once the RWO requirement is dropped.
    */}}
    type: {{ .Values.updateStrategy.type }}
    {{- if eq .Values.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      {{- toYaml (.Values.updateStrategy.rollingUpdate | default dict) | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "waddle-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "waddle-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.extraSecretRefs }}
        checksum/extra-secrets: {{ include "waddle-server.extraSecretChecksum" . | sha256sum }}
        {{- end }}
        {{- if .Values.extraSecretChecksum }}
        checksum/extra-secret-value: {{ .Values.extraSecretChecksum | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "waddle-server.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "waddle-server.name" . }}
          image: {{ include "waddle-server.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if gt (int .Values.preStopSleepSeconds) 0 }}
          lifecycle:
            {{- /*
              ADR-0017 Phase 0: native Sleep preStop (no shell in the
              distroless image, so an `exec: sleep` hook cannot work). Delays
              SIGTERM so the pod's endpoint removal propagates before the drain
              begins — new connections stop landing on a terminating pod.
              Requires the PodLifecycleSleepAction feature (GA in k8s 1.32; see
              Chart.yaml kubeVersion floor).
            */}}
            preStop:
              sleep:
                seconds: {{ int .Values.preStopSleepSeconds }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.ports.http }}
              protocol: TCP
            {{- if .Values.clustering.enabled }}
            - name: swarm
              containerPort: {{ .Values.clustering.swarmPort }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "waddle-server.configMapName" . }}
            {{- /*
              Order matters: later envFrom sources override earlier ones for
              the same key. Operator-supplied values come before external
              Secrets injected via extraSecretRefs.
            */}}
            {{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
            - secretRef:
                name: {{ include "waddle-server.secretName" . }}
                optional: true
            {{- else if .Values.secret.existingSecret }}
            - secretRef:
                name: {{ include "waddle-server.secretName" . }}
                optional: false
            {{- end }}
            {{- range .Values.extraSecretRefs }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            {{- $runtimeSecretName := include "waddle-server.runtimeSecretName" . }}
            - name: WADDLE_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $runtimeSecretName | quote }}
                  key: WADDLE_SESSION_KEY
                  optional: false
            - name: WADDLE_OCCUPANT_ID_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $runtimeSecretName | quote }}
                  key: WADDLE_OCCUPANT_ID_SECRET
                  optional: false
            {{- /*
              ADR-0017 Phase 3 Slice 2 (Q5): this pod's `pod-template-hash`
              label, read from the downward API so a node can stamp its
              deployment generation onto its `clustering_nodes` row for the
              rollout-aware claim-acquisition backoff rule (Slice 10). Wired
              unconditionally — cheap, and harmless while clustering.enabled
              stays hard-locked false (Phase 0 guard) — so the mechanism
              ships ahead of Phase 4's chart unlock rather than needing a
              second chart change then.
            */}}
            - name: WADDLE_CLUSTERING_POD_TEMPLATE_HASH
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['pod-template-hash']
            - name: OTEL_SERVICE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.telemetry.environment }}
            - name: DEPLOYMENT_ENVIRONMENT_NAME
              value: {{ .Values.telemetry.environment | quote }}
            {{- end }}
            {{- if .Values.telemetry.cluster }}
            - name: DEPLOYMENT_CLUSTER_NAME
              value: {{ .Values.telemetry.cluster | quote }}
            {{- end }}
            {{- if .Values.telemetry.commit }}
            - name: WADDLE_GIT_SHA
              value: {{ .Values.telemetry.commit | quote }}
            {{- end }}
            - name: WADDLE_UPLOAD_DIR
              value: {{ printf "%s/%s" .Values.persistence.mountPath .Values.persistence.uploadSubPath | quote }}
            {{- if and .Values.xmpp.enabled .Values.xmpp.tls.secretName }}
            - name: WADDLE_XMPP_TLS_CERT
              value: {{ printf "%s/%s" .Values.xmpp.tls.mountPath .Values.xmpp.tls.certKey | quote }}
            - name: WADDLE_XMPP_TLS_KEY
              value: {{ printf "%s/%s" .Values.xmpp.tls.mountPath .Values.xmpp.tls.keyKey | quote }}
            {{- end }}
            {{- with .Values.containerExtraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- if and .Values.xmpp.enabled .Values.xmpp.tls.secretName }}
            - name: xmpp-tls
              mountPath: {{ .Values.xmpp.tls.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "waddle-server.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if and .Values.xmpp.enabled .Values.xmpp.tls.secretName }}
        - name: xmpp-tls
          secret:
            secretName: {{ .Values.xmpp.tls.secretName }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ int .Values.podAntiAffinity.weight }}
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "waddle-server.selectorLabels" . | nindent 20 }}
                topologyKey: {{ .Values.podAntiAffinity.topologyKey | quote }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
