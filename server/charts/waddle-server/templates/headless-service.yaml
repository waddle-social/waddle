{{- if .Values.clustering.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddle-server.headlessServiceName" . }}
  labels:
    {{- include "waddle-server.labels" . | nindent 4 }}
  {{- with .Values.headlessService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "waddle-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: swarm
      port: {{ .Values.clustering.swarmPort }}
      targetPort: swarm
      protocol: TCP
{{- end }}
