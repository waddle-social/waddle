[package]
name = "waddle-tenancy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tenant registry, Turso/Postgres TenantStore and PlacementLeaseStore, SPIFFE X.509 extraction, and quiesce/drain controllers"

[dependencies]
async-trait = "0.1"
dashmap = { workspace = true }
hex = { workspace = true }
lru = { workspace = true }
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
turso = { version = "0.8.4", default-features = false, features = ["fts"] }
uuid = { workspace = true }
waddle-broker-core = { path = "../waddle-broker-core" }
x509-parser = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"
waddle-ws-test-support = { path = "../waddle-ws-test-support" }

[lints]
workspace = true
