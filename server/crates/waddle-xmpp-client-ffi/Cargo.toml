[package]
name = "waddle-xmpp-client-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FFI scaffold for Waddle's native XMPP client"

[lib]
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["uniffi-bindgen-bin"]

[features]
uniffi-bindgen-bin = ["uniffi/cli"]

[dependencies]
waddle-xmpp-client = { path = "../waddle-xmpp-client" }
waddle-xmpp-core = { path = "../waddle-xmpp-core" }
uniffi = { version = "0.31", features = ["tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
jid = { workspace = true }
minidom = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
# Native FFI build: take `v4` only and drop the workspace-wide `js`
# feature. The workspace pins `uuid` with `js` because the wasm crate
# needs `getrandom`'s JS backend, but enabling `js` for an iOS/macOS
# binary would pull `wasm-bindgen` into the static library and route
# `Uuid::new_v4` through `Math.random` at runtime — fatal for the
# Jingle IQ id mint on the hot call path.
uuid = { version = "1.23", default-features = false, features = ["v4"] }

[build-dependencies]
uniffi = { version = "0.31", features = ["build"] }
