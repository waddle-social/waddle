[package]
name = "waddle-xmpp-client-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebAssembly bindings for Waddle's native XMPP client"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = { workspace = true }
waddle-xmpp-core = { path = "../waddle-xmpp-core" }
wasm-bindgen = "=0.2.120"
wasm-bindgen-futures = "=0.4.70"
js-sys = "=0.3.97"
web-sys = { version = "=0.3.97", features = ["Response", "Window", "console"] }
futures = "0.3"
minidom = "0.18"
jid = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
waddle-xmpp-client = { path = "../waddle-xmpp-client", default-features = false, features = ["wasm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
waddle-xmpp-client = { path = "../waddle-xmpp-client", default-features = false, features = ["wasm", "native"] }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
