[package]
name = "waddle-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Waddle Social - Backend HTTP/XMPP server"

[dependencies]
# Core Runtime & Async
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
futures = { workspace = true }

# Web Framework
axum = { workspace = true }
axum-extra = { workspace = true }
tower-http = { workspace = true }

# Database
sqlx = { workspace = true }

# Actor Framework
kameo = { workspace = true }

# ADR-0017 Phase 2: owned libp2p swarm subsystem (behind the `clustering`
# feature). Version-pinned to match kameo 0.20's libp2p (0.56) so the whole
# dependency graph unifies on one libp2p and `kameo::remote::Behaviour`
# composes into our owned `NetworkBehaviour`. Optional — a default build links
# no libp2p at all.
libp2p = { version = "0.56", default-features = false, features = [
    "tokio",
    "tcp",
    "quic",
    "noise",
    "yamux",
    "macros",
], optional = true }

# XMPP Server
waddle-xmpp = { path = "../waddle-xmpp" }
waddle-xmpp-core = { path = "../waddle-xmpp-core" }
waddle-sfu = { path = "../waddle-sfu" }
waddle-extensions = { path = "../waddle-extensions" }

# Graceful restart (Ecdysis pattern)
waddle-ecdysis = { path = "../waddle-ecdysis" }
jid = { workspace = true }
dashmap = { workspace = true }
minidom = { workspace = true }

xmpp-parsers = { workspace = true }
quick-xml = { workspace = true }

# Object Storage
bytes = { workspace = true }
object_store = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error Handling
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"

# HTTP Client
reqwest = { workspace = true }

# CLI Arguments
clap = { workspace = true }
config = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
opentelemetry-http = { workspace = true }
tracing-opentelemetry = { workspace = true }

# Security/Crypto
rustls = { workspace = true, features = ["ring"] }
rustls-acme = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
p256 = { workspace = true }
elliptic-curve = { workspace = true }
argon2 = { workspace = true }
aes-gcm = { workspace = true }
hkdf = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
lru = { workspace = true }
percent-encoding = "2.3"
urlencoding = "2.1"
html-escape = "0.2"
# Used by `state_inventory_metrics::read_process_rss_bytes` to query
# the running kernel's page size before converting `/proc/self/statm`
# pages to bytes. Already a transitive dep of tokio/sqlx/etc; declared
# explicitly here so the call site doesn't depend on a transitive
# closure being re-exported.
libc = "0.2"
jsonwebtoken = { workspace = true }
prescience = { version = "0.1.0", features = ["tls-rustls"] }

# Avatar transcoding — XEP-0084 §3.2 mandates `image/png` for the
# data node, so non-PNG OIDC avatar bytes are decoded by `image`
# and re-encoded as PNG before publish. Default features pull in
# decoders for every supported format; we narrow to the four MIME
# types in the avatar fetch allowlist to keep the build slim.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
# Shared WebSocket integration-test harness (TestServer + WsXmppClient).
# A separate library crate so per-test-binary `dead_code` lints cannot
# fire on helpers a given binary does not use.
waddle-ws-test-support = { path = "../waddle-ws-test-support" }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio-test = "0.4"
wiremock = "0.6"
# `image` is already a regular dependency; integration tests reach
# it via the same crate without a separate dev-dep declaration.
http-body-util = "0.1"
pbkdf2 = { version = "0.13", features = ["hmac"] }
cuengine = "0.40.6"
tempfile = "3.27"

# Re-declare the workspace XMPP crates with `test-utils` enabled so
# cross-crate integration tests in this package can call the
# `insert_raw_*_for_test` storage helpers and `ArchivedMessage::for_test`
# fixture constructor. The library/binary build (driven by
# `[dependencies]` above) does NOT activate this feature, so production
# builds of `waddle-server` do not pull in the test-only helpers.
waddle-xmpp = { path = "../waddle-xmpp", features = ["test-utils"] }
waddle-xmpp-core = { path = "../waddle-xmpp-core", features = ["test-utils"] }

[features]
# ADR-0017 Phase 2: the owned libp2p swarm subsystem (node discovery only).
# OFF by default so the standard production build links zero libp2p and is
# byte-for-byte identical to the single-replica path. Enabling it turns on
# kameo's `remote` feature (which pulls libp2p) and compiles the
# `crate::clustering` swarm/codec/relay modules. A clustering-built binary is
# still inert unless the runtime `clustering.enabled` config is also set.
clustering = ["kameo/remote", "dep:libp2p"]

[[bin]]
name = "waddle-server"
path = "src/main.rs"

[[bin]]
name = "waddle-cluster-keypool"
path = "src/bin/cluster_keypool.rs"
required-features = ["clustering"]
