[package]
name = "waddle-xmpp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Waddle Social - Native XMPP server library"
autotests = true

[dependencies]
# Core Runtime & Async
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = "0.1"

# Actor Framework
kameo = { workspace = true }

# XMPP
jid = { workspace = true }
xmpp-parsers = { workspace = true }
minidom = { workspace = true }
rxml = { workspace = true }

# Concurrent Data Structures
dashmap = { workspace = true }
lru = { workspace = true }

# TLS
rustls = { workspace = true, features = ["ring"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error Handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Observability
tracing = { workspace = true }
opentelemetry = { workspace = true }
# Production metric emission goes through the API crate (`telemetry`
# module macros); the SDK is used directly only for bounded provider
# flushing and the in-memory metric/span exporter test seams.
opentelemetry_sdk = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
unicode-segmentation = { workspace = true }

# HTML rendering
html-escape = "0.2"

# SCRAM-SHA-256 Authentication and XEP-0115 Entity Capabilities
sha1 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
pbkdf2 = { version = "0.13", features = ["hmac"] }

# Web Push crypto (RFC 8291 aes128gcm + RFC 8292 VAPID JWT signing)
aes-gcm = { workspace = true }
hkdf = { workspace = true }
p256 = { workspace = true }
elliptic-curve = { workspace = true }
jsonwebtoken = { workspace = true }
zeroize = { workspace = true }

# HTTP client (for Web Push notifications)
reqwest = { workspace = true }

# Wasm extension runtime
waddle-extensions = { path = "../waddle-extensions" }
waddle-xmpp-core = { path = "../waddle-xmpp-core" }
waddle-sfu = { path = "../waddle-sfu" }

# Database
sqlx = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tokio = { workspace = true }
tempfile = "3.27"
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
serde_json = { workspace = true }
jsonwebtoken = { workspace = true }
waddle-xmpp-core = { path = "../waddle-xmpp-core", features = ["test-utils"] }
mockito = "1.7"
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[features]
# Exposes `insert_raw_*_for_test` storage helpers (and other test-only
# escape hatches) to cross-crate integration tests. Production builds
# of `waddle-xmpp` MUST NOT enable this feature; downstream crates
# enable it via `[dev-dependencies]` only.
#
# Enabling `test-utils` here transitively enables the same feature on
# `waddle-xmpp-core` so the `ArchivedMessage::for_test` fixture
# constructor is also visible to consumers.
test-utils = [
  "waddle-xmpp-core/test-utils",
  "opentelemetry_sdk/testing",
  "dep:tracing-opentelemetry",
  "dep:tracing-subscriber",
]
