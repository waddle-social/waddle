[package]
name = "waddle-xmpp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Waddle Social - Native XMPP server library"
autotests = true

[dependencies]
# Core Runtime & Async
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = "0.1"

# Actor Framework
kameo = { workspace = true }

# XMPP
jid = { workspace = true }
xmpp-parsers = { workspace = true }
minidom = { workspace = true }
rxml = { workspace = true }

# Concurrent Data Structures
dashmap = { workspace = true }

# TLS
rustls = { workspace = true, features = ["ring"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error Handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Observability
tracing = { workspace = true }
opentelemetry = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }

# HTML rendering
html-escape = "0.2"

# SCRAM-SHA-256 Authentication and XEP-0115 Entity Capabilities
sha1 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
pbkdf2 = { version = "0.12", features = ["hmac"] }

# HTTP client (for Web Push notifications)
reqwest = { workspace = true }

# Wasm extension runtime
waddle-extensions = { path = "../waddle-extensions" }
waddle-xmpp-core = { path = "../waddle-xmpp-core" }

# Database
sqlx = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tokio = { workspace = true }
tempfile = "3.14"
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
