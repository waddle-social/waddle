[package]
name = "waddle-ecdysis"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Graceful restart support for Waddle (Cloudflare Ecdysis pattern)"

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

# An ordinary libtest worker starts after the harness has created threads.
# This fixture needs a synchronous main to exercise pre-runtime fd adoption.
[[test]]
name = "listener_inheritance"
path = "tests/listener_inheritance.rs"
harness = false
