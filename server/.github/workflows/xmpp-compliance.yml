name: XMPP Compliance

on:
  push:
    branches: [main]
    paths:
      - 'crates/waddle-server/**'
      - 'crates/waddle-xmpp/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/xmpp-compliance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/waddle-server/**'
      - 'crates/waddle-xmpp/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/xmpp-compliance.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  unit-tests:
    name: Unit Tests (inline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run XMPP crate unit tests
        run: cargo test --package waddle-xmpp --lib --verbose

      - name: Run server crate tests
        run: cargo test --package waddle-server --verbose

  xep-integration-tests:
    name: XEP Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-xep-integ-${{ hashFiles('**/Cargo.lock') }}

      - name: Run all XEP integration tests
        run: cargo test --package waddle-xmpp --tests --verbose

      - name: Summarize results
        if: always()
        run: |
          echo "## XEP Integration Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All XEP integration tests ran as native Rust tests." >> "$GITHUB_STEP_SUMMARY"
          echo "No Docker, CAAS, or external dependencies required." >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D clippy::correctness
