# Nextest configuration (https://nexte.st/docs/configuration/).
# CI runs with `--profile ci`; local runs use the nextest defaults.

# Unlike cargo test (threads in one process, binaries sequential), nextest
# runs every test in its own process with cross-binary parallelism. That
# defeats the process-local serial mutexes some Postgres-backed tests use,
# and lets table-wide DELETEs in the clustering/xep0198 integration binaries
# interleave with other tests on the shared WADDLE_TEST_POSTGRES_URL
# database. Every test that touches that database must run in this
# single-threaded group. If you add a new test module that reads
# WADDLE_TEST_POSTGRES_URL (through
# waddle_ws_test_support::require_test_postgres_url), add it to the filter
# below, or, if every such test creates and drops its own uniquely named
# schema, list it in scripts/postgres-schema-isolated.txt.
# scripts/check_postgres_test_group.py enforces this (ciHelperContracts).
[test-groups]
postgres = { max-threads = 1 }

# The clustering e2e binaries run an in-process + spawned-server cluster
# with real-time lease heartbeats (1s interval, 10s TTL) and the
# cross-node stale-retirement bounds from #1294. Co-scheduled CPU-heavy
# tests can starve those heartbeats until a live remote resource is
# conflict-force-detached mid-test (#1627: the phase-4 legs then time
# out with zero frames). Same rationale as the xmpp_e2e_cue reservation
# below: give them the machine. Settings resolve per-key from the first
# matching override, so these binaries still join the postgres group.
[[profile.default.overrides]]
filter = 'package(waddle-server) & (binary(clustering_cluster_e2e) | binary(xep0198_cross_node_resume))'
threads-required = 'num-cpus'

[[profile.default.overrides]]
filter = '''
package(waddle-server) & (
    binary(clustering_cluster_e2e)
    | binary(xep0198_cross_node_resume)
    | binary(xep0198_replay_bytes)
    | binary(xep0198_promotion_inventory)
    | binary(ingress_schema_epoch0)
    | binary(ingress_commit)
    | binary(xep0280_carbons_integration)
    | binary(xep0424_ingress_tombstone)
    | binary(xep0313_ingress_schema)
    | binary(xep0359_alias_schema)
    | binary(xep0198_ingress_authority)
    | binary(xep0191_ingress_recovery)
    | binary(xep0160_ingress_offline_recovery)
    | binary(xep0203_ingress_recovery_delay)
    | binary(xep0357_ingress_recovery)
    | binary(xep0359_ingress_alias)
    | binary(xep0045_ingress_occupant_progress)
    | binary(xep0421_ingress_occupant_copies)
    | binary(xep0313_ingress_archive)
    | test(clustering::)
    | test(db::)
    | test(inbox::)
    | test(ingress_substrate::)
    | test(ingress::)
    | test(ingress_invitation_replay_tests::)
    | test(retraction_ingress_tests::)
    | test(displayed_marker::)
    | test(committed_inbox_push)
    | test(websocket::tests::ingress_authority::)
    | test(websocket::tests::keyed_detach_drain::)
    | test(paused_local_mirror_releases_the_only_main_pool_connection)
    | test(ingress_uow::)
    | test(extension_host_adapter::tests::room_results::)
    | test(muc_durable::)
    | test(notification_outbox::)
    | test(pending_delivery::)
    | test(pubsub::)
    | test(session_janitors::)
    | test(sm_persistence)
    | test(pending_colocation_tests::)
    | test(sm_colocation_tests::)
    | test(stream_management::)
    | test(muc_direct::plan_failure_tests::) | test(group_dm_invite::plan_failure_tests::) | test(dm_pin::authority_tests::)
    | test(routing_plan_failure_tests::) | test(direct_archive::correction_plan_tests::) | test(message_plan::envelope_tests::)
    | test(ingress_frame_limits::) | test(ingress_replay_receipts::)
    | test(muc_destroy_completion_outbox::) | test(room_effect_outbox::tests::store_queue::)
)
'''
test-group = 'postgres'

# XMPP storage tests use the same public Postgres schema as the server's
# table-resetting fixtures, including recipient MAM conflict verification.
# The `tx_archive` integration tests open SqlxMamStorage (schema DDL) on that
# same public schema.
[[profile.default.overrides]]
filter = 'package(waddle-xmpp) & (test(postgres) | test(tx_archive))'
test-group = 'postgres'

# Full-server e2e scenarios spin up a complete server and wait on wire
# frames with real-time timeouts. Under cargo test their binary ran alone;
# under nextest they'd share the machine with arbitrary tests and can
# starve past their frame timeouts. Reserve the whole machine for them.
[[profile.default.overrides]]
filter = 'package(waddle-server) & binary(xmpp_e2e_cue)'
threads-required = 'num-cpus'

[profile.ci]
# Show every failure in one run instead of cancelling on the first one,
# matching the old `cargo test` per-binary behavior.
fail-fast = false
# Flaky tests must fail loudly; retries mask flakiness.
retries = 0
# A hung test fails by name instead of consuming the 55-minute shard lane
# (`nixTestLocal`) or the 60-minute PR job. Ordinary tests, including the
# serialized `postgres` group (time counts from each test's own start, not
# from queueing behind the group), finish in seconds; the longest single
# real-time budgets outside the cluster binaries are 120 s (the spawned
# test server's startup, SERVER_STARTUP_TIMEOUT in waddle-ws-test-support;
# a route-bridge retry join). Ten minutes is 5x that.
slow-timeout = { period = "60s", terminate-after = 10 }

# The Postgres shard lane reads executed test names from this report and
# fails when a test in `.config/required-cluster-tests.txt` did not run
# (`scripts/check_required_tests.py`). Written under the store directory,
# `target/nextest/ci/junit.xml`.
[profile.ci.junit]
path = "junit.xml"

# The multi-process cluster harness and the CUE scenario suite chain several
# real-time phases per test: lease heartbeats with a 10 s TTL, stale
# retirement bounds, and per-phase budgets of 30-180 s in
# clustering_cluster_e2e.rs (one 180 s, two 120 s, one 90 s wait). Twenty
# minutes leaves room for every phase to use most of its budget on a loaded
# runner while still failing a hung test well inside the lane's 55 minutes.
[[profile.ci.overrides]]
filter = 'package(waddle-server) & (binary(clustering_cluster_e2e) | binary(xep0198_cross_node_resume) | binary(xmpp_e2e_cue))'
slow-timeout = { period = "120s", terminate-after = 10 }
