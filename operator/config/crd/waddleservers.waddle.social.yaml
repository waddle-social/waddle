apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: waddleservers.waddle.social
spec:
  group: waddle.social
  names:
    kind: WaddleServer
    plural: waddleservers
    shortNames:
    - waddle
    - ws
    singular: waddleserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Current lifecycle state machine phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Ready replicas over desired replicas
      jsonPath: .status.readySummary
      name: Ready
      type: string
    - description: Configured secret provisioning mode
      jsonPath: .status.secretsMode
      name: Secrets
      type: string
    - description: Observed storage dependency readiness
      jsonPath: .status.dependencies.storage.phase
      name: Storage
      type: string
    - description: Observed authorization dependency readiness
      jsonPath: .status.dependencies.authz.phase
      name: Authz
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Declarative deployment and lifecycle specification for a Waddle XMPP server.
        properties:
          spec:
            description: Declarative specification for a `WaddleServer` deployment.
            properties:
              authz:
                description: Pluggable authorization backend (`OpenFga` or `SpiceDb`).
                properties:
                  backend:
                    default: OpenFga
                    description: Authorization backend driver (`OpenFga` or `SpiceDb`).
                    enum:
                    - OpenFga
                    - SpiceDb
                    type: string
                  openfga:
                    description: OpenFGA dependency when `backend` is `OpenFga`.
                    nullable: true
                    properties:
                      authSecretRef:
                        description: Optional same-namespace Secret key holding `WADDLE_OPENFGA_API_TOKEN`.
                        nullable: true
                        properties:
                          key:
                            description: Key inside the `Secret` data map.
                            type: string
                            x-kubernetes-validations:
                            - rule: size(self) > 0
                          name:
                            description: Name of the Kubernetes `Secret` in the same namespace.
                            type: string
                            x-kubernetes-validations:
                            - rule: size(self) > 0
                        required:
                        - key
                        - name
                        type: object
                      consistency:
                        description: OpenFGA read consistency (`higher_consistency` default or `minimize_latency`).
                        nullable: true
                        type: string
                      port:
                        default: 8080
                        description: HTTP port exposed by the OpenFGA Service (default `8080`).
                        format: uint16
                        maximum: 65535.0
                        minimum: 0.0
                        type: integer
                      scheme:
                        default: http
                        description: URI scheme (`http` or `https`, default `http`).
                        type: string
                        x-kubernetes-validations:
                        - rule: self == 'http' || self == 'https'
                      serviceName:
                        description: Name of the same-namespace Kubernetes `Service` exposing OpenFGA.
                        type: string
                        x-kubernetes-validations:
                        - rule: size(self) > 0
                    required:
                    - serviceName
                    type: object
                    x-kubernetes-validations:
                    - rule: '!has(self.consistency) || self.consistency == ''higher_consistency'' || self.consistency == ''minimize_latency'''
                  spicedb:
                    description: SpiceDB dependency when `backend` is `SpiceDb`.
                    nullable: true
                    properties:
                      external:
                        description: Explicit endpoint configuration when `mode` is `External`.
                        nullable: true
                        properties:
                          endpoint:
                            description: Full gRPC URI for SpiceDB (e.g. `http://spicedb:50051` or `https://spicedb.internal:50051`).
                            type: string
                            x-kubernetes-validations:
                            - rule: size(self) > 0
                          insecure:
                            default: false
                            description: Controls `WADDLE_SPICEDB_INSECURE`.
                            type: boolean
                          presharedKeySecretRef:
                            description: Optional explicit Secret key reference for `WADDLE_SPICEDB_PRESHARED_KEY`.
                            nullable: true
                            properties:
                              key:
                                description: Key inside the `Secret` data map.
                                type: string
                                x-kubernetes-validations:
                                - rule: size(self) > 0
                              name:
                                description: Name of the Kubernetes `Secret` in the same namespace.
                                type: string
                                x-kubernetes-validations:
                                - rule: size(self) > 0
                            required:
                            - key
                            - name
                            type: object
                          serviceName:
                            description: Optional same-namespace Kubernetes `Service` whose ready endpoints are verified.
                            nullable: true
                            type: string
                        required:
                        - endpoint
                        type: object
                      mode:
                        default: SpiceDbOperator
                        description: Selects how the SpiceDB endpoint and readiness are discovered.
                        enum:
                        - SpiceDbOperator
                        - External
                        type: string
                      operator:
                        description: '`SpiceDBCluster` reference when `mode` is `SpiceDbOperator`.'
                        nullable: true
                        properties:
                          clusterName:
                            description: Name of the `authzed.com/v1alpha1` `SpiceDBCluster` resource in this namespace.
                            type: string
                            x-kubernetes-validations:
                            - rule: size(self) > 0
                          insecure:
                            description: |-
                              Override `WADDLE_SPICEDB_INSECURE`. When unset, derived automatically from
                              `SpiceDBCluster.spec.config.tlsSecretName` (`true` when absent, `false` when set).
                            nullable: true
                            type: boolean
                          port:
                            default: 50051
                            description: gRPC port exposed by the SpiceDB Service (default `50051`).
                            format: uint16
                            maximum: 65535.0
                            minimum: 0.0
                            type: integer
                          presharedKeySecretRef:
                            description: |-
                              Optional explicit Secret key override for `WADDLE_SPICEDB_PRESHARED_KEY`.
                              In ESO mode, defaults to the ESO target secret (`WADDLE_SPICEDB_PRESHARED_KEY`).
                              In YOLO mode, defaults to `SpiceDBCluster.spec.secretName` (`preshared_key`).
                            nullable: true
                            properties:
                              key:
                                description: Key inside the `Secret` data map.
                                type: string
                                x-kubernetes-validations:
                                - rule: size(self) > 0
                              name:
                                description: Name of the Kubernetes `Secret` in the same namespace.
                                type: string
                                x-kubernetes-validations:
                                - rule: size(self) > 0
                            required:
                            - key
                            - name
                            type: object
                          requireReady:
                            default: true
                            description: Require `SpiceDBCluster` healthy status and >= 1 ready endpoint before leaving `Pending`.
                            type: boolean
                          serviceName:
                            description: Optional Service name override (defaults to `clusterName`).
                            nullable: true
                            type: string
                        required:
                        - clusterName
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - rule: (self.mode == 'SpiceDbOperator' && has(self.operator) && !has(self.external)) || (self.mode == 'External' && has(self.external) && !has(self.operator))
                type: object
                x-kubernetes-validations:
                - rule: (self.backend == 'OpenFga' && has(self.openfga) && !has(self.spicedb)) || (self.backend == 'SpiceDb' && has(self.spicedb) && !has(self.openfga))
              baseUrl:
                description: Public base HTTP URL (`WADDLE_BASE_URL`).
                type: string
                x-kubernetes-validations:
                - rule: size(self) > 0
              broker:
                description: Optional credential custody and inference egress broker configuration.
                nullable: true
                properties:
                  admissionDb:
                    description: Optional explicit admission database path (`WADDLE_BROKER_ADMISSION_DB`).
                    nullable: true
                    type: string
                  cellSpiffeId:
                    description: Optional SPIFFE ID identifying this cell (`WADDLE_CELL_SPIFFE_ID`).
                    nullable: true
                    type: string
                  dataDir:
                    default: /var/lib/waddle/broker
                    description: Directory storing broker SQLite/Turso databases (`WADDLE_BROKER_DATA_DIR`).
                    type: string
                    x-kubernetes-validations:
                    - rule: size(self) > 0
                  enabled:
                    default: true
                    description: Enable the credential custody and inference egress broker (`WADDLE_BROKER_ENABLED`).
                    type: boolean
                  kms:
                    description: KMS backend configuration (required when `enabled` is `true`).
                    nullable: true
                    properties:
                      provider:
                        default: Scaleway
                        description: KMS provider (`Scaleway`, `Vault`, or `Local`).
                        enum:
                        - Scaleway
                        - Vault
                        - Local
                        type: string
                      scaleway:
                        description: Scaleway Key Manager settings when `provider` is `Scaleway`.
                        nullable: true
                        properties:
                          authSecretRef:
                            description: Same-namespace Secret key containing the Scaleway secret key (`WADDLE_SCW_KMS_AUTH_TOKEN`).
                            properties:
                              key:
                                description: Key inside the `Secret` data map.
                                type: string
                                x-kubernetes-validations:
                                - rule: size(self) > 0
                              name:
                                description: Name of the Kubernetes `Secret` in the same namespace.
                                type: string
                                x-kubernetes-validations:
                                - rule: size(self) > 0
                            required:
                            - key
                            - name
                            type: object
                          baseUrl:
                            default: https://api.scaleway.com
                            description: Scaleway API base URL (`WADDLE_SCW_KMS_BASE_URL`, default `https://api.scaleway.com`).
                            type: string
                            x-kubernetes-validations:
                            - rule: size(self) > 0
                          projectId:
                            description: Scaleway Project ID (`WADDLE_SCW_KMS_PROJECT_ID`).
                            type: string
                            x-kubernetes-validations:
                            - rule: size(self) > 0
                          region:
                            default: fr-par
                            description: Scaleway Key Manager region (`WADDLE_SCW_KMS_REGION`, default `fr-par`).
                            type: string
                            x-kubernetes-validations:
                            - rule: size(self) > 0
                          rootKeyId:
                            description: Optional pre-provisioned Scaleway root key UUID (`WADDLE_SCW_KMS_ROOT_KEY_ID`).
                            nullable: true
                            type: string
                        required:
                        - authSecretRef
                        - projectId
                        type: object
                      vault:
                        description: HashiCorp Vault Transit settings when `provider` is `Vault`.
                        nullable: true
                        properties:
                          authSecretRef:
                            description: Same-namespace Secret key containing the Vault token (`WADDLE_VAULT_TOKEN`).
                            properties:
                              key:
                                description: Key inside the `Secret` data map.
                                type: string
                                x-kubernetes-validations:
                                - rule: size(self) > 0
                              name:
                                description: Name of the Kubernetes `Secret` in the same namespace.
                                type: string
                                x-kubernetes-validations:
                                - rule: size(self) > 0
                            required:
                            - key
                            - name
                            type: object
                          baseUrl:
                            description: Vault API base URL (`WADDLE_VAULT_ADDR`).
                            type: string
                            x-kubernetes-validations:
                            - rule: size(self) > 0
                          mount:
                            default: transit
                            description: Vault transit mount path (`WADDLE_VAULT_TRANSIT_MOUNT`, default `transit`).
                            type: string
                            x-kubernetes-validations:
                            - rule: size(self) > 0
                          namespace:
                            description: Optional Vault namespace (`WADDLE_VAULT_NAMESPACE`).
                            nullable: true
                            type: string
                        required:
                        - authSecretRef
                        - baseUrl
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - rule: (self.provider == 'Scaleway' && has(self.scaleway) && !has(self.vault)) || (self.provider == 'Vault' && has(self.vault) && !has(self.scaleway)) || (self.provider == 'Local' && !has(self.scaleway) && !has(self.vault))
                type: object
                x-kubernetes-validations:
                - rule: '!self.enabled || has(self.kms)'
              clustering:
                default:
                  claimReleaseBudgetSeconds: 5
                  enabled: false
                  enrolledKeyCount: 0
                  keypairHeadroom: 1
                  listenAddrs:
                  - /ip4/0.0.0.0/tcp/7900
                  swarmPort: 7900
                description: ADR-0017 horizontal clustering configuration.
                properties:
                  bootstrapPeers:
                    description: Optional explicit bootstrap peers (`host:port`); empty uses the headless Service.
                    items:
                      type: string
                    type: array
                  claimReleaseBudgetSeconds:
                    default: 5
                    description: Claim-release drain budget in seconds (`WADDLE_CLUSTERING_CLAIM_RELEASE_BUDGET_MS`).
                    format: int64
                    type: integer
                  enabled:
                    default: false
                    description: Enable multi-replica clustering (`WADDLE_CLUSTERING_ENABLED`).
                    type: boolean
                  enrolledKeyCount:
                    default: 0
                    description: Number of enrolled Ed25519 keys in `WADDLE_CLUSTERING_KEYPAIR_POOL`.
                    format: int32
                    type: integer
                  keypairHeadroom:
                    default: 1
                    description: Extra keypair headroom above `replicas + maxSurge` (default `1`).
                    format: int32
                    type: integer
                  listenAddrs:
                    default:
                    - /ip4/0.0.0.0/tcp/7900
                    description: libp2p listen multiaddrs (defaults to `["/ip4/0.0.0.0/tcp/7900"]`).
                    items:
                      type: string
                    type: array
                  swarmPort:
                    default: 7900
                    description: TCP port exposed for swarm traffic (default `7900`).
                    format: uint16
                    maximum: 65535.0
                    minimum: 0.0
                    type: integer
                type: object
              corsOrigins:
                description: Allowed CORS origins (`WADDLE_CORS_ORIGINS`).
                nullable: true
                type: string
              deployment:
                default: {}
                description: Stable deployment lineage UUID and optional one-shot action.
                properties:
                  lineageAction:
                    description: Explicit one-shot lineage action (`"enroll"` or `"adopt=<uuid>[,<uuid>...]"`).
                    nullable: true
                    type: string
                  uuid:
                    description: Stable lower-case RFC-4122 UUID bound into `_lineage`. Required in ESO mode.
                    nullable: true
                    type: string
                type: object
              extensions:
                description: Optional server extensions runtime configuration.
                nullable: true
                properties:
                  enabled:
                    default: true
                    description: Enable server extensions (`WADDLE_EXTENSIONS_ENABLED`).
                    type: boolean
                  pluginsDir:
                    description: Optional path to extension plugin modules (`WADDLE_EXTENSIONS_PLUGINS_DIR`).
                    nullable: true
                    type: string
                type: object
              extraEnv:
                additionalProperties:
                  type: string
                description: Additional non-sensitive environment variables placed in the server `ConfigMap`.
                type: object
              image:
                default:
                  pullPolicy: IfNotPresent
                  repository: ghcr.io/waddle-social/waddle
                  tag: main
                description: Container image specification.
                properties:
                  digest:
                    description: Optional immutable `sha256:...` digest.
                    nullable: true
                    type: string
                  pullPolicy:
                    default: IfNotPresent
                    description: Container image pull policy.
                    enum:
                    - IfNotPresent
                    - Always
                    - Never
                    type: string
                  pullSecrets:
                    description: Names of image pull secrets in the same namespace.
                    items:
                      type: string
                    type: array
                  repository:
                    default: ghcr.io/waddle-social/waddle
                    description: Container image repository (default `ghcr.io/waddle-social/waddle`).
                    type: string
                  tag:
                    default: main
                    description: Mutable image tag (ignored when `digest` is provided).
                    type: string
                type: object
              ingress:
                default:
                  enabled: false
                  poolSize: 4
                  retryAttempts: 5
                description: Durable ingress authority transaction limits.
                properties:
                  byoHttpSection:
                    description: Static HTTP catch-all listener `sectionName` on `gatewayRef` for BYO HTTP-01 and redirects.
                    nullable: true
                    type: string
                  enabled:
                    default: false
                    description: Enable operator-managed per-tenant Gateway API, DNS, and TLS reconciliation.
                    type: boolean
                  gatewayRef:
                    description: Target Gateway API `Gateway` used for tenant `HTTPRoute`s and BYO listeners.
                    nullable: true
                    properties:
                      name:
                        description: '`Gateway` object name (e.g. `waddle-gateway`).'
                        type: string
                        x-kubernetes-validations:
                        - rule: size(self) > 0
                      namespace:
                        description: Namespace containing the `Gateway` (e.g. `default`).
                        type: string
                        x-kubernetes-validations:
                        - rule: size(self) > 0
                    required:
                    - name
                    - namespace
                    type: object
                  managedBaseDomain:
                    description: Managed wildcard base DNS domain for `ManagedSubdomain` tenants (e.g. `waddle.social`).
                    nullable: true
                    type: string
                  managedWildcardHttpSection:
                    description: Static HTTP wildcard listener `sectionName` on `gatewayRef` for managed subdomain redirects.
                    nullable: true
                    type: string
                  managedWildcardHttpsSection:
                    description: Static HTTPS wildcard listener `sectionName` on `gatewayRef` for managed subdomains.
                    nullable: true
                    type: string
                  poolSize:
                    default: 4
                    description: Ingress DB pool size (`1..=32`, default `4`).
                    format: uint32
                    minimum: 0.0
                    type: integer
                  reservedSubdomains:
                    description: |-
                      Additional reserved single-label subdomains under `managedBaseDomain` (merged with
                      the always-enforced built-in reserved floor).
                    items:
                      type: string
                    type: array
                  retryAttempts:
                    default: 5
                    description: Ingress DB retry attempts (`1..=32`, default `5`).
                    format: uint32
                    minimum: 0.0
                    type: integer
                  targetIps:
                    description: Static target IP addresses written into `DNSEndpoint` for `ManagedSubdomain` tenants.
                    items:
                      type: string
                    type: array
                  tlsClusterIssuer:
                    description: '`cert-manager` `ClusterIssuer` name used for `CustomDomain` tenant `Certificate`s.'
                    nullable: true
                    type: string
                type: object
              mode:
                default: HomeServer
                description: Server runtime mode (`HomeServer` or `Standalone`).
                enum:
                - HomeServer
                - Standalone
                type: string
              networkPolicy:
                default:
                  enabled: true
                description: NetworkPolicy settings (applied when clustering is enabled).
                properties:
                  enabled:
                    default: true
                    description: Create a swarm NetworkPolicy when clustering is enabled (default `true`).
                    type: boolean
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                description: Optional node selector labels applied to server pods.
                type: object
              pdb:
                default:
                  enabled: true
                  maxUnavailable: 1
                description: PodDisruptionBudget settings (applied when clustering is enabled).
                properties:
                  enabled:
                    default: true
                    description: Create a PodDisruptionBudget when clustering is enabled (default `true`).
                    type: boolean
                  maxUnavailable:
                    default: 1
                    description: Maximum unavailable pods (default `1`).
                    format: int32
                    type: integer
                type: object
              persistence:
                default:
                  accessModes:
                  - ReadWriteOnce
                  allowUnsafeRwoScale: false
                  enabled: true
                  mountPath: /var/lib/waddle
                  size: 10Gi
                  uploadSubPath: uploads
                description: Persistent volume settings for `/var/lib/waddle`.
                properties:
                  accessModes:
                    default:
                    - ReadWriteOnce
                    description: Requested PVC access modes.
                    items:
                      description: PVC access mode.
                      enum:
                      - ReadWriteOnce
                      - ReadWriteMany
                      - ReadOnlyMany
                      type: string
                    type: array
                  allowUnsafeRwoScale:
                    default: false
                    description: Explicitly permit `RollingUpdate` or `replicas > 1` with `ReadWriteOnce`.
                    type: boolean
                  enabled:
                    default: true
                    description: Create or mount a PersistentVolumeClaim (`false` uses `emptyDir`).
                    type: boolean
                  existingClaim:
                    description: Use an existing same-namespace PVC instead of creating one.
                    nullable: true
                    type: string
                  mountPath:
                    default: /var/lib/waddle
                    description: Mount path inside the server container.
                    type: string
                  size:
                    default: 10Gi
                    description: Storage capacity request (e.g. `"10Gi"`).
                    type: string
                  storageClassName:
                    description: StorageClass name for created PVCs.
                    nullable: true
                    type: string
                  uploadSubPath:
                    default: uploads
                    description: Subdirectory beneath `mountPath` used for `WADDLE_UPLOAD_DIR`.
                    type: string
                type: object
              podAnnotations:
                additionalProperties:
                  type: string
                description: Optional annotations applied to server pods.
                type: object
              podAntiAffinity:
                default:
                  enabled: true
                  topologyKey: kubernetes.io/hostname
                  weight: 50
                description: Pod anti-affinity settings.
                properties:
                  enabled:
                    default: true
                    description: Enable preferred pod anti-affinity across nodes (default `true`).
                    type: boolean
                  topologyKey:
                    default: kubernetes.io/hostname
                    description: Topology key (default `kubernetes.io/hostname`).
                    type: string
                  weight:
                    default: 50
                    description: Scheduling preference weight (`1..=100`, default `50`).
                    format: int32
                    type: integer
                type: object
              podLabels:
                additionalProperties:
                  type: string
                description: Optional extra labels applied to server pods.
                type: object
              probes:
                default:
                  liveness:
                    failureThreshold: 3
                    initialDelaySeconds: 15
                    path: /health
                    periodSeconds: 10
                    timeoutSeconds: 2
                  readiness:
                    failureThreshold: 3
                    initialDelaySeconds: 5
                    path: /ready
                    periodSeconds: 10
                    timeoutSeconds: 2
                description: Container liveness and readiness probe configuration.
                properties:
                  liveness:
                    default:
                      failureThreshold: 3
                      initialDelaySeconds: 15
                      path: /health
                      periodSeconds: 10
                      timeoutSeconds: 2
                    description: Liveness probe (defaults to `/health`).
                    properties:
                      failureThreshold:
                        description: Failures before marking unhealthy.
                        format: int32
                        type: integer
                      initialDelaySeconds:
                        description: Initial delay before first probe.
                        format: int32
                        type: integer
                      path:
                        description: HTTP probe path.
                        type: string
                      periodSeconds:
                        description: Interval between probes.
                        format: int32
                        type: integer
                      timeoutSeconds:
                        description: Probe timeout.
                        format: int32
                        type: integer
                    required:
                    - failureThreshold
                    - initialDelaySeconds
                    - path
                    - periodSeconds
                    - timeoutSeconds
                    type: object
                  readiness:
                    default:
                      failureThreshold: 3
                      initialDelaySeconds: 5
                      path: /ready
                      periodSeconds: 10
                      timeoutSeconds: 2
                    description: Readiness probe (defaults to `/ready`).
                    properties:
                      failureThreshold:
                        description: Failures before marking unhealthy.
                        format: int32
                        type: integer
                      initialDelaySeconds:
                        description: Initial delay before first probe.
                        format: int32
                        type: integer
                      path:
                        description: HTTP probe path.
                        type: string
                      periodSeconds:
                        description: Interval between probes.
                        format: int32
                        type: integer
                      timeoutSeconds:
                        description: Probe timeout.
                        format: int32
                        type: integer
                    required:
                    - failureThreshold
                    - initialDelaySeconds
                    - path
                    - periodSeconds
                    - timeoutSeconds
                    type: object
                type: object
              replicas:
                description: Desired replica count. Omit to allow an external HPA to manage replicas.
                format: int32
                nullable: true
                type: integer
              resources:
                default:
                  limits:
                    cpu: 500m
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    memory: 256Mi
                description: Compute resource requests and limits.
                properties:
                  limits:
                    default:
                      cpu: 500m
                      memory: 512Mi
                    description: Maximum resource limits.
                    properties:
                      cpu:
                        description: CPU quantity string (e.g. `"100m"` or `"1"`).
                        type: string
                      memory:
                        description: Memory quantity string (e.g. `"512Mi"` or `"4Gi"`).
                        type: string
                    required:
                    - cpu
                    - memory
                    type: object
                  requests:
                    default:
                      cpu: 100m
                      memory: 256Mi
                    description: Guaranteed resource requests.
                    properties:
                      cpu:
                        description: CPU quantity string (e.g. `"100m"` or `"1"`).
                        type: string
                      memory:
                        description: Memory quantity string (e.g. `"512Mi"` or `"4Gi"`).
                        type: string
                    required:
                    - cpu
                    - memory
                    type: object
                type: object
              rustLog:
                default: info
                description: Rust `tracing` log filter (`RUST_LOG`).
                type: string
              s2s:
                default:
                  enabled: false
                  port: 5269
                  serviceType: NodePort
                description: Server-to-server XMPP federation configuration.
                properties:
                  configMapName:
                    description: Same-namespace ConfigMap holding `s2s.toml`, mounted at `/etc/waddle/s2s`.
                    nullable: true
                    type: string
                  enabled:
                    default: false
                    description: Enable S2S federation (`WADDLE_S2S_ENABLED`).
                    type: boolean
                  externalIps:
                    description: Optional external IPs bound to the S2S Service.
                    items:
                      type: string
                    type: array
                  nodePort:
                    description: Optional fixed NodePort when `serviceType` is `NodePort`.
                    format: int32
                    nullable: true
                    type: integer
                  port:
                    default: 5269
                    description: S2S TCP port (default `5269`).
                    format: int32
                    type: integer
                  serviceType:
                    default: NodePort
                    description: Kubernetes Service type for S2S traffic.
                    enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                    type: string
                type: object
              s3:
                description: Optional S3-compatible blob storage for uploads.
                nullable: true
                properties:
                  bucket:
                    description: Bucket name (`WADDLE_S3_BUCKET`).
                    type: string
                    x-kubernetes-validations:
