apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: waddletenants.waddle.social
spec:
  group: waddle.social
  names:
    kind: WaddleTenant
    plural: waddletenants
    shortNames:
    - wt
    singular: waddletenant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Canonical tenant DNS domain
      jsonPath: .spec.tenantId
      name: Tenant
      type: string
    - description: Referenced WaddleServer name
      jsonPath: .spec.serverRef.name
      name: Server
      type: string
    - description: Tenant placement mode
      jsonPath: .spec.placementMode
      name: Mode
      type: string
    - description: Current tenant lifecycle phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Provisioned OpenFGA store ID
      jsonPath: .status.openfgaStoreId
      name: StoreID
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Declarative multi-tenant configuration and OpenFGA store lifecycle for a WaddleServer.
        properties:
          spec:
            description: Declarative specification for a `WaddleTenant` resource.
            properties:
              auth:
                description: |-
                  Sign-in providers for this tenant. A tenant without providers has
                  sign-in disabled; it never inherits server-wide providers.
                nullable: true
                properties:
                  providers:
                    default: []
                    description: OIDC or OAuth2 providers users of this tenant can sign in with.
                    items:
                      description: |-
                        A public (PKCE) sign-in client for a tenant. Client secrets are not
                        supported: a static client authenticates with PKCE only, and a dynamically
                        registered client uses the method its provider assigns.
                      properties:
                        authorizationEndpoint:
                          description: Authorization endpoint override (required for `oauth2`).
                          maxLength: 512
                          nullable: true
                          type: string
                        clientId:
                          description: |-
                            Pre-registered public client ID (required unless
                            `dynamicClientRegistration` is set).
                          maxLength: 256
                          type: string
                        displayName:
                          description: Name shown on the sign-in button.
                          maxLength: 128
                          minLength: 1
                          type: string
                        dynamicClientRegistration:
                          description: |-
                            Register a client with the provider at runtime (RFC 7591) instead of
                            using `clientId`.
                          type: boolean
                        emailClaim:
                          description: Claim holding the email address.
                          maxLength: 128
                          nullable: true
                          type: string
                        id:
                          description: Provider identifier, unique within the tenant (used in sign-in URLs).
                          maxLength: 64
                          minLength: 1
                          type: string
                        issuer:
                          description: HTTPS issuer URL (OIDC discovery base).
                          maxLength: 512
                          type: string
                        jwksUri:
                          description: JWKS URI override.
                          maxLength: 512
                          nullable: true
                          type: string
                        kind:
                          description: Provider protocol.
                          enum:
                          - oidc
                          - oauth2
                          type: string
                        requireDpop:
                          description: Bind tokens with DPoP.
                          type: boolean
                        scopes:
                          description: Requested scopes (OIDC providers must include `openid`).
                          items:
                            maxLength: 128
                            type: string
                          maxItems: 16
                          minItems: 1
                          type: array
                        subjectClaim:
                          description: Claim holding the stable subject identifier (default `sub`).
                          maxLength: 128
                          nullable: true
                          type: string
                        tokenEndpoint:
                          description: Token endpoint override (required for `oauth2`).
                          maxLength: 512
                          nullable: true
                          type: string
                        userinfoEndpoint:
                          description: Userinfo endpoint override (required for `oauth2`).
                          maxLength: 512
                          nullable: true
                          type: string
                        usernameClaim:
                          description: Claim used as the username / XMPP localpart.
                          maxLength: 128
                          nullable: true
                          type: string
                      required:
                      - displayName
                      - id
                      - issuer
                      - kind
                      - scopes
                      type: object
                    maxItems: 8
                    type: array
                type: object
              corsOrigins:
                description: |-
                  Extra browser origins (`https://host[:port]`) trusted for this tenant
                  only: allowed by CORS and as sign-in return URLs. Use this for a web
                  client served from a host other than the tenant's server hostnames.
                items:
                  maxLength: 262
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-validations:
                - rule: self.all(o, o.matches('^https?://[^/?#@]+$'))
              extensions:
                description: Optional per-tenant extension and inference provider allowlists.
                nullable: true
                properties:
                  approvedModels:
                    description: Model identifiers approved by tenant policy.
                    items:
                      type: string
                    type: array
                  approvedProviders:
                    description: Inference providers approved by tenant policy (e.g. `openrouter`).
                    items:
                      type: string
                    type: array
                  enabledPlugins:
                    description: Extension plugin identifiers enabled for this tenant.
                    items:
                      type: string
                    type: array
                  zdrRequired:
                    default: false
                    description: Require Zero Data Retention (ZDR) endpoints for inference requests.
                    type: boolean
                type: object
              ingress:
                description: Optional per-tenant domain routing and Gateway API / TLS ingress configuration.
                nullable: true
                properties:
                  hostnames:
                    description: Explicit lower-case FQDNs served for this tenant (defaults to `[spec.tenantId]` when empty).
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-validations:
                    - rule: self.all(h, size(h) > 0 && h.matches('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$'))
                  mode:
                    default: Auto
                    description: Ingress reconciliation mode (`Auto`, `ManagedSubdomain`, `CustomDomain`, or `Disabled`).
                    enum:
                    - Auto
                    - ManagedSubdomain
                    - CustomDomain
                    - Disabled
                    type: string
                type: object
              owners:
                description: Localparts granted initial tenant owner privileges.
                items:
                  type: string
                type: array
              placementMode:
                default: SharedPool
                description: Tenant placement mode (`SharedPool` or `DedicatedCell`).
                enum:
                - SharedPool
                - DedicatedCell
                type: string
              quotas:
                description: Optional per-tenant connection, room, storage, and inference spend quotas.
                nullable: true
                properties:
                  maxConcurrentConnections:
                    description: Maximum concurrent XMPP/WebSocket sessions for this tenant.
                    format: uint32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  maxInferenceSpendMicrocents:
                    description: Maximum inference spend budget in microcents.
                    format: uint64
                    minimum: 0.0
                    nullable: true
                    type: integer
                  maxRooms:
                    description: Maximum rooms/channels allowed in this tenant.
                    format: uint32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  maxStorageBytes:
                    description: Maximum aggregate tenant storage in bytes.
                    format: uint64
                    minimum: 0.0
                    nullable: true
                    type: integer
                type: object
              serverRef:
                description: Reference to the `WaddleServer` hosting this tenant in the same namespace.
                properties:
                  name:
                    description: Name of the referenced Kubernetes resource in the same namespace.
                    type: string
                    x-kubernetes-validations:
                    - rule: size(self) > 0
                required:
                - name
                type: object
              tenantId:
                description: Canonical lower-case DNS domain identifying the tenant (e.g. `waddle.social`).
                maxLength: 253
                type: string
                x-kubernetes-validations:
                - rule: size(self) > 0 && self.matches('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$')
            required:
            - serverRef
            - tenantId
            type: object
          status:
            description: Observed status subresource for `WaddleTenant`.
            nullable: true
            properties:
              conditions:
                description: Standard Kubernetes status conditions keyed by `type`.
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              hostnames:
                description: Effective hostnames projected and routed for this tenant.
                items:
                  type: string
                type: array
              leaseEpoch:
                description: Current placement lease epoch assigned to this tenant.
                format: uint64
                minimum: 0.0
                nullable: true
                type: integer
              observedGeneration:
                description: Latest `.metadata.generation` processed by the controller.
                format: int64
                nullable: true
                type: integer
              openfgaModelId:
                description: Provisioned immutable OpenFGA authorization model ID for this tenant.
                nullable: true
                type: string
              openfgaStoreId:
                description: Provisioned OpenFGA store ID for this tenant.
                nullable: true
                type: string
              phase:
                description: Current tenant lifecycle phase.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Degraded
                - Terminating
                type: string
            required:
            - phase
            type: object
        required:
        - spec
        title: WaddleTenant
        type: object
    served: true
    storage: true
    subresources:
      status: {}
