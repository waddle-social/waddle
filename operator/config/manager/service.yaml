apiVersion: v1
kind: Service
metadata:
  name: waddle-operator-metrics
  namespace: waddle-operator-system
  labels:
    app.kubernetes.io/name: waddle-operator
    app.kubernetes.io/component: controller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: waddle-operator
    app.kubernetes.io/component: controller
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
