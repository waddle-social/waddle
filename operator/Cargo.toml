[workspace]
resolver = "2"
members = [
    "crates/waddle-operator-crd",
    "crates/waddle-operator-fsm",
    "crates/waddle-operator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Waddle Contributors"]
repository = "https://github.com/waddle-social/waddle"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
ref_option = "warn"
undocumented_unsafe_blocks = "warn"
wildcard_imports = "warn"
unwrap_used = "deny"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
ed25519-dalek = "3.0"
futures = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
k8s-openapi = { version = "0.29", features = ["v1_33", "schemars"] }
kube = { version = "5.1", default-features = false }
proptest = "1.5"
rand = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
schemars = { version = "1.2", features = ["chrono04"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
